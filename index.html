<!--
  PAX GNOMANIA — the web game. Roman Britain, AD 122. You fly Hadrian's secret Ornithopter
  Corps over the Red Hat gnome legion's advance and bring the stranded out on a rope.

  ITS OWN GAME. Not SUCK UP, not THE GUNPOWDER HORROR. Every picture on this page comes from
  the HADRIAN'S ANCIENT AIR FORCE repo (web/art/, built by tools/build_web_art.py from
  assets/). Code ideas are ported from SUCK UP's AIRY pages (the render-only air-cushion
  glide, the rope/ladder rescue rules, the in-page ?selftest) — no art.

  Offline, single page, nothing off-box: no CDN, no web fonts, no analytics.

  URL switches (all documented in the README):
    (none)        the ATTRACT — the TruthJunket special, theme music, any key -> title
    ?title        the title menu            ?campaign   the march from Dover
    ?front=N      straight to front N (1-5) ?march      the campaign map
    ?selftest     proof-of-life report      ?demo       autopilot (with ?front=N)
    &go           skip the briefing card    &seed=N     fix the gameplay RNG
    &ff=S         fast-forward S seconds of play under the autopilot (&idle = hands off)
    &shot=win|fail  run the front to its results / failure screen (the screenshot rig)
-->

/* ---------- RNG: gameplay draws ONLY from rng(); visuals use Math.random ---------- */
var SEED = +(qp('seed')||0) || ((Math.random()*1e9)|0);
var _s = SEED>>>0;
function seed(n){ _s = n>>>0; }
function rng(){ _s=(_s+0x6D2B79F5)|0; var t=Math.imul(_s^(_s>>>15),1|_s); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }
function rr(a,b){ return a+(b-a)*rng(); }
function vr(a,b){ return a+(b-a)*Math.random(); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function lerp(a,b,u){ return a+(b-a)*u; }
function ease(u){ u=clamp(u,0,1); return u*u*(3-2*u); }

function ok(n){ var im=IMG[n]; return !!(im&&im.ok); }
function ar(n){ var im=IMG[n]; return ok(n) ? im.naturalWidth/im.naturalHeight : 1; }
// draw a sprite by HEIGHT, anchored at its feet (x centre, y bottom). flip faces it left.
function spr(n,x,yb,h,o){ o=o||{}; if(!ok(n)) return false; var w=h*ar(n);
  ctx.save(); ctx.globalAlpha=(o.a==null?1:o.a); ctx.translate(x, yb-h/2); if(o.rot) ctx.rotate(o.rot); if(o.flip) ctx.scale(-1,1);
  ctx.drawImage(IMG[n],-w/2,-h/2,w,h); ctx.restore(); return true; }
// draw a sprite by WIDTH, centred
function sprC(n,x,y,w,o){ o=o||{}; if(!ok(n)) return false; var h=w/ar(n);
  ctx.save(); ctx.globalAlpha=(o.a==null?1:o.a); ctx.translate(x,y); if(o.rot) ctx.rotate(o.rot); if(o.flip) ctx.scale(-1,1); if(o.sc) ctx.scale(o.sc,o.sc);
  ctx.drawImage(IMG[n],-w/2,-h/2,w,h); ctx.restore(); return true; }
// TINT CACHE: silhouette recolour (sil) or atmospheric haze (haze 0..1 toward a colour)

function tinted(n,col,amt,sil){

  x.drawImage(im,0,0); x.globalCompositeOperation='source-atop'; x.globalAlpha=sil?1:amt; x.fillStyle=col; x.fillRect(0,0,c.width,c.height);

}

var AU={ unlocked:false, blocked:false, muted:false, cur:null, curName:'', ac:null, st:{} };
function musicPath(name){ return name==='theme' ? MUSIC_THEME : 'audio/music/'+name+'.mp3'; }
function playMusic(name, vol){
  if(NODE||AU.off||AU.curName===name) return; vol=vol==null?0.8:vol;
  var old=AU.cur; AU.cur=null; AU.curName=name;
  if(old){ fadeEl(old,0,600,true); }
  if(!name) return;
  var el=new Audio(musicPath(name)); el.loop=true; el.volume=0; el._v=vol;
  el.onerror=function(){ if(AU.cur===el) AU.cur=null; };
  AU.cur=el;
  var p=el.play(); if(p&&p.then) p.then(function(){ AU.blocked=false; fadeEl(el, AU.muted?0:vol, 900); }).catch(function(){ AU.blocked=true; });
}
function fadeEl(el,to,ms,stop){ var from=el.volume, t0=performance.now(); (function step(){ var u=clamp((performance.now()-t0)/ms,0,1); try{ el.volume=from+(to-from)*u; }catch(e){}
  if(u<1) requestAnimationFrame(step); else if(stop){ el.pause(); } })(); }
function restartMusic(){ if(AU.cur){ try{ AU.cur.currentTime=0; }catch(e){} } }
function unlockAudio(){
  if(NODE||AU.unlocked) return; AU.unlocked=true;
  try{ AU.ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  if(AU.cur && AU.blocked){ var n=AU.curName; AU.curName=''; playMusic(n); }
}

function sfx(slot){
  if(NODE||AU.off||!AU.unlocked||AU.muted) return;
  var nv=SFX_VARIANTS[slot]; if(nv){ var v=1+((Math.random()*nv)|0); if(v>1){ var vs=slot+'_'+v; if(!(AU.st[vs]&&AU.st[vs].state==='missing')){ slot=vs; if(!SFX_SLOTS[vs]) SFX_SLOTS[vs]=SFX_SLOTS[slot.replace(/_\d+$/,'')]; } } }
  var s=AU.st[slot];
  if(s===undefined){ var el=new Audio('audio/sfx/'+slot+'.mp3'); AU.st[slot]={el:el,state:'pending'};
    el.oncanplaythrough=function(){ AU.st[slot].state='ok'; }; el.onerror=function(){ AU.st[slot].state='missing'; }; el.load(); s=AU.st[slot]; }
  if(s.state==='ok'){ try{ var c=s.el.cloneNode(); c.volume=0.9; c.play().catch(function(){}); }catch(e){} return; }
  synth(slot);
}
function synth(slot){
  var d=SFX_SLOTS[slot], ac=AU.ac; if(!d||!ac) return;
  try{ var t=ac.currentTime, g=ac.createGain(); g.gain.setValueAtTime(d[4],t); g.gain.exponentialRampToValueAtTime(0.0008,t+d[3]); g.connect(ac.destination);
    if(d[5]){ var len=Math.max(1,(ac.sampleRate*d[3])|0), buf=ac.createBuffer(1,len,ac.sampleRate), ch=buf.getChannelData(0);
      for(var i=0;i<len;i++) ch[i]=(Math.random()*2-1)*(1-i/len); var nz=ac.createBufferSource(); nz.buffer=buf;
      var bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=d[1]; nz.connect(bp); bp.connect(g); nz.start(t); }
    var o=ac.createOscillator(); o.type=d[0]; o.frequency.setValueAtTime(d[1],t); o.frequency.exponentialRampToValueAtTime(Math.max(20,d[2]),t+d[3]);
    var og=ac.createGain(); og.gain.value=d[5]?0.4:1; o.connect(og); og.connect(g); o.start(t); o.stop(t+d[3]+0.02);
  }catch(e){}
}

/* =====================================================================
   THE FLIGHT — the house air-cushion glide (ported from SUCK UP AIRY):
   input moves a TARGET in steps; the craft springs after it.
   ===================================================================== */
var GLIDE=true, ACCEL=210, DAMP=27, STEP=20, REPEAT=0.055, DELAY=0.11;
function spring(o,tx,ty,dt){
  if(!GLIDE){ o.x=tx; o.y=ty; o.vx=o.vy=0; return; }
  var ox=o.x, oy=o.y;
  o.vx += ((tx-o.x)*ACCEL - o.vx*DAMP)*dt; o.vy += ((ty-o.y)*ACCEL - o.vy*DAMP)*dt;
  o.x += o.vx*dt; o.y += o.vy*dt;
  if((tx-ox)*(tx-o.x)<0){ o.x=tx; o.vx=0; } if((ty-oy)*(ty-o.y)<0){ o.y=ty; o.vy=0; }
}

function readPad(){
  if(NODE||!navigator.getGamepads) return; var gps=navigator.getGamepads(), g=null;
  for(var i=0;i<gps.length;i++) if(gps[i]&&gps[i].connected){ g=gps[i]; break; }
  pad={left:0,right:0,up:0,down:0,ray:0,spin:0,start:0,back:0}; if(!g) return;
  var ax=g.axes[0]||0, ay=g.axes[1]||0, b=function(i){ return g.buttons[i]&&g.buttons[i].pressed?1:0; };
  pad.left=(ax<-0.45||b(14))?1:0; pad.right=(ax>0.45||b(15))?1:0; pad.up=(ay<-0.45||b(12))?1:0; pad.down=(ay>0.45||b(13))?1:0;
  pad.ray=b(0)||b(7); pad.spin=b(1)||b(2)||b(6); pad.start=b(9); pad.back=b(8);
  var edges=['up','down','left','right','ray','spin','start','back'];
  for(var k=0;k<edges.length;k++){ var e=edges[k]; if(pad[e]&&!padWas[e]) onPress(padKey(e)); padWas[e]=pad[e]; }
}
function padKey(e){ return {up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight',ray:' ',spin:'f',start:'Enter',back:'Escape'}[e]; }
if(!NODE){
  addEventListener('keydown',function(e){ unlockAudio(); var k=e.key.length===1?e.key.toLowerCase():e.key; if(!keys[k]){ keys[k]=1; onPress(k); }
    if(/^(Arrow| )/.test(e.key)||e.key===' ') e.preventDefault(); });
  addEventListener('keyup',function(e){ var k=e.key.length===1?e.key.toLowerCase():e.key; keys[k]=0; });
  addEventListener('blur',function(){ keys={}; });
  addEventListener('pointerdown',function(){ unlockAudio(); if(state==='attract') onPress('Enter'); });
}
function gatherInput(){
  if(autopilot){ var a=autopilot(); inp.left=a.left|0; inp.right=a.right|0; inp.up=a.up|0; inp.down=a.down|0; inp.ray=a.ray|0; inp.spin=a.spin|0; return; }
  inp.left = keys.ArrowLeft||keys.a||pad.left?1:0; inp.right= keys.ArrowRight||keys.d||pad.right?1:0;
  inp.up   = keys.ArrowUp||keys.w||pad.up?1:0;     inp.down = keys.ArrowDown||keys.s||pad.down?1:0;

function onPress(k){
  idleT=0;
  if(k==='m'){ AU.muted=!AU.muted; if(AU.cur) AU.cur.volume=AU.muted?0:(AU.cur._v||0.8); flash(AU.muted?'SOUND OFF':'SOUND ON','#efe3c4',0.8); return; }
  if(k==='g'&&state==='play'){ GLIDE=!GLIDE; flash('GLIDE '+(GLIDE?'ON':'OFF'),'#efe3c4',0.7); return; }
  var go = (k===' '||k==='Enter'), back=(k==='Escape');
  if(state==='attract'){ toTitle(); sfx('menu_select'); return; }
  if(state==='title'){
    if(k==='ArrowUp'||k==='w'){ menuI=(menuI+MENU.length-1)%MENU.length; sfx('menu_move'); }
    else if(k==='ArrowDown'||k==='s'){ menuI=(menuI+1)%MENU.length; sfx('menu_move'); }
    else if(go){ sfx('menu_select');
      if(menuI===0){ campaign=true; score=0; startFront(0); }
      else if(menuI===1){ state='select'; selI=0; }
      else if(menuI===2){ toAttract(); }
      else { state='howto'; } }
    else if(back){ toAttract(); }
    return;
  }
  if(state==='howto'){ if(go||back){ sfx('menu_back'); state='title'; } return; }
  if(state==='select'){
    var built=MARCH.filter(function(m){return m.f!=null;});
    if(k==='ArrowUp'||k==='w'){ selI=(selI+built.length-1)%built.length; sfx('menu_move'); }
    else if(k==='ArrowDown'||k==='s'){ selI=(selI+1)%built.length; sfx('menu_move'); }
    else if(/^[1-5]$/.test(k)){ selI=+k-1; campaign=false; score=0; sfx('menu_select'); startFront(built[selI].f); }
    else if(go){ campaign=false; score=0; sfx('menu_select'); startFront(built[selI].f); }
    else if(back){ sfx('menu_back'); state='title'; }
    return;
  }
  if(state==='brief'){ if(go){ sfx('menu_select'); beginPlay(); } else if(back){ sfx('menu_back'); toTitle(); } return; }
  if(state==='play'){ if(back){ toTitle(); } else if(k==='r'&&!demo){ retryFront(); } return; }
  if(state==='failed'){ if(go||k==='r'){ sfx('menu_select'); retryFront(); } else if(back){ sfx('menu_back'); toTitle(); } return; }
  if(state==='results'){ if(rt<0.8) return;
    if(k==='r'){ sfx('menu_select'); retryFront(); return; }
    if(go){ sfx('menu_select'); if(campaign){ state='march'; rt=0; playMusic('theme',0.6); } else { state='select'; playMusic('theme',0.6); } }
    else if(back){ toTitle(); } return; }
  if(state==='march'){ if(go){ sfx('menu_select'); var nx=nextBuilt(fi); if(nx<0){ state='end'; rt=0; } else startFront(nx); } else if(back){ toTitle(); } return; }
  if(state==='end'){ if(go||back){ sfx('menu_select'); toTitle(); } return; }
}
function nextBuilt(f){ for(var i=0;i<MARCH.length;i++) if(MARCH[i].f===f){ for(var j=i+1;j<MARCH.length;j++) if(MARCH[j].f!=null) return MARCH[j].f; } return -1; }
function toTitle(){ demo=false; autopilot=null; state='title'; rt=0; idleT=0; playMusic('theme',0.75); }
function toAttract(){ demo=false; autopilot=null; state='attract'; rt=0; atk=0; atT=0; playMusic('theme',0.8); restartMusic(); }

/* =====================================================================
   UPDATE — the sim (play state only). Fixed rules, rng() only.
   ===================================================================== */
function update(dt){
  simT+=dt; stageClock-=dt; if(msgT>0) msgT-=dt; if(shake>0) shake=Math.max(0,shake-dt*40);
  if(P.stun>0) P.stun-=dt; if(P.invuln>0) P.invuln-=dt;
  var el=F.clock-stageClock;
  gatherInput(); pump(dt);
  var px=P.x, py=P.y; spring(P,P.tx,P.ty,dt); P.spd=Math.hypot(P.x-px,P.y-py)/Math.max(dt,1e-6);
  if(P.spd>SWOOP_SPD && !P.swoopOn && simT>=(P.swoopCd||0) && P.stun<=0){ sfx('swoop'); P.swoopCd=simT+SWOOP_CD; } P.swoopOn=P.spd>SWOOP_SPD*0.7;   // FLYER 3/4
  P.bank += (clamp(P.vx/190,-1,1)-P.bank)*Math.min(1,7*dt);
  if(Math.abs(P.vx)>40) P.face = P.vx>0?1:-1;
  if(inp.spin && !spinWas && simT>=P.spinCd && P.stun<=0){ P.spinU=simT+SPIN_TIME; P.spinCd=simT+SPIN_CD; sfx('spin'); stats.spun++; }
  spinWas=inp.spin;

  if(F.water && el>=F.water.start) waterY -= F.water.rate*dt;
  legionTick(dt, el); siegeTick(dt, el); hazardTick(dt, el); shotTick(dt); rayTick(dt); rescueTick(dt, el); tipsTick(); barkTick();
  for(var f=fx.length-1;f>=0;f--){ fx[f].t+=dt; if(fx[f].t>fx[f].life) fx.splice(f,1); }
  endCheck();
}
function pump(dt){
  var dirs=['left','right','up','down'], bb=maxY();
  P.raying = !!(inp.ray && P.stun<=0 && !spinning());
  for(var i=0;i<4;i++){ var d=dirs[i], h=inp[d] && !P.raying && P.stun<=0;
    if(h && !was[d]){ nf[d]=simT; was[d]=1; nf[d+'_first']=1; }
    if(!h){ was[d]=0; continue; }
    if(simT>=nf[d]){
      if(d==='left') P.tx-=STEP; else if(d==='right') P.tx+=STEP; else if(d==='up') P.ty-=STEP; else P.ty+=STEP;
      nf[d] = nf[d+'_first'] ? simT+DELAY : nf[d]+REPEAT; nf[d+'_first']=0;
    }
  }
  P.tx=clamp(P.tx,60,LW-60); P.ty=clamp(P.ty,BAND_TOP,bb);
}
// how low the craft may fly: the rope's end can reach a standing figure's hands; a rider's feet never go into the ground
function maxY(){ var r=onRope(), m=bandBot(); if(r){ m=Math.min(m, GY()+4-r.w.h-ANCHOR-ROPE_LEN); } return m; }

/* ---------- the Red Hat Legion on foot ---------- */
function spawnGnome(kindName, x, dir, y){
  var k=LEGION[kindName]; legion.push({ kind:kindName, k:k, x:x, bornX:x, y:y==null?GY():y, dir:dir, lock:0, lifting:false, gone:false, strikeCd:rr(0.4,1.0), climb:false, hunts:!!F.legion.hunts });
}
function legionTick(dt, el){
  var Lg=F.legion;
  if(el>=legionT && stageClock>(Lg.stopAt||6)){ legionT=el+Lg.every*rr(0.85,1.15);
    var live=0; for(var i=0;i<legion.length;i++) if(!legion[i].gone) live++;
    for(var n=0;n<Lg.size && live<Lg.max;n++,live++){
      var fromL = Lg.from==='left' ? true : Lg.from==='right' ? false : rng()<0.5;
      spawnGnome(Lg.kinds[(rng()*Lg.kinds.length)|0], fromL? -30-n*46 : LW+30+n*46, fromL?1:-1);
    }
  }
  for(var q=0;q<gear.length;q++){ gear[q].att=0; gear[q].q=0; }
  for(var i=legion.length-1;i>=0;i--){ var g=legion[i];
    if(g.gone){ legion.splice(i,1); continue; }
    if(g.lifting) continue;
    if(g.climb){ g.y-=g.climbV*dt; if(g.y<=GY()){ g.y=GY(); g.climb=false; g.dir = g.x<800?1:-1; } continue; }
    var tgt=null, td=1e9;
    if(g.hunts) for(var q=0;q<friends.length;q++){ var fr=friends[q]; if(fr.st!=='ground') continue; var d=Math.abs(fr.x-g.x); if(d<td){ td=d; tgt=fr; } }
    if(tgt){ g.dir = tgt.x>g.x?1:-1;
      var gb = gear.length ? gearBlock(g,tgt) : null;
      if(gb){ g.grab=0; g.grabbing=null; hackGear(g,gb,dt); }
      else if(td>30){ g.x += g.dir*g.k.spd*dt; g.grab=0; g.grabbing=null; }
      else { if(g.grabbing!==tgt){ g.grab=0; g.grabbing=tgt; } g.grab+=dt; if(g.grab>=CAPTURE_TIME){ g.grab=0; g.grabbing=null; loseFriend(tgt,'captured'); } } }
    else {
      g.grab=0; g.grabbing=null;
      g.x += g.dir*g.k.spd*dt;
      if(Lg.xmax && g.x>Lg.xmax){ g.dir=-1; } if(Lg.xmax && g.x<20 && g.dir<0){ g.dir=1; }
      if((g.dir>0 && g.x>LW+60) || (g.dir<0 && g.x<-60)) g.gone=true;
    }
  }
}
/* ---------- THE WHITE HORSE VALE: the construction gear is the soak (no walls) ----------
   A red hat whose way to the stranded runs through a standing machine stops and hacks at it; GEAR_HP strikes wreck it, and
   at most GEAR_CREW swing at once (the rest wait their turn — a knot of red hats, a gift to THE RAY). */
var GEAR={ onager:{art:'wh_onager', h:96, name:'THE CATAPULT', reach:78}, ballista:{art:'wh_ballista', h:88, name:'THE BALLISTA', reach:50},
            cart:{art:'wh_cart', h:78, name:'THE CART', reach:72} };   // reach: where a red hat stands to hack it (the machine's half-width)
var GEAR_HP=3, GEAR_SWING=1.5, GEAR_CREW=2, GEAR_QUEUE=24;
function gearRank(g,p){ // how many red hats are ahead of this one at this machine (the nearest GEAR_CREW swing, the rest queue)
  var a=(p.x-g.x)*g.dir, r=0;
  for(var i=0;i<legion.length;i++){ var o=legion[i]; if(o===g||o.gone||o.lifting||o.climb||o.dir!==g.dir) continue; var b=(p.x-o.x)*o.dir;
    if(b>-6 && b<p.G.reach+GEAR_QUEUE*6 && (b<a || (b===a && i<legion.indexOf(g)))) r++; }
  return r; }
function gearBlock(g,tgt){ for(var i=0;i<gear.length;i++){ var p=gear[i]; if(p.wreck) continue; var ahead=(p.x-g.x)*g.dir;
    if(ahead<-6 || (tgt.x-p.x)*g.dir<=0) continue;
    var rk=gearRank(g,p), reach=p.G.reach+GEAR_QUEUE*Math.max(0,rk-GEAR_CREW+1);   // the queue stands back a pace each
    if(ahead<reach){ g.rank=rk; return p; } } return null; }
function hackGear(g,p,dt){
  if(g.rank>=GEAR_CREW){ g.swing=0; p.q++; return; } p.att++;
  g.swing=(g.swing||0)+dt; if(g.swing<GEAR_SWING) return; g.swing=0; p.hp--; p.hitT=simT; sfx('clank'); fxAdd(p.x+rr(-20,20),GY()-p.G.h*0.5,'spark','#ffd27a',0.3);
  if(p.hp<=0){ p.wreck=true; fxAdd(p.x,GY()-30,'dust',null,0.8); sfx('stone_impact'); flash(p.G.name+' IS WRECKED — THE WAY IS OPEN','#ff8a5a',1.3); }
}
function gearUp(){ var n=0; for(var i=0;i<gear.length;i++) if(!gear[i].wreck) n++; return n; }
/* ---------- W1: scaling ladders on the Wall ---------- */
var SIEGE_TELE=3.0, SIEGE_EVERY=4.2, SIEGE_PER=3, CLIMB_V=44;
function siegeTick(dt, el){
  for(var i=0;i<siege.length;i++){ var s=siege[i];
    if(s.st==='pending' && el>=s.at){ s.st='raise'; s.t=0; flash('SCALING LADDERS ON THE WALL','#ff7a5a',1.4); sfx('ladders_up'); hzLog.push({type:'ladders', tele:SIEGE_TELE}); }
    else if(s.st==='raise'){ s.t+=dt; if(s.t>=SIEGE_TELE){ s.st='active'; s.nextT=0; } }
    else if(s.st==='active'){ s.nextT-=dt;
      if(s.nextT<=0 && s.sent<SIEGE_PER){ s.sent++; s.nextT=SIEGE_EVERY;
        spawnGnome(rng()<0.5?'axe':'spear', s.x+rr(-6,6), s.x<800?1:-1, LH-30); var g=legion[legion.length-1]; g.climb=true; g.climbV=CLIMB_V*rr(0.9,1.1); }
      if(s.sent>=SIEGE_PER) s.st='done'; }
  }
}

/* =====================================================================
   THE DODGE — every hazard is TELEGRAPHED before it can hurt. Each logs
   how long it warned (hzLog) and the ?selftest holds it to HZ_MIN.
   ===================================================================== */
function hazardTick(dt, el){
  var H=F.hazards||{};
  function due(k){ if(H[k] && el>=hzT[k] && stageClock>3){ hzT[k]=el+H[k].every*rr(0.8,1.2); return true; } return false; }
  if(due('bolts')) spawnShooter('bolt', false);
  if(due('upbolts')) spawnShooter('bolt', true);
  if(due('arrows')) spawnShooter('arrow', false);
  if(due('thopters')) spawnThopter();
  if(due('gliders')) spawnGlider();
  if(due('stones')) spawnStone();
  for(var i=haz.length-1;i>=0;i--){ var h=haz[i]; h.t+=dt;
    if(h.k==='shooter') tickShooter(h,dt); else if(h.k==='thopter') tickThopter(h,dt); else if(h.k==='glider') tickGlider(h,dt); else if(h.k==='stone') tickStone(h,dt);
    if(h.done) haz.splice(i,1);
  }
}
function liveShooters(){ var n=0; for(var i=0;i<haz.length;i++) if(haz[i].k==='shooter'&&haz[i].st!=='fired') n++; return n; }
function spawnShooter(type, up){
  if(liveShooters()>=2) return;
  var S=SHOOTER[type], x;
  if(type==='arrow'){ do { x=rr(240,LW-120); } while(Math.abs(x-P.x)<220); }
  else { x = rng()<0.5 ? rr(60,300) : rr(LW-300,LW-60); if(up) x=rr(120,LW-120); }
  var gy = up ? LH-24 : GY();
  haz.push({ k:'shooter', type:type, S:S, up:!!up, st:'setup', t:0, x:x, gy:gy, y:gy-S.crewH*0.6, ax:P.x, ay:P.y, aimT:0 });
}
function tickShooter(h,dt){
  var S=h.S;
  if(h.st==='setup'){ if(h.t>=S.setup){ h.st='aim'; h.t=0; sfx('bolt_aim'); } return; }
  if(h.st==='aim'){
    h.aimT=h.t;
    if(h.t<S.track){ h.ax=P.x; h.ay=P.y; }
    else if(!h.locked){ h.locked=true; sfx('bolt_lock'); }
    if(h.t>=S.track+S.lock){
      var dx=h.ax-h.x, dy=h.ay-h.y, L=Math.hypot(dx,dy)||1;
      shots.push({ kind:S.shot, x:h.x, y:h.y, vx:dx/L*S.speed, vy:dy/L*S.speed, t:0, life:2.4, tele:h.aimT, type:h.up?'upbolt':h.type });
      hzLog.push({ type:h.up?'upbolt':h.type, tele:h.aimT });
      h.st='fired'; h.t=0; sfx(S.shot==='arrow'?'arrow_loose':'bolt_fire'); fxAdd(h.x,h.y,'spark','#ffd27a',0.25);
    }
    return;
  }
  if(h.st==='fired' && h.t>=0.8) h.done=true;
}
function spawnThopter(){ var dir=rng()<0.5?1:-1;
  haz.push({ k:'thopter', st:'warn', t:0, dir:dir, x:dir>0?-200:LW+200, y:clamp(P.y,BAND_TOP,bandBot()), art:rng()<0.5?'taken_thopter':'taken_thopter_b' }); sfx('thopter_warn'); }
function tickThopter(h,dt){
  if(h.st==='warn'){ if(h.t>=THOPTER_TELE){ h.st='cross'; h.warned=h.t; h.t=0; hzLog.push({type:'thopter', tele:h.warned}); sfx('thopter_pass'); } return; }
  if(h.st==='cross'){ h.x += h.dir*THOPTER_SPEED*dt;
    if(!h.hit && Math.abs(h.x-P.x)<THOPTER_HW && Math.abs(h.y-P.y)<THOPTER_HH){
      if(spinning()){ h.hit=true; retreat(h,'SENT PACKING'); score+=250; sfx('clank'); }
      else if(P.invuln<=0){ h.hit=true; hitPlayer('thopter'); retreat(h); } }
    var r=onRope(); if(r && !h.hit && Math.abs(h.x-r.x)<THOPTER_HW*0.8 && Math.abs(h.y-(r.y-r.w.h*0.5))<THOPTER_HH+10) releaseFriend(r,'CLIPPED BY A TAKEN THOPTER — THEY LET GO');
    if((h.dir>0&&h.x>LW+260)||(h.dir<0&&h.x<-260)){ if(!h.hit) stats.dodged++; h.done=true; }
    return; }
  if(h.st==='retreat'){ h.x += h.dir*THOPTER_SPEED*0.45*dt; h.y -= 140*dt; h.sc=Math.max(0.15,(h.sc||1)-dt*0.55); if(h.t>2.2) h.done=true; }
}
function retreat(h,label){ h.st='retreat'; h.t=0; h.sc=1; if(label) flash(label,'#9fe08a',0.9); }   // planes RETREAT into the distance — never crash
function spawnGlider(){ var dir=rng()<0.5?1:-1, y=clamp(P.y+rr(-50,50),BAND_TOP,bandBot());
  haz.push({ k:'glider', st:'warn', t:0, dir:dir, x:dir>0?-90:LW+90, y:y, base:y, amp:rr(26,46), ph:rr(0,6), art:rng()<0.5?'glider':'glider_b' }); sfx('glider_warn'); }
function tickGlider(h,dt){
  if(h.st==='warn'){ if(h.t>=GLIDER_TELE){ h.st='fly'; h.warned=h.t; h.t=0; sfx('glider_pass'); hzLog.push({type:'glider', tele:h.warned}); } return; }
  if(h.st==='fly'){ h.x+=h.dir*GLIDER_SPEED*dt; h.y=h.base+Math.sin(h.t*2.2+h.ph)*h.amp;
    if(!h.hit && Math.hypot(h.x-P.x,h.y-P.y)<GLIDER_R){
      if(spinning()){ h.hit=true; retreat(h,'SENT PACKING'); score+=200; sfx('clank'); }
      else if(P.invuln<=0){ h.hit=true; hitPlayer('glider'); retreat(h); } }
    var r=onRope(); if(r && !h.hit && Math.hypot(h.x-r.x,h.y-(r.y-r.w.h*0.5))<GLIDER_R*0.8) releaseFriend(r,'A GLIDER CLIPPED THE ROPE — THEY LET GO');
    if((h.dir>0&&h.x>LW+120)||(h.dir<0&&h.x<-120)){ if(!h.hit) stats.dodged++; h.done=true; }
    return; }
  if(h.st==='retreat'){ h.x+=h.dir*GLIDER_SPEED*0.5*dt; h.y-=120*dt; h.sc=Math.max(0.15,(h.sc||1)-dt*0.6); if(h.t>2.0) h.done=true; }
}
function spawnStone(){ var fromL=P.x>LW/2, cx=fromL?70:LW-70;
  haz.push({ k:'stone', st:'aim', t:0, cx:cx, cy:GY()-40, tx:P.x, ty:P.y, fromL:fromL }); sfx('stone_launch'); }
function stonePos(h,u){ var mx=(h.cx+h.tx)/2, my=Math.min(h.cy,h.ty)-320; var a=(1-u)*(1-u), b=2*(1-u)*u, c=u*u; return { x:a*h.cx+b*mx+c*h.tx, y:a*h.cy+b*my+c*h.ty }; }
function tickStone(h,dt){
  if(h.st==='aim'){ if(h.t>=STONE_TELE){ h.st='fly'; h.t=0; } return; }
  if(h.st==='fly'){ if(h.t>=STONE_FLY){
      h.st='done'; h.done=true; hzLog.push({type:'stone', tele:STONE_TELE}); sfx('stone_impact');
      fxAdd(h.tx,h.ty,'dust',null,0.6);
      if(Math.hypot(P.x-h.tx,P.y-h.ty)<STONE_R){
        if(spinning()){ flash('CLANK — THE SCREW TURNS IT','#9fe08a',0.8); sfx('clank'); score+=100; }
        else if(P.invuln<=0) hitPlayer('stone'); }
      else stats.dodged++;
      var r=onRope(); if(r && Math.hypot(r.x-h.tx,(r.y-r.w.h*0.5)-h.ty)<STONE_R) releaseFriend(r,'THE STONE SHOOK THEM LOOSE');
    } }
}
function shotTick(dt){
  for(var s=shots.length-1;s>=0;s--){ var sh=shots[s]; sh.t+=dt; sh.x+=sh.vx*dt; sh.y+=sh.vy*dt;
    if(!sh.harmless && Math.hypot(sh.x-P.x,sh.y-P.y) < (spinning()?58:40)){
      if(spinning() && D8_SPIN_DEFLECTS){ var dx=sh.x-P.x, dy=sh.y-P.y, L=Math.hypot(dx,dy)||1, sp=Math.hypot(sh.vx,sh.vy);
        sh.vx=dx/L*sp*0.9; sh.vy=dy/L*sp*0.9-80; sh.harmless=true; fxAdd(sh.x,sh.y,'ring','#9fe08a',0.35); sfx('clank'); score+=50; }
      else if(P.invuln>0){ shots.splice(s,1); continue; }
      else { hitPlayer(sh.type); shots.splice(s,1); continue; }
    }
    if(!sh.harmless){ var r=onRope(); if(r && Math.hypot(sh.x-r.x, sh.y-(r.y-r.w.h*0.5))<28){ shots.splice(s,1); releaseFriend(r,'HIT ON THE ROPE — THEY LET GO'); continue; }
      for(var q=0;q<friends.length;q++){ var f=friends[q]; if(f.st==='ladder' && Math.hypot(sh.x-f.x, sh.y-(f.y-f.w.h*0.5))<26){ shots.splice(s,1); releaseFriend(f,'HIT ON THE LADDER — THEY LET GO'); break; } } }
    if(sh.t>sh.life || sh.x<-80||sh.x>LW+80||sh.y<-80||sh.y>LH+80){ if(sh.t>0.2 && !sh.harmless) stats.dodged++; shots.splice(s,1); }
  }
}
function hitPlayer(src){
  if(spinning()||P.invuln>0) return;
  hp-=HIT_DMG; P.stun=HIT_STUN; P.invuln=HIT_INVULN; shake=16; stats.hits++; sfx('hit'); fxAdd(P.x,P.y,'boom',null,0.6);
  releaseAll('HIT! THEY LET GO');
  if(hp<=0){ hp=0; }
}

/* ---------- THE RAY: hold to plant; the god-ray lifts a red hat out of the fight ---------- */
function rayTick(dt){
  P.lock=null;
  if(P.raying){
    var best=RAY_REACH, bi=-1;
    for(var i=0;i<legion.length;i++){ var g=legion[i]; if(g.gone) continue; var d=Math.abs(g.x-P.x); if(d<best && g.y>P.y){ best=d; bi=i; } }
    if(bi>=0){ var g=legion[bi]; if(!g.lifting) sfx('ray_on'); P.lock=g; g.lifting=true; g.lock=clamp(g.lock+dt/g.k.lock,0,1);
      if(g.lock>=1){ g.gone=true; score+=g.k.val; stats.beamed++; fxAdd(P.x,P.y+30,'ring','#ffe9a8',0.5); sfx('ray_take'); } }
  }
  for(var i=0;i<legion.length;i++){ var g=legion[i]; if(g!==P.lock && g.lock>0){ g.lock=Math.max(0,g.lock-dt*1.6); if(g.lock<=0) g.lifting=false; } }
}

/* =====================================================================
   THE RESCUE — rope (hangs, one at a time), ladder (climb while you hover),
   the stranded, the drop-off. FRIENDLIES CANNOT BE RAYED: the ray only
   ever searches `legion`; the stranded live in `friends`.
   ===================================================================== */
function saveFriend(f,how){ if(f.st==='safe'||f.st==='lost') return;
  f.st='safe'; f.how=how; f.prog=0; score+=RESCUE_PTS; sfx('deliver');
  if(how==='drop'){ f.x=clamp(f.x,F.drop.x-F.drop.w*0.4,F.drop.x+F.drop.w*0.4); f.y=dropSurf(); }
  fxAdd(f.x, how==='aboard'?P.y:f.y-20, 'ring', '#7fe7ff', 0.5);
  flash((how==='aboard'?'ABOARD — SAFE':'SAFE')+'  +'+RESCUE_PTS,'#7fe7ff',0.9);
  if(rescuedN()>=F.need && !hornSet){ hornSet=true; if(rescuedN()<friends.length){ stageClock=Math.min(stageClock,HORN_AFTER_NEED); flash('ENOUGH ARE SAFE — THE HORN IN '+HORN_AFTER_NEED+'. BRING THE REST?','#e8c66a',2.2); sfx('horn'); } }
}
function loseFriend(f,how){ if(f.st==='safe'||f.st==='lost') return;
  f.st='lost'; f.how=how; f.fade=1; stats.lost++; sfx('lost');
  flash(how==='captured'?'THE LEGION TOOK ONE OF OURS': how==='drowned'?'THE WASH TOOK ONE':'LOST IN THE FALL','#ff8a5a',1.2); }
function releaseFriend(f,why){ if(f.st!=='rope'&&f.st!=='ladder') return false;
  f.st='fall'; f.vy=0; f.fallFrom=f.y; f.cd=REGRAB; f.prog=0; sfx('let_go'); if(why) flash(why,'#ffb347',1.0); return true; }
function releaseAll(why){ var any=false; for(var i=0;i<friends.length;i++) if(releaseFriend(friends[i])) any=true; if(any&&why) flash(why,'#ffb347',1.0); return any; }
function giveLadder(){ P.gear='ladder'; ladderT=LADDER_SECS; var r=onRope(); if(r && !r.w.animal){ r.st='ladder'; r.prog=0; }
  sfx('ladder_get'); flash('LADDER! HOVER SO THEY CAN CLIMB · '+LADDER_CAP+' AT ONCE · NOT GOATS','#e8c66a',1.6); }
function rescueTick(dt, el){
  for(var i=0;i<(F.ladders||[]).length;i++){ var ld=F.ladders[i];
    if(!ladderSpawned[i] && el>=ld.at){ ladderSpawned[i]=1; pickups.push({ x:ld.x, y:BAND_TOP+(bandBot()-BAND_TOP)*0.4, ttl:LADDER_PICK_TTL }); flash('A LADDER CRATE DRIFTS IN','#e8c66a',1.0); } }
  for(var i=pickups.length-1;i>=0;i--){ var pk=pickups[i]; pk.ttl-=dt;
    if(Math.hypot(pk.x-P.x,pk.y-P.y)<70){ pickups.splice(i,1); giveLadder(); continue; } if(pk.ttl<=0) pickups.splice(i,1); }
  if(P.gear==='ladder'){ ladderT-=dt; if(ladderT<=0 && !onLadder()){ P.gear='rope'; ladderT=0; flash('LADDER STOWED — BACK ON THE ROPE','#efe3c4',0.9); } }

  var ex=P.x, ey=ropeEndY(), hover=P.spd<LADDER_HOVER_V;
  for(var i=0;i<friends.length;i++){ var f=friends[i];
    if(f.cd>0) f.cd-=dt;
    if(f.st==='lost'){ if(f.fade>0) f.fade-=dt*0.6; continue; }
    if(f.st==='safe') continue;
    if(f.st==='ground'){
      var stand=GY()-f.rock;
      if(F.water){ var depth=stand-waterY; f.sink=clamp(depth/(f.w.h*0.55),0,1); if(depth>f.w.h*0.55){ f.y=stand; loseFriend(f,'drowned'); continue; } }
      if(f.cd>0||P.stun>0) continue;
      var top=stand-f.w.h;
      if(Math.abs(f.x-ex)<GRAB_R && ey>=top-14 && ey<=stand){
        if(P.gear==='rope' && !onRope()){ f.st='rope'; sfx('grab'); flash(f.w.animal?'GOT ONE — IN THE SLING. FLY IT TO '+F.drop.label:'GOT ONE — HANG ON! FLY THEM TO '+F.drop.label,'#7fe7ff',1.0); }
        else if(P.gear==='ladder' && !f.w.animal && onLadder()<LADDER_CAP){ f.st='ladder'; f.prog=0; sfx('grab'); flash('ON THE LADDER — HOVER SO THEY CAN CLIMB','#7fe7ff',1.0); }
      }
      continue;
    }
    if(f.st==='fall'){ f.vy+=FALL_G*dt; f.y+=f.vy*dt; var sf=surfAt(f.x);
      if(f.y>=sf){ f.y=sf; f.vy=0; f.rock=0; var drop=sf-f.fallFrom;
        if(drop>SAFE_FALL) loseFriend(f,'fall');
        else if(inDrop(f.x)) saveFriend(f,'drop');
        else if(F.water && waterY < sf-f.w.h*0.4) loseFriend(f,'drowned');
        else { f.st='ground'; flash('SHORT DROP — THEY\'RE OK','#efe3c4',0.8); } }
      continue; }
    // carried
    f.x=P.x;
    if(f.st==='ladder'){ if(hover) f.prog+=dt/LADDER_CLIMB; if(f.prog>=1){ saveFriend(f,'aboard'); continue; }
      f.y = ey - f.prog*(ROPE_LEN-8) + f.w.h; }
    else f.y = ey + f.w.h;
    if(inDrop(f.x) && f.y >= dropSurf()-DELIVER_LOW){ saveFriend(f,'drop'); continue; }
    if(f.y > GY()-24) for(var q=0;q<legion.length;q++){ var g=legion[q]; if(!g.gone && !g.lifting && !g.climb && Math.abs(g.x-f.x)<CARRY_REACH){ releaseFriend(f,'DRAGGED THROUGH THE LEGION — THEY LET GO'); break; } }
  }
}

/* =====================================================================
   THE AUTOPILOT — a competent scripted pilot (the ?selftest's "can it be
   won" policy, the ?demo, and the attract's live reconstruction). It
   reads the telegraphs exactly as a player would: never the RNG.
   ===================================================================== */
function makePilot(opts){
  opts=opts||{};
  var mem={evadeT:0, ey:0, ex:null, hoverT:0};
  return function(){
    var o={left:0,right:0,up:0,down:0,ray:0,spin:0};
    if(opts.idle || !P) return o;
    var tx=P.x, ty=P.y, bb=maxY(), threat=false, r=onRope();
    // --- 1. threats (telegraphs) ---
    for(var i=0;i<haz.length;i++){ var h=haz[i];
      if(h.k==='shooter' && h.st==='aim'){ var dx=h.ax-h.x, dy=h.ay-h.y, L=Math.hypot(dx,dy)||1, nx=-dy/L, ny=dx/L, d=(P.x-h.x)*nx+(P.y-h.y)*ny;
        if(Math.abs(d)<70 && h.t>h.S.track*0.5){ threat=true; ty = P.y + (P.y>(BAND_TOP+bb)/2 ? -150 : 150); tx = P.x + (d>=0?1:-1)*nx*120; } }
      if(h.k==='thopter' && (h.st==='warn'||h.st==='cross') && Math.abs(h.y-P.y)<THOPTER_HH+60){ threat=true; ty = h.y + (h.y>(BAND_TOP+bb)/2 ? -150 : 150); }
      if(h.k==='glider' && (h.st==='warn' || (h.st==='fly' && (h.x-P.x)*h.dir<0 && Math.abs(h.x-P.x)<420)) && Math.abs(h.y-P.y)<110){ threat=true; ty = h.y + (h.y>(BAND_TOP+bb)/2 ? -170 : 170); }
      if(h.k==='stone' && Math.hypot(P.x-h.tx,P.y-h.ty)<STONE_R+70){ threat=true; tx = h.tx + (P.x>=h.tx?1:-1)*200; }
    }
    for(var s=0;s<shots.length;s++){ var sh=shots[s]; if(sh.harmless) continue; var ddx=P.x-sh.x, ddy=P.y-sh.y, dd=Math.hypot(ddx,ddy);
      if(dd<170 && (ddx*sh.vx+ddy*sh.vy)>0 && simT>=P.spinCd) o.spin=1; }
    for(var i=0;i<haz.length;i++){ var h=haz[i]; if((h.k==='thopter'&&h.st==='cross'&&Math.abs(h.x-P.x)<240&&Math.abs(h.y-P.y)<THOPTER_HH+20)||(h.k==='stone'&&h.st==='fly'&&h.t>STONE_FLY-0.3&&Math.hypot(P.x-h.tx,P.y-h.ty)<STONE_R)) { if(simT>=P.spinCd) o.spin=1; } }
    if(threat){ mem.evadeT=0.35; mem.ey=ty; mem.ex=tx; }
    else if(mem.evadeT>0){ mem.evadeT-=1/60; ty=mem.ey; tx=mem.ex; threat=true; }
    // --- 2. the job ---
    if(!threat){
      var dropX=F.drop.x;
      if(r){ tx=dropX; ty = Math.abs(P.x-dropX)>110 ? bb-70 : bb; }
      else if(P.gear==='ladder' && onLadder()>0){
        var more=null; if(onLadder()<LADDER_CAP) more=nearestStranded(true, 160);
        if(more){ tx=more.x; ty=bb; } else { tx=P.x; ty=P.y; return o; }   // hover: let them climb
      } else {
        var pk=pickups[0]; if(pk && P.gear==='rope' && Math.abs(pk.x-P.x)<520){ tx=pk.x; ty=pk.y; }
        else { var f=nearestStranded(P.gear==='ladder'); if(f){ tx=f.x; ty = Math.abs(P.x-f.x)>160 ? bb-60 : bb; } else { tx=dropX; ty=(BAND_TOP+bb)/2; } }
      }
      // ray a red hat that is in the way (under us, or about to foul the rider)
      for(var q=0;q<legion.length;q++){ var g=legion[q]; if(g.gone) continue;
        var near=Math.abs(g.x-P.x)<26, inWay=(F.wall||F.legion.hunts) ? Math.abs(g.x-tx)<260 || g.climb : false;
        if(near && (inWay || (r && g.y>=GY()-2 && !g.climb) || g.lifting)){ o.ray=1; return o; }
        if((F.wall||F.gear) && Math.abs(g.x-P.x)<170 && !r && (g.climb || nearestStrandedTo(g)<220)){ tx=g.x; } }
    }
    var tol=STEP*0.6;
    if(tx<P.tx-tol) o.left=1; else if(tx>P.tx+tol) o.right=1;
    if(ty<P.ty-tol) o.up=1; else if(ty>P.ty+tol) o.down=1;
    return o;
  };
}
function strandedDanger(f){ // seconds until this one is lost (water / a climbing red hat), lower = sooner
  var t=999; if(F.water){ var stand=GY()-f.rock, drownY=stand-f.w.h*0.55; t=(waterY-drownY)/Math.max(0.01,F.water.rate); }
  if(F.legion.hunts) for(var q=0;q<legion.length;q++){ var g=legion[q]; if(!g.gone){ var d=Math.abs(g.x-f.x)+(g.climb?(g.y-GY()):0); t=Math.min(t,d/50); } }
  return t; }
function nearestStrandedTo(g){ var b=1e9; for(var i=0;i<friends.length;i++){ var f=friends[i]; if(f.st==='ground') b=Math.min(b,Math.abs(f.x-g.x)); } return b; }
function nearestStranded(noAnimals, within){
  var best=null, bs=1e9;
  for(var i=0;i<friends.length;i++){ var f=friends[i]; if(f.st!=='ground'||f.cd>0) continue; if(noAnimals&&f.w.animal) continue;
    var d=Math.abs(f.x-P.x); if(within!=null && d>within) continue;
    var dz=strandedDanger(f), s = d + Math.abs(f.x-F.drop.x)*0.5 + (dz<25? -600+dz*20 : 0);
    if(s<bs){ bs=s; best=f; } }
  return best;
}

   sprites: Rome holds the side with the drop (the camp / stockade / ridge / milecastle), the Red Hat Legion the other, and
   the SEAM where they grind is a live front. YOUR rescues push Rome forward; every soul lost lets the gnomes surge; the

  var r=rescuedN(), l=lostN(), el=F.clock-stageClock, u=clamp(el/F.clock,0,1);
  var B=BATTLE[F.key]||{}, rome = (B.rome0!=null?B.rome0:0.46) + 0.26*r/(r+3) - 0.22*l/(l+2) - 0.10*u + 0.035*Math.sin(rt*0.21) + 0.02*Math.sin(rt*0.53+1.3);
  rome = clamp(rome, 0.16, 0.84);
  var romeRight = F.drop.x > LW/2;
  return { x: romeRight ? LW*(1-rome) : LW*rome, romeRight: romeRight };
}
function drawBattle(){
  var B=BATTLE[F.key]; if(!B) return;
  var ft=battleFrontTarget(); if(btFront==null || state!=='play') btFront=ft.x; else btFront += (ft.x-btFront)*0.02;
  var fx0=btFront, romeRight=ft.romeRight, hz=SKIES[F.time].haze, base = B.foot ? LH : GY();
  for(var ri=0; ri<B.rows.length; ri++){
    var R=B.rows[ri], h=R.h, yb=base+R.dy, slot=h*0.62, clash=h*1.9, fr=fx0 + (ri?0:-h*0.6)*(romeRight?-1:1);   // the far row's front lags: depth
    var n0=Math.floor(-slot*2/slot), n1=Math.ceil((LW+slot*2)/slot);
    for(var n=n0; n<=n1; n++){
      var hs=n*7919+ri*104729+(F.key.length*31), j=bh(hs), x=n*slot+(j-0.5)*slot*0.5, d=x-fr, ad=Math.abs(d);
      var romeSide = romeRight ? d>0 : d<0, dirToFront = d<0 ? 1 : -1;
      if(R.keep && ad>clash && bh(hs+4)>R.keep) continue;                  // open-field rows: a looser order
      if(ad>clash*3.2 && bh(hs+3)<0.45) continue;                       // the back lines thin out
      var std = bh(hs+5)<0.09, back = ad>clash*2.2;
      var art = romeSide ? (std ? BT_ROME_STD[(bh(hs+6)*2)|0] : BT_ROME[(bh(hs+7)*BT_ROME.length)|0])
                         : (std ? BT_GNOME_STD[0] : (back && bh(hs+8)<0.35 ? BT_GNOME_BACK[0] : BT_GNOME[(bh(hs+7)*BT_GNOME.length)|0]));
      var hh = h*(romeSide?1.0:0.86)*(0.92+0.16*bh(hs+9)), xx=x, rot=0, a=1;
      if(ad<clash){   // THE GRINDER: the files lunge, fall and are replaced
        var per=4.5+4*bh(hs+11), ph=((rt+bh(hs+12)*per)%per)/per;
        xx += dirToFront*Math.max(0,Math.sin(rt*(5+3*bh(hs+13))+hs))*h*0.22;
        if(ph>0.86){ var k=(ph-0.86)/0.09; rot=dirToFront*Math.min(1,k)*1.35; a=1-clamp((ph-0.92)/0.05,0,1); }
        if(ph<0.06){ xx -= dirToFront*(1-ph/0.06)*h*0.9; a=ph/0.06; }   // the replacement steps up from behind
      } else xx += Math.sin(rt*1.6+hs)*1.2;                                 // the reserves shift on their feet
      if(a<=0.01) continue;
      var img = tinted(art, hz, R.haze, false); if(!img) continue;
      var w=hh*(img.width/img.height);
      ctx.save(); ctx.globalAlpha=a; ctx.translate(xx, yb-hh/2); if(rot) ctx.rotate(rot); if(dirToFront<0) ctx.scale(-1,1);
      ctx.drawImage(img,-w/2,-hh/2,w,hh); ctx.restore();
      if(back && bh(hs+21)<0.05 && ok('brazier')){ var bi=tinted('brazier',hz,R.haze,false); if(bi){ var bw=h*0.45*(bi.width/bi.height); ctx.drawImage(bi, x+slot*0.4-bw/2, yb-h*0.45, bw, h*0.45);
        ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.35+0.2*Math.sin(rt*9+hs); ctx.fillStyle='rgba(255,150,60,0.6)'; ctx.beginPath(); ctx.arc(x+slot*0.4, yb-h*0.48, h*0.22, 0, 6.283); ctx.fill(); ctx.restore(); } }
    }
    // the seam: dust + clash sparks, a few at a time, each on its own clock
    for(var k2=0;k2<5;k2++){ var per2=1.3+bh(ri*13+k2)*1.6, ph2=((rt+bh(k2*7+ri)*per2)%per2)/per2; if(ph2>0.45) continue;
      var sx=fr+(bh(k2*31+ri*7+Math.floor((rt+bh(k2*7+ri)*per2)/per2))-0.5)*clash*1.4, sy=yb-h*(0.3+0.4*bh(k2+ri*3)), q=ph2/0.45;
      if(k2<2 && ok('dust_burst')){ var dz=h*(0.6+q*0.6); ctx.save(); ctx.globalAlpha=(1-q)*0.55; ctx.drawImage(tinted('dust_burst',hz,R.haze,false)||IMG.dust_burst, sx-dz*0.65, yb-dz*0.9, dz*1.3, dz); ctx.restore(); }
      else { ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=(1-q)*0.9; ctx.strokeStyle='rgba(255,226,150,1)'; ctx.lineWidth=1.4;
        for(var sp=0;sp<4;sp++){ var an=bh(k2*5+sp+ri)*6.283; ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(sx+Math.cos(an)*h*0.22*(0.4+q), sy+Math.sin(an)*h*0.22*(0.4+q)); ctx.stroke(); } ctx.restore(); }
    }
  }

  var R0=B.rows[B.rows.length-1], yb0=base+R0.dy, fr0=fx0;
  for(var v=0; v<6; v++){ var per3=2.2+bh(v*17)*1.8, ph3=((rt+bh(v*29)*per3)%per3)/per3, cyc=Math.floor((rt+bh(v*29)*per3)/per3);

    var px=lerp(x0,x1,ph3), py=yb0-R0.h*0.7-4*apex*ph3*(1-ph3), dx=(x1-x0), dy=-4*apex*(1-2*ph3);
    var ln=Math.hypot(dx,dy)||1; ctx.strokeStyle= fromRome ? 'rgba(40,30,20,0.75)' : 'rgba(60,20,15,0.75)'; ctx.lineWidth=1.4;

}

/* ---------- the frame loop ---------- */
var last=0;
function frame(ts){
  var raw=last?(ts-last)/1000:0.016, dt=Math.min(0.033,raw); last=ts; rt+=dt; idleT+=dt;
  readPad();
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#000'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(SC,0,0,SC,OX,OY); ctx.save(); ctx.beginPath(); ctx.rect(0,0,LW,LH); ctx.clip();
  ctx.imageSmoothingEnabled=true;
  if(state==='play'){ update(dt); ropeSwing(dt); ctx.save(); if(shake>0) ctx.translate(vr(-shake,shake),vr(-shake,shake)); drawScene(dt); ctx.restore(); drawHUD(); }
  else if(state==='attract') drawAttract(dt);
  else if(state==='title'){ drawTitle(dt); if(idleT>40) toAttract(); }
  else if(state==='howto'){ backdrop(3,dt); howtoCard(1); txt('SPACE — BACK',LW/2,LH-60,20,GOLD,'center','bold'); }
  else if(state==='select') drawSelect();
  else if(state==='brief') drawBrief(dt);
  else if(state==='results') drawResults(dt);
  else if(state==='failed') drawFailed(dt);
  else if(state==='march') drawMarch();
  else if(state==='end') drawEnd();
  ctx.restore();
  requestAnimationFrame(frame);
}

  okk('the campaign marches on: Dover -> Nottingham', m1 && state==='brief' && fi===1);
  fi=3; F=FRONTS[3]; state='march'; onPress(' ');
  okk('after the last built front the march ends on THE WALL HOLDS (the rest sealed)', state==='end');
  campaign=false;

  var pass=R.every(function(r){return r.ok;});
  return { pass:pass, results:R, rates:rates, seed:SEED };
}
function selfTestPage(){
  var out=selfTest(), R=out.results;
  function render(extra){
    var pass=out.pass && (!extra || extra.every(function(r){return r.ok;}));
    var html='<pre style="font:13px ui-monospace,Menlo,monospace;color:#efe3c4;background:#0b0806;padding:18px;margin:0;min-height:100vh;white-space:pre-wrap">'
      +'<b style="font-size:18px;color:'+(pass?'#9fe08a':'#ff6a4a')+'">PAX GNOMANIA — SELF TEST: '+(pass?'PASS':'FAIL')+'</b>   '+R.length+(extra?'+'+extra.length:'')+' checks\n\n';
    R.concat(extra||[]).forEach(function(r){ html+=(r.ok?'  <span style="color:#9fe08a">OK  </span>':'  <span style="color:#ff6a4a">FAIL</span>')+'  '+r.n+(r.d?'   <span style="color:#8a7a5a">'+r.d+'</span>':'')+'\n'; });
    html+='</pre>'; document.body.innerHTML=html; document.title='PAX SELFTEST '+(pass?'PASS':'FAIL');
  }
  render(null);
  // in a browser, also prove every piece of art actually LOADED (a 404 never throws)
  var t0=performance.now(); (function wait(){ var pend=0, bad=[]; for(var k in IMG){ if(IMG[k].bad) bad.push(k); else if(!IMG[k].ok) pend++; }
    if(pend && performance.now()-t0<8000) return setTimeout(wait,100);
    render([{n:'every piece of art in the manifest loaded', ok:bad.length===0&&pend===0, d:Object.keys(IMG).length+' files'+(bad.length?' · MISSING '+bad.join(','):'')+(pend?' · '+pend+' still loading':'')}]); })();
}

/* ---------- boot ---------- */
window.PAX={ selfTest:selfTest, FRONTS:FRONTS, MARCH:MARCH, makePilot:makePilot, startFront:startFront, simRun:simRun,
  _dbg:function(){ return {P:P,friends:friends,legion:legion,haz:haz,simT:simT,F:F,stageClock:stageClock}; },
  get state(){ return state; }, get lastResult(){ return lastResult; }, get score(){ return score; }, ART:ART, SFX_SLOTS:SFX_SLOTS, MUSIC_SLOTS:MUSIC_SLOTS,
  _audio:{ sfx:sfx, music:playMusic, unlock:unlockAudio, AU:AU } };   // a debug handle for headless sound checks
if(NODE) return;
if(qp('selftest')!==null){ try{ selfTestPage(); }catch(e){ document.body.innerHTML='<pre style="color:#ff6a4a;padding:18px">SELFTEST THREW: '+e.message+'\n'+e.stack+'</pre>'; document.title='PAX SELFTEST FAIL'; } return; }
(function boot(){
  var fr=qp('front'), shot=qp('shot');
  if(fr!==null){ var n=clamp((+fr||1),1,FRONTS.length)-1; campaign=false; score=0; startFront(n,{go:qp('go')!==null||shot!==null||qp('ff')!==null||qp('demo')!==null});
    if(qp('demo')!==null){ demo=true; autopilot=makePilot(); }
    if(shot==='win'){ simRun(F.clock+4, makePilot()); }
    else if(shot==='fail'){ simRun(F.clock+4, makePilot({idle:true})); }
    else if(qp('ff')!==null){ simRun(+qp('ff')||10, makePilot({idle:qp('idle')!==null}), true); }
    if(state!=='play') rt=5;
    playMusic(state==='play'?F.music:'theme',0.7);
  }
  else if(qp('campaign')!==null){ campaign=true; score=0; startFront(0); playMusic('theme',0.7); }
  else if(qp('march')!==null){ campaign=true; F=FRONTS[0]; fi=0; state='march'; playMusic('theme',0.7); }
  else if(qp('title')!==null){ toTitle(); }
  else if(qp('howto')!==null){ state='howto'; playMusic('theme',0.7); }
  else if(qp('select')!==null){ state='select'; playMusic('theme',0.7); }
  else { toAttract(); var a=qp('attract'); if(a && +a>0){ atk=clamp(+a,0,ATTRACT.length-1); atT=0; if(ATTRACT[atk].k==='demo'){ demo=true; startFront(0,{go:true,seed:4242}); autopilot=makePilot(); state='attract'; } } }
  requestAnimationFrame(frame);
})();
})();
