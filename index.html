<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PAX GNOMANIA — AIRY CUT (THE GUNPOWDER HORROR)</title>
<!--
  PAX GNOMANIA — AIRY CUT — STANDALONE, PLAYABLE browser feel-build. A sandbox; it
  never imports or modifies suck_up.py. Same render-only air-cushion GLIDE + real
  sprites + height-keyed sizing as SUCK UP — AIRY CUT, reskinned to the gnome legion
  storming Gunpowder, MD. Suck up the gnomes before they take the town.

  THE FRONTS (LEVELS[].kind): RESCUE · RESCUE · SURVIVAL · RESCUE · HOLD+EVACUATE.
  RESCUE = rope/ladder the stranded friendly gnomes to the SAFE drop-off before the
  clock; SURVIVAL = THE GUNPOWDER HORROR hold-the-line, untouched; BOTH = the two at
  once. Friendly look = FRIENDLY_LOOK (one constant). ?selftest proves all of it;
  ?auto&level=N drops straight into front N; 1-5 at the title picks a front.

  TWO CABS (?cab=…):  hyscore = CLASSICAL GNOMANIA (marble/green) · blacksite = RED LEGION.
  (Per Joe 2026-06-17: red = BLACKSITE, classical = HYSCORE.)
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#03020a;overflow:hidden;cursor:none;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;color:#e9e0d6;-webkit-user-select:none;user-select:none}
  #c{position:fixed;inset:0;display:block}
  #hint{position:fixed;bottom:10px;left:12px;color:#7a6f5f;font-size:11px;z-index:5;pointer-events:none}
  #hint b{color:#bfa46a} kbd{background:#241a10;border:1px solid #4a3a1e;border-radius:4px;padding:0 5px;color:#e6cf9a;font-size:11px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint"><kbd>WASD</kbd>/<kbd>↑↓←→</kbd> fly · <kbd>SPACE</kbd> SUCK UP · <kbd>F</kbd> WARBLE · <kbd>B</kbd> siege · <kbd>1</kbd>–<kbd>5</kbd> front · <kbd>X</kbd> blitz · <kbd>G</kbd> glide · <kbd>R</kbd> restart · <b>SANDBOX — no game files touched</b></div>

<script>
(function(){
"use strict";
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var W=0,H=0; function resize(){ W=cv.width=innerWidth; H=cv.height=innerHeight; } addEventListener('resize',resize); resize();
function rnd(a,b){ return a+(b-a)*Math.random(); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function chance(p){ return Math.random()<p; }

/* ---------- cab themes ---------- */
var CABS={
  hyscore:  { name:'HYSCORE · CLASSICAL GNOMANIA', edge:'#d6bd86', sky:['#0c1422','#0e1a18','#10231a','#07140d'], ground:'#0a1d12', accent:'#9affc0', title:'#e9e8d6' },
  blacksite:{ name:'BLACKSITE · RED LEGION',       edge:'#ff5d6c', sky:['#1a0810','#230a12','#1c0a10','#120608'], ground:'#180a0c', accent:'#ff8a6a', title:'#ffd0c4' }
};
var cab=(location.search.match(/cab=(\w+)/)||[])[1]; if(!CABS[cab]) cab='hyscore'; var TH=CABS[cab];

/* ---------- sprites ---------- */
var IMG={};
function load(n,p){ var im=new Image(); im.onload=function(){im.ok=true;}; im.onerror=function(){im.ok=false;}; im.src=p; IMG[n]=im; }
var A='assets/sprites/', AR='assets/sprites/art/', LG='assets/logo/';
load('p1',A+'p1-saucer.png'); load('beam',A+'beam-green.png'); load('ring',A+'ground-ring.png');
for(var i=0;i<6;i++) load('w'+i,A+'p1-warble-'+i+'.png');
['gnome','gnome_knife','gnome_pistol','gnome_smg','gnome_heavy','gp_vehicle','gp_bradley','gp_aa_gun','gp_banner','gp_wall','gp_wall_2',
 'gp_soldier_a','gp_soldier_b','gp_soldier_c','person','farmer',
 'barracks','bunker','radar','tower_a','tree','moon','jet','powerup'
].forEach(function(n){ load(n,AR+n+'.png'); });
load('ck_logo',LG+'castle-killscreen-logo.png'); load('gnomania',A+'../broll/pax-gnomania.png');
function ok(n){ var im=IMG[n]; return im&&im.ok; }
function drawImg(n,x,y,w,rot,alpha,flip,smooth){
  var im=IMG[n]; if(!im||!im.ok) return false;
  var ar=im.naturalWidth/im.naturalHeight, h=w/ar;
  ctx.save(); ctx.globalAlpha=alpha==null?1:alpha; ctx.imageSmoothingEnabled=smooth!==false;
  ctx.translate(x,y); if(rot) ctx.rotate(rot); if(flip) ctx.scale(-1,1);
  ctx.drawImage(im,-w/2,-h/2,w,h); ctx.restore(); return true;
}

/* ---------- glide ---------- */
var GLIDE=true, accel=210, damp=27;
function spring(o,tx,ty,dt){
  if(!GLIDE){ o.x=tx; o.y=ty; o.vx=o.vy=0; return; }
  var ox=o.x, oy=o.y;
  o.vx += ((tx-o.x)*accel - o.vx*damp)*dt; o.vy += ((ty-o.y)*accel - o.vy*damp)*dt;
  o.x += o.vx*dt; o.y += o.vy*dt;
  if((tx-ox)*(tx-o.x)<0){ o.x=tx; o.vx=0; } if((ty-oy)*(ty-o.y)<0){ o.y=ty; o.vy=0; }
}

/* ---------- world ---------- */
function groundY(){ return H*0.84; }
function band(){ return {top:H*0.20, bot:H*0.70}; }
function SAUCER_W(){ return clamp(W*0.085,90,180); }
function sz(){ return { gnome:clamp(W*0.034,22,38), heavy:clamp(W*0.046,30,52), vehicle:clamp(W*0.05,32,56)*0.84 }; }

/* ---------- the Gunpowder fronts ----------
   Every front has a KIND:
     rescue   — stranded friendly gnomes, a SAFE drop-off, and a clock. Most fronts.
     survival — THE GUNPOWDER HORROR hold-the-line, exactly as it was built.
     both     — hold the line WHILE evacuating. The hardest.
   rescue/both fields: friends = x-fractions of the stranded · need = how many must
   reach safety · drop = x-fraction of the SAFE drop-off · ladders = scheduled
   LADDER power-ups {at: seconds in, x: fraction}.                                   */
var LEVELS=[
  { kind:'rescue',   zone:'THE GOLF COURSE', clock:60, bias:0.00, scrollStart:44, props:['tree','gp_banner','tree','barracks','tree','radar','tree'],
    friends:[0.22,0.34,0.70,0.82], need:3, drop:0.52, ladders:[{at:16,x:0.40}] },
  { kind:'rescue',   zone:'THE WHITE HOUSE', clock:62, bias:0.12, scrollStart:40, props:['barracks','tree','gp_banner','tower_a','tree','gp_wall','tree'],
    friends:[0.18,0.30,0.44,0.74,0.86], need:4, drop:0.60, ladders:[{at:12,x:0.30},{at:36,x:0.70}] },
  { kind:'survival', zone:'GUNPOWDER FALLS', clock:68, bias:0.00, scrollStart:46, props:['gp_wall','barracks','gp_banner','bunker','tree','gp_wall','radar'], boss:true },
  { kind:'rescue',   zone:'THE BARRACKS',    clock:64, bias:0.22, scrollStart:38, props:['barracks','gp_wall','bunker','gp_banner','radar','barracks','gp_wall'],
    friends:[0.24,0.36,0.50,0.64,0.78,0.90], need:4, drop:0.12, ladders:[{at:10,x:0.55},{at:34,x:0.30}] },
  { kind:'both',     zone:'FORT GUNPOWDER',  clock:66, bias:0.45, scrollStart:30, props:['bunker','radar','gp_wall','tower_a','gp_banner','barracks','bunker'],
    friends:[0.25,0.34,0.65,0.80], need:3, drop:0.50, ladders:[{at:14,x:0.50}] }
];
var KIND_NAME={ rescue:'RESCUE', survival:'SURVIVAL', both:'HOLD + EVACUATE' };
function hasLine(L){ return L.kind==='survival' || L.kind==='both'; }
function hasRescue(L){ return L.kind==='rescue' || L.kind==='both'; }
var BOSS_TELE=40, BOSS_APPEAR=48, BOSS_BONUS=3000;

/* ---------- state ---------- */
var state='boot', bootT=0, clock=0, t=0, shake=0, msg='', msgColor='#fff', msgT=0;
var mode='campaign', stress=false, fps=60, fpsAcc=0, fpsN=0;
var P=null, targets=[], jets=[], shots=[], fx=[], scenery=[];
var meter=0, score=0, hp=100, maxHP=100, stageClock=0, level=0, levelLen=68;
var runActive=false, bossTele=false, bossSpawned=false;
var jetTimer=2, aaTimer=2;
function newPlayer(){ var b=band(); return { tx:W*0.4, ty:(b.top+b.bot)/2, x:W*0.4, y:(b.top+b.bot)/2, vx:0,vy:0, bank:0, warbleU:-9, warbleCd:0, stun:0, invuln:0, lock:null, gear:'rope', spd:0 }; }
function flash(m,c,sec){ msg=m; msgColor=c||'#fff'; msgT=sec||1.0; }

/* =====================================================================
   THE GUNPOWDER HORROR — the DEFENSE mission.

   This build carried the name for months while actually being a wander-and-
   suck-up sandbox: gnomes milled about, you beamed them, nothing was at stake
   but your own hull. The mission it is named after is a DEFENSE: Gunpowder, MD
   has people and hardware on the ground, the legion marches in from the edges
   and advances on them, and the only way to hold the town is to thin the swarm
   faster than it closes. Ported here from the Python mission so the thing is
   playable and testable in a browser.

   Defense in depth, edges inward: HARDWARE soaks the first contact · WALLS are
   cover · the PEOPLE sit safe in the middle and are what you are actually
   saving. SOLDIERS are armed and fight back — and a gnome the soldiers kill
   pays you NOTHING, so hiding behind the line is survivable and poor.

   THE FALLBACK: four phases. Each one the swarm survives, the armed line gives
   ground toward the civilians and the field scrolls harder. THE SURGE rides
   with it so the retreat costs something — a line that merely contracts is a
   defensive buff wearing a retreat's clothes (measured: it made the Python
   mission EASIER, 90% -> 100% perfect, before the surge was added).
   Phase 3 IS the Bradley onslaught.
   ===================================================================== */
var GP_WAVE_EVERY   = 2.6;          // reinforcements this often...
var GP_WAVES_STOP   = 8.0;          // ...until this many seconds remain
var GP_WAVE_SIZE    = 4;
var GP_MAX_GNOMES   = 18;           // on-field cap — a SET force, perf-safe
var GP_REACH        = 0.030;        // strike range, fraction of width
var GP_ATTACK_CD    = 2.2;          // seconds between one gnome's strikes
var GP_ADVANCE      = 0.028;        // closing speed, fraction of width per sec
var GP_SOLDIER_RANGE= 0.11;         // how far down the line a defender reaches. Tuned, not guessed:
                                    // at 0.20/1.7 the line held the town on its own for the whole
                                    // level and the player was optional — the mildest setting where
                                    // an untouched Gunpowder actually falls. The ?selftest asserts it.
var GP_SOLDIER_CD   = 2.2;
var GP_SOLDIER_HP   = 3;            // soldiers soak; civilians do not
var GP_SAVE_BONUS   = 400;          // per survivor at the horn
var GP_PHASE_AT     = [0.22,0.45,0.68];
var GP_PHASE_SURGE  = [1.0,1.18,1.40,1.70];
var GP_PHASE_SCROLL = [16,42,74,112];
var GP_FALLBACK     = 0.055;        // ground given per phase, fraction of width
var GP_VEHICLES_AT  = 0.45, GP_ARMOR_AT = 0.68, GP_BRADLEYS = 2;
var GP_PHASE_BARK = ['',
  "THEY'RE COMING IN WAVES — FALL BACK!",
  'GIVE GROUND! KEEP THEM OFF THE CIVILIANS!',
  'ARMOR! OUR OWN BRADLEYS — BRACE!'];

// glyph-free defender model. armed=true -> returns fire. hp 0 -> indestructible cover.
var DEFENDERS = [
  { s:'gp_aa_gun',    fx:0.10, hp:3, w:0.075 },
  { s:'gp_vehicle',   fx:0.20, hp:3, w:0.070 },
  { s:'gp_wall',      fx:0.30, hp:0, w:0.080 },
  { s:'gp_soldier_a', fx:0.37, hp:GP_SOLDIER_HP, w:0.030, armed:true },
  { s:'gp_soldier_b', fx:0.43, hp:GP_SOLDIER_HP, w:0.030, armed:true },
  { s:'person',       fx:0.48, hp:1, w:0.028, civ:true },
  { s:'farmer',       fx:0.52, hp:1, w:0.028, civ:true },
  { s:'person',       fx:0.56, hp:1, w:0.028, civ:true },
  { s:'gp_soldier_c', fx:0.61, hp:GP_SOLDIER_HP, w:0.030, armed:true },
  { s:'gp_soldier_a', fx:0.67, hp:GP_SOLDIER_HP, w:0.030, armed:true },
  { s:'gp_wall_2',    fx:0.74, hp:0, w:0.080 },
  { s:'gp_aa_gun',    fx:0.86, hp:3, w:0.075 }
];
var defenders=[], gpPhase=0, gpWaveT=0, gpVehicles=false, gpArmor=false;
function gpPeople(){ var n=0; for(var i=0;i<defenders.length;i++){ var d=defenders[i]; if(d.alive&&d.hp>0&&(d.armed||d.civ)) n++; } return n; }
function gpPeopleTotal(){ var n=0; for(var i=0;i<DEFENDERS.length;i++) if(DEFENDERS[i].armed||DEFENDERS[i].civ) n++; return n; }
function buildDefenders(){
  defenders=[];
  for(var i=0;i<DEFENDERS.length;i++){ var d=DEFENDERS[i];
    defenders.push({ s:d.s, x:W*d.fx, hp:d.hp, maxhp:d.hp, w:W*d.w, armed:!!d.armed, civ:!!d.civ,
                     alive:true, vanish:0, fireCd:rnd(0,GP_SOLDIER_CD), hitT:0 });
  }
}

/* =====================================================================
   PAX RESCUE — THE ROPE, THE LADDER, THE STRANDED.

   THE ROPE hangs under the ornithopter. Its swing is RENDER-ONLY (a pendulum
   spring in drawRope, the house airy-glide pattern); the LOGIC end of the rope
   is always straight down from the hull, so every grab/hazard/delivery is
   deterministic. Fly LOW and pass the rope's end within reach of a stranded
   gnome's raised hands and they grab on. They HANG, they cannot climb. Fly them
   to the SAFE drop-off and set them down low. Drag them through the legion, a
   shot, a jet — or take a hit yourself — and they LET GO: a short drop is walked
   off (and can be picked up again); a long fall is lost.

   THE LADDER power-up replaces the rope for LADDER_SECS and holds LADDER_CAP.
   Gnomes on the ladder CLIMB — but only while you HOVER — and are safe once
   aboard. The choice: carry them to the drop-off, or hold still in danger long
   enough for them to finish climbing. Climbers not yet aboard still let go on a
   hit. The ladder is never pulled up with someone still on it.

   FRIENDLIES CANNOT BE BEAMED. The beam only ever searches the legion array
   (targets); the stranded live in their own array (friends), so beaming or
   sucking up a friendly is impossible by construction, not by penalty. The
   soldiers' fire is flagged ally and never knocks a gnome off the rope either.

   HARD VISUAL RULE: the rope is a plain line ending in a wooden TOGGLE, never a
   loop; the ladder is rails + rungs; hanging gnomes grip with their HANDS.
   ===================================================================== */
// THE FRIENDLY LOOK — the ONE place it lives. Joe hasn't picked it yet: change it here.
// Set `sprite` to an IMG key (load() it above) and the sprite draws instead of the ASCII.
var FRIENDLY_LOOK = {
  sprite: null,
  col:    '#6fd3ff',               // cyan — never the legion's painterly reds/browns
  ink:    '#02121c',               // outline so it reads on any ground
  stand:  ['\\o/', ' | ', '/ \\'], // waving on the ground (alternates with wave)
  wave:   ['_o/',  ' | ', '/ \\'],
  hang:   ['\\o/', ' | ', '/ \\'], // hands UP on the toggle — they grip with their hands
  climbA: ['|o/',  ' | ', '/ \\'],
  climbB: ['\\o|', ' | ', '/ \\'],
  fall:   ['\\o/', ' | ', '/ \\'],
  flag:   'HELP', flagCol:'#fff3a0', flagInk:'#1a2a3a'
};
var RESCUE_GRAB_R      = 0.026;  // fraction of W — rope end to a stranded gnome's raised hands
var RESCUE_SAFE_FALL   = 0.12;   // fraction of H — a drop shorter than this is walked off; longer is lost
var RESCUE_DELIVER_LOW = 0.07;   // fraction of H — feet this near the ground over the drop-off = delivered
var RESCUE_DROP_W      = 0.10;   // drop-off width, fraction of W
var RESCUE_BONUS       = 500, RESCUE_ALL_BONUS = 2500;
var RESCUE_REGRAB      = 0.8;    // seconds before a dropped gnome can grab on again
var RESCUE_LEGION_HUNTS= false;  // OFF: on a rescue front the CLOCK is the pressure; the legion patrols,
                                 // shoots at you and fouls the rope, but leaves the stranded be. ON: it also
                                 // marches on them and takes them (measured: an idle rescue front then fell
                                 // to captures at ~12s — the clock never mattered). Joe's call.
var RESCUE_PRESS       = 0.45;   // (hunts ON) the legion closes on the stranded at this fraction of line speed
var RESCUE_WAVE_EVERY  = 3.4, RESCUE_WAVE_SIZE = 2, RESCUE_MAX_GNOMES = 10;
var RESCUE_FALL_G      = 1400;   // px/s^2
var LADDER_SECS = 16, LADDER_CAP = 3, LADDER_CLIMB = 3.0, LADDER_HOVER_V = 70, LADDER_PICK_TTL = 14;

var friends=[], pickups=[], ladderT=0, ladderSpawned={}, overTitle='', lastResult=null;
function buildFriends(L){
  friends=[]; pickups=[]; ladderT=0; ladderSpawned={};
  if(!hasRescue(L)) return;
  for(var i=0;i<L.friends.length;i++)
    friends.push({ friend:true, x:W*L.friends[i], y:groundY(), vy:0, st:'ground', cd:0, prog:0, fade:0, how:'', ph:i*1.7 });
}
function dropZone(){ var L=LEVELS[level]; return (mode==='campaign' && L && hasRescue(L)) ? { x:W*L.drop, w:W*RESCUE_DROP_W } : null; }
function inDrop(x){ var d=dropZone(); return !!d && Math.abs(x-d.x) <= d.w/2; }
function rescuedN(){ var n=0; for(var i=0;i<friends.length;i++) if(friends[i].st==='safe') n++; return n; }
function lostN(){ var n=0; for(var i=0;i<friends.length;i++) if(friends[i].st==='lost') n++; return n; }
function onRope(){ for(var i=0;i<friends.length;i++) if(friends[i].st==='rope') return friends[i]; return null; }
function onLadder(){ var n=0; for(var i=0;i<friends.length;i++) if(friends[i].st==='ladder') n++; return n; }
function friendH(){ return sz().gnome; }
function ropeAnchorY(){ return P.y + SAUCER_W()*0.14; }
// sized so that at the bottom of the flight band a hanging gnome's feet just skim the ground
function ropeLen(){ return Math.max(24, groundY() - band().bot - SAUCER_W()*0.14 - friendH() - 2); }
function ropeEndY(){ return ropeAnchorY() + ropeLen(); }

/* ---------- the gnome legion ---------- */
var TARGETKINDS={
  gnome:  { val:100, sprites:['gnome'],        wander:15, lock:0.9, meter:4 },
  knife:  { val:150, sprites:['gnome_knife'],  wander:24, lock:1.0, meter:4 },
  pistol: { val:250, sprites:['gnome_pistol'], wander:12, lock:1.3, meter:5, shoots:true },
  smg:    { val:350, sprites:['gnome_smg'],    wander:10, lock:1.5, meter:6, shoots:true, fast:true },
  heavy:  { val:500, sprites:['gnome_heavy'],  wander:7,  lock:1.8, meter:7, shoots:true, fast:true },
  vehicle:{ val:0,   sprites:['gp_vehicle'],   wander:5,  lock:1.2, meter:0, hazardGrab:true }
};
function countKind(k){ var n=0; for(var i=0;i<targets.length;i++) if(!targets[i].gone && targets[i].kind===k) n++; return n; }
function pickKind(b){
  var r=Math.random()-(b||0)*0.42;
  if(r<0.40) return 'gnome';
  if(r<0.58) return 'knife';
  if(r<0.74) return 'pistol';
  if(r<0.88) return 'smg';
  if(r<0.96) return 'heavy';
  return 'vehicle';
}
function curBias(){ return (mode==='campaign' && LEVELS[level])?LEVELS[level].bias:0.3; }
function pickSpawnKind(){ var k=pickKind(curBias()); if(k==='vehicle' && countKind('vehicle')>=2) k='gnome'; return k; }
function spawnTarget(kind){
  // The sandbox capped at 9 and counted DEAD targets, which silently strangled the
  // mission's waves — reinforcements simply never arrived. Count the living, and cap
  // at the mission's own bounded number.
  var liveN=0; for(var q=0;q<targets.length;q++) if(!targets[q].gone) liveN++;
  if(liveN >= GP_MAX_GNOMES + GP_BRADLEYS) return;
  if(targets.length > 240) targets = targets.filter(function(t){ return !t.gone; });
  kind = kind || pickSpawnKind();
  var def=TARGETKINDS[kind], sp=def.sprites[(Math.random()*def.sprites.length)|0];
  // the legion MARCHES IN from the edges — it does not mill about in the middle
  var fromWest = chance(0.5);
  var ex = fromWest ? W*rnd(0.01,0.07) : W*rnd(0.93,0.99);
  targets.push({ kind:kind, def:def, sprite:sp, x:ex, y:groundY(), vx:0,vy:0, dir:fromWest?1:-1,
                 lock:0, lifting:false, gone:false, fireCd:rnd(1.5,3.5), isBoss:false,
                 hp:(kind==='heavy'?2:kind==='vehicle'?3:1), strikeCd:rnd(0.3,1.2) });
}
function spawnBoss(){ targets.push({ kind:'heavy', def:{val:BOSS_BONUS,sprites:['gnome_heavy'],wander:7*0.5,lock:1.6,meter:8,shoots:true,fast:true}, sprite:'gnome_heavy',
  x:W*rnd(0.25,0.75), y:groundY(), vx:0,vy:0, dir:chance(.5)?1:-1, lock:0, lifting:false, gone:false, fireCd:rnd(0.7,1.2), isBoss:true });
  flash('THE GNOME GENERAL','#ffd23f',1.6); }

/* ---------- starts ---------- */
function startCampaign(){ startMission(0); }
function startMission(idx){ score=0; hp=maxHP; clock=0; startLevel(idx); }
function startLevel(idx){
  level=idx; mode='campaign'; var L=LEVELS[idx];
  P=newPlayer(); targets=[]; jets=[]; shots=[]; fx=[]; shake=0;
  meter=8; stageClock=L.clock; levelLen=L.clock; jetTimer=2; aaTimer=1.8;
  runActive=false; bossTele=false; bossSpawned=false;
  if(hasLine(L)) buildDefenders(); else defenders=[];
  gpPhase=0; gpWaveT=hasLine(L)?GP_WAVE_EVERY:RESCUE_WAVE_EVERY; gpVehicles=false; gpArmor=false;
  buildFriends(L); overTitle='';
  scenery=[]; for(var i=0;i<L.props.length;i++) scenery.push({ x:W*(0.04+i*0.14+rnd(-0.02,0.02)), s:L.props[i], w:clamp(W*rnd(0.05,0.085),60,150) });
  var rush = hasLine(L) ? 7 : 4;          // a rescue opens lighter — the clock is the pressure
  for(var k=0;k<rush;k++) spawnTarget();   // the opening rush, already on the road
  state='play'; flash('FRONT '+(idx+1)+'  —  '+L.zone+'  ·  '+KIND_NAME[L.kind], TH.accent, 2.0);
}
function endResult(passed, reason){
  var L=LEVELS[level]||{};
  lastResult={ idx:level, kind:L.kind, zone:L.zone, passed:passed, reason:reason, t:+(levelLen-stageClock).toFixed(2),
               people:defenders.length?gpPeople():null, peopleTotal:defenders.length?gpPeopleTotal():null,
               rescued:rescuedN(), lost:lostN(), need:L.need||0, stranded:friends.length };
}
function rescueClear(L){

  if(k==='['){ damp=Math.max(8,damp-1); return; } if(k===']'){ damp=Math.min(46,damp+1); return; }
  if(k==='-'||k==='_'){ accel=Math.max(60,accel-20); return; } if(k==='='||k==='+'){ accel=Math.min(680,accel+20); return; }
  if(k==='f'){ if(state==='play' && clock>P.warbleCd){ P.warbleU=clock+0.5; P.warbleCd=clock+1.1; planting=false; } return; }
  var d=kn(e); if(d&&!held[d]){ held[d]=true; nf[d]=clock; e.preventDefault(); }
});
addEventListener('keyup',function(e){ if(e.key===' '){ planting=false; return; } var d=kn(e); if(d) held[d]=false; });

function pumpPlayer(){
  var b=band();

    if(held.left &&clock>=nf.left ){ P.tx=clamp(P.tx-STEP,W*0.05,W*0.95); nf.left =(nf.left ===clock?clock+delay:nf.left )+repeat; }
    if(held.right&&clock>=nf.right){ P.tx=clamp(P.tx+STEP,W*0.05,W*0.95); nf.right=(nf.right===clock?clock+delay:nf.right)+repeat; }
    if(held.up   &&clock>=nf.up   ){ P.ty=clamp(P.ty-STEP,b.top,b.bot);   nf.up   =(nf.up   ===clock?clock+delay:nf.up   )+repeat; }
    if(held.down &&clock>=nf.down ){ P.ty=clamp(P.ty+STEP,b.top,b.bot);   nf.down =(nf.down ===clock?clock+delay:nf.down )+repeat; }
  }
}

/* ---------- combat ---------- */
var MAX_FX=80, MAX_SHOTS=140;
function addFx(x,y,kind,col,n){ if(fx.length>=MAX_FX) fx.shift(); fx.push({x:x,y:y,kind:kind||'burst',col:col||'#ffd27a',t:0,life:n||0.45}); }

  hp-=34; P.stun=1.1; P.invuln=2.0; shake=18; addFx(P.x,P.y,'boom','#ff7a3a',0.6);

}

/* ---------- update ---------- */
function stageOf(){ return meter<35?0 : meter<60?1 : meter<82?2 : 3; }
var STAGECOL=['#39ff14','#ffe23a','#ff9d3a','#ff5d6c'], STAGENAME=['QUIET','MUSTER','ADVANCE','OVERRUN'];
function update(dt){
  t+=dt;
  if(state!=='play'){ if(msgT>0)msgT-=dt; if(shake>0)shake*=0.9; return; }
  clock+=dt; stageClock-=dt; if(msgT>0)msgT-=dt; if(shake>0)shake-=dt*40;
  if(P.stun>0)P.stun-=dt; if(P.invuln>0)P.invuln-=dt;
  var stg=stageOf(), L=LEVELS[level], elapsed=levelLen-stageClock;
  pumpPlayer(); var pox=P.x, poy=P.y; spring(P,P.tx,P.ty,dt); P.spd=Math.hypot(P.x-pox,P.y-poy)/Math.max(dt,1e-6); P.bank += (clamp(P.vx/190,-1,1)-P.bank)*Math.min(1,7*dt);
  if(mode!=='base') meter = clamp(meter + dt*1.9, 0, 100);

  var worldSpeed = (mode==='campaign' && defenders.length)
      ? GP_PHASE_SCROLL[Math.min(gpPhase,GP_PHASE_SCROLL.length-1)] : 16;
  if(mode==='campaign' && elapsed>=L.scrollStart){
    if(!runActive){ runActive=true; flash('>>> THE LEGION ADVANCES <<<','#ff9d3a',1.4); }
    var ramp=clamp((elapsed-L.scrollStart)/Math.max(1,levelLen-L.scrollStart),0,1);
    worldSpeed=16+90*ramp; if(!planting && P.stun<=0) P.tx=clamp(P.tx-(22+70*ramp)*dt, W*0.05, W*0.95);
  }
  for(var i=0;i<scenery.length;i++){ scenery[i].x-=worldSpeed*dt; if(scenery[i].x<-W*0.12) scenery[i].x+=W*1.24; }

  if(mode==='campaign' && L.boss){
    if(!bossTele && elapsed>=BOSS_TELE){ bossTele=true; flash('a heavy tread shakes the field…','#ffe23a',1.6); }
    if(!bossSpawned && elapsed>=BOSS_APPEAR){ bossSpawned=true; spawnBoss(); }
  }
  if(mode==='base'){ if(stageClock<=0){ state='clear'; score+=3000; flash('THE SIEGE BROKEN  +3000','#9affc0',99); } }
  else if(defenders.length && gpPeople()===0){
    // the town is gone — the mission is lost the moment the last person falls
    state='over'; flash('THE LEGION TOOK GUNPOWDER…','#ff5d6c',99); endResult(false,'town');
  }
  else if(friends.length && friends.length-lostN() < L.need){
    // not enough of the stranded left alive to make the count — the rescue is over
    state='over'; overTitle='LEFT BEHIND'; flash('TOO MANY LOST — '+L.zone+' ABANDONED','#ff5d6c',99); endResult(false,'lost');
  }
  else if(L.kind==='rescue' && rescuedN()>=L.need && rescuedN()+lostN()===friends.length){
    // everyone who could be saved is safe — no need to wait for the horn
    rescueClear(L); endResult(true,'all-resolved'); nextLevel();
  }
  else if(stageClock<=0){
    if(friends.length && rescuedN() < L.need){
      state='over'; overTitle='LEFT BEHIND';
      flash('THE CLOCK RAN OUT — '+rescuedN()+'/'+L.need+' SAFE','#ff5d6c',99); endResult(false,'clock');
    } else {
      if(defenders.length){
        var saved=gpPeople(), total=gpPeopleTotal();
        score += GP_SAVE_BONUS*saved;
        if(saved===total){ score+=3000; flash(L.zone+' HELD — EVERY SOUL  +3000','#9affc0',1.8); }
        else flash(L.zone+' HELD  '+saved+'/'+total+' saved  +'+(GP_SAVE_BONUS*saved),'#9affc0',1.8);
      }
      if(friends.length) rescueClear(L);
      endResult(true,'horn'); nextLevel();
    }
  }

  gpMission(dt, elapsed);
  rescueTick(dt, elapsed);

  P.lock=null;
  if(planting && P.stun<=0){
    var bestD=W*0.06, bi=-1;
    for(var i=0;i<targets.length;i++){ var c=targets[i]; if(c.gone) continue; var dxp=Math.abs(c.x-P.x); if(dxp<bestD && P.y<c.y){ bestD=dxp; bi=i; } }
    if(bi>=0){ var tg=targets[bi]; P.lock=tg; tg.lock=clamp(tg.lock+dt/tg.def.lock,0,1); tg.lifting=true; if(tg.lock>=1) abduct(tg); }
  }
  for(var i=0;i<targets.length;i++){ var c=targets[i]; if(c!==P.lock && c.lock>0){ c.lock=Math.max(0,c.lock-dt*1.5); if(c.lock<=0)c.lifting=false; } }

  for(var i=0;i<targets.length;i++){ var c=targets[i];
    if(c.gone){ if(c.respawn>1e8) continue; c.respawn-=dt; if(c.respawn<=0){ c.gone=false; c.lock=0; c.lifting=false; c.x=chance(.5)?W*0.03:W*0.97; c.y=groundY(); var nk=pickSpawnKind(); c.kind=nk; c.def=TARGETKINDS[nk]; c.sprite=c.def.sprites[(Math.random()*c.def.sprites.length)|0]; c.isBoss=false; } continue; }
    if(c.lifting && c.lock>0){ c.y = groundY() - (groundY()-(P.y+SAUCER_W()*0.18))*c.lock; }
    else {
      c.y=groundY();
      // ADVANCE on the nearest standing defender and strike in reach. This is the
      // mission: the legion is not wandering, it is coming for the town.
      var near=null, nd=1e9;
      for(var q=0;q<defenders.length;q++){ var d=defenders[q];
        if(!d.alive || d.hp<=0 || d.vanish>0) continue;
        var dd=Math.abs(d.x-c.x); if(dd<nd){ nd=dd; near=d; } }
      if(RESCUE_LEGION_HUNTS) for(var q=0;q<friends.length;q++){ var fr=friends[q];   // ...and on the stranded
        if(fr.st!=='ground') continue;
        var dd=Math.abs(fr.x-c.x); if(dd<nd){ nd=dd; near=fr; } }
      var surge = GP_PHASE_SURGE[Math.min(gpPhase,GP_PHASE_SURGE.length-1)];
      if(near){
        c.dir = near.x>c.x ? 1 : -1;
        if(nd > W*GP_REACH){ c.x += c.dir*(W*GP_ADVANCE*surge*(near.friend?RESCUE_PRESS:1))*dt; }
        else {
          c.strikeCd -= dt;
          if(c.strikeCd<=0 && near.friend){ c.strikeCd = GP_ATTACK_CD; loseFriend(near,'captured'); }
          else if(c.strikeCd<=0){ c.strikeCd = GP_ATTACK_CD;
            near.hp -= (c.kind==='vehicle'||c.isBoss)?2:1; near.hitT=0.18;
            addFx(near.x, groundY()-14, 'burst', '#ff7a3a', 0.4);
            if(near.hp<=0){ near.vanish=0.5;
              flash(near.civ?'A CIVILIAN IS DOWN':'THE LINE IS BREAKING','#ff5d6c',1.1); shake=6; }
          }
        }
      } else { c.x += c.dir*c.def.wander*surge*dt; if(c.x<W*0.02||c.x>W*0.98)c.dir*=-1; }
    }
    if(c.def.shoots && !c.lifting && stg>=1){ c.fireCd-=dt; if(c.fireCd<=0){ c.fireCd=c.def.fast?rnd(0.8,1.6):rnd(2.0,3.4);
      var dx=P.x-c.x, dy=P.y-(c.y-18), L2=Math.hypot(dx,dy)||1, sp=c.def.fast?460:360;
      shoot(c.x,c.y-22,dx/L2*sp,dy/L2*sp,'potshot', c.isBoss?'#ffd23f':'#ffe2a0'); addFx(c.x,c.y-22,'spark','#ffe2a0',0.2); } }
  }

  var jetCap = stress?9 : mode==='base'?4 : (stg>=3?3:2);
  var jetGap = stress?0.35 : mode==='base'?0.9 : (stg>=3?1.3:2.0);
  if(stg>=2 || mode==='base'){ jetTimer-=dt; if(jetTimer<=0 && jets.length<jetCap){ spawnJet(stg); jetTimer=jetGap+rnd(0,jetGap); } }
  for(var j=jets.length-1;j>=0;j--){ var je=jets[j]; je.x+=je.vx*dt;
    var ty=je.base+Math.sin(clock*je.spd+je.phase)*je.amp;
    if(GLIDE){ var oy=je.y; je.vy+=((ty-je.y)*accel-je.vy*damp)*dt; je.y+=je.vy*dt; if((ty-oy)*(ty-je.y)<0){je.y=ty;je.vy=0;} } else je.y=ty;
    je.bank+=(clamp(je.vy/200,-1,1)-je.bank)*Math.min(1,7*dt);
    if(stg>=3 || mode==='base'){ je.fireCd-=dt; if(je.fireCd<=0 && je.x>W*0.1 && je.x<W*0.9){ je.fireCd=stress?rnd(0.25,0.6):rnd(0.9,1.7);
      if(chance(0.4)){ shoot(je.x,je.y+10,je.vx*0.3,60,'missile','#ff5d6c'); addFx(je.x,je.y,'spark','#ff9d3a',0.2); }
      else { var dx=P.x-je.x, dy=P.y-je.y, L3=Math.hypot(dx,dy)||1; shoot(je.x,je.y,dx/L3*560,dy/L3*560,'tracer','#fff2a0'); } } }
    if(Math.hypot(je.x-P.x,je.y-P.y) < SAUCER_W()*0.42) hitPlayer();
    if((je.dir>0&&je.x>W+90)||(je.dir<0&&je.x<-90)) jets.splice(j,1);
  }

  if(stg>=3 || mode==='base'){ aaTimer-=dt; if(aaTimer<=0){ aaTimer= stress?rnd(0.25,0.6) : mode==='base'?rnd(0.9,1.5) : rnd(1.4,2.2);
    var ax=clamp(P.x+rnd(-W*0.05,W*0.05),0,W); fx.push({x:ax,y:groundY(),kind:'aatel',col:'#ff5d6c',t:0,life:0.6,fire:true}); } }

  for(var s=shots.length-1;s>=0;s--){ var sh=shots[s]; sh.t+=dt;
    if(sh.kind==='missile' && !sh.harmless){ var dx=P.x-sh.x, dy=P.y-sh.y, L4=Math.hypot(dx,dy)||1, turn=160;
      sh.vx+=dx/L4*turn*dt; sh.vy+=dy/L4*turn*dt; var sp=Math.hypot(sh.vx,sh.vy); if(sp>300){sh.vx*=300/sp;sh.vy*=300/sp;}
      if(chance(0.5 - stageOf()*0.13)) addFx(sh.x,sh.y,'smoke','#9aa',0.45); }
    sh.x+=sh.vx*dt; sh.y+=sh.vy*dt;
    var radH = warbling()? SAUCER_W()*0.52 : SAUCER_W()*0.36;
    if(!sh.harmless && Math.hypot(sh.x-P.x,sh.y-P.y) < radH){
      if(warbling()){ var dxx=sh.x-P.x, dyy=sh.y-P.y, LL=Math.hypot(dxx,dyy)||1, spd=Math.hypot(sh.vx,sh.vy)||320;
        sh.vx=dxx/LL*spd*1.15+rnd(-50,50); sh.vy=dyy/LL*spd*1.15-50; sh.harmless=true; addFx(sh.x,sh.y,'snatch','#9affc0',0.35); }
      else if(P.invuln>0){ shots.splice(s,1); } else { hitPlayer(); shots.splice(s,1); }
      continue;
    }
    if(sh.t>sh.life || sh.x<-60||sh.x>W+60||sh.y<-60||sh.y>H+60) shots.splice(s,1);
  }
  for(var f=fx.length-1;f>=0;f--){ var e=fx[f]; e.t+=dt;
    if(e.kind==='aatel' && e.fire && e.t>=e.life){ shoot(e.x,groundY(),0,-560,'aa','#ff5d6c'); e.fire=false; }
    if(e.t>e.life) fx.splice(f,1);
  }
}
/* ---------- THE GUNPOWDER HORROR — mission tick ---------- */
function gpMission(dt, elapsed){
  if(mode!=='campaign') return;
  if(!defenders.length){          // a pure RESCUE front: lighter waves, no line, no armor
    if(stageClock > GP_WAVES_STOP){ gpWaveT -= dt;
      if(gpWaveT<=0){ gpWaveT = RESCUE_WAVE_EVERY;
        var live=0; for(var i=0;i<targets.length;i++) if(!targets[i].gone) live++;
        for(var k=0; k<RESCUE_WAVE_SIZE && live<RESCUE_MAX_GNOMES; k++){ spawnTarget(); live++; } } }
    return;
  }
  var prog = clamp(elapsed/Math.max(1,levelLen), 0, 1);

  // --- THE FALLBACK: phases turn on progress; the armed line gives ground ---
  var want=0; for(var i=0;i<GP_PHASE_AT.length;i++) if(prog>=GP_PHASE_AT[i]) want++;
  if(want>gpPhase){
    gpPhase=want;
    var mid=W*0.5, step=W*GP_FALLBACK;
    for(var i=0;i<defenders.length;i++){ var d=defenders[i];
      if(d.alive && d.hp>0 && d.armed){ d.x += (d.x<mid? step : -step); d.x=clamp(d.x,W*0.06,W*0.94); } }
    if(GP_PHASE_BARK[gpPhase]) flash(GP_PHASE_BARK[gpPhase], gpPhase>=3?'#ff5d6c':'#ff9d3a', 1.6);
    shake=Math.max(shake,5);
  }

  // --- reinforcements keep marching until the last killable wave ---
  if(stageClock > GP_WAVES_STOP){
    gpWaveT -= dt;
    if(gpWaveT<=0){ gpWaveT = GP_WAVE_EVERY;
      var live=0; for(var i=0;i<targets.length;i++) if(!targets[i].gone) live++;
      for(var k=0; k<GP_WAVE_SIZE && live<GP_MAX_GNOMES; k++){ spawnTarget(); live++; }
    }
  }
  // --- the set vehicle force, then the captured Bradleys for the climax ---
  if(!gpVehicles && prog>=GP_VEHICLES_AT){ gpVehicles=true; spawnTarget('vehicle'); spawnTarget('vehicle');
    flash('CARTS ON THE ROAD','#ffd23f',1.2); }
  if(!gpArmor && prog>=GP_ARMOR_AT){ gpArmor=true;
    for(var k=0;k<GP_BRADLEYS;k++) spawnBradley();
    flash('BRADLEYS — THEY TOOK OUR OWN ARMOR','#ff5d6c',2.0); shake=10; }

  // --- THE LINE SHOOTS BACK -------------------------------------------------
  // A gnome the soldiers drop pays the player NOTHING. Hiding behind a working
  // line is survivable and poor; the score is out in the swarm.
  for(var i=0;i<defenders.length;i++){ var d=defenders[i];
    if(d.vanish>0){ d.vanish-=dt; if(d.vanish<=0) d.alive=false; continue; }
    if(d.hitT>0) d.hitT-=dt;
    if(!d.alive || d.hp<=0 || !d.armed) continue;
    d.fireCd-=dt; if(d.fireCd>0) continue;
    var tgt=null, td=W*GP_SOLDIER_RANGE;
    for(var q=0;q<targets.length;q++){ var c=targets[q];
      if(c.gone||c.lifting) continue; var dd=Math.abs(c.x-d.x); if(dd<td){ td=dd; tgt=c; } }
    if(!tgt) continue;
    d.fireCd=GP_SOLDIER_CD;
    shoot(d.x, groundY()-16, (tgt.x>d.x?1:-1)*420, -20, 'tracer', '#ffe6a0'); shots[shots.length-1].ally=true;
    tgt.hp-=1;
    if(tgt.hp<=0){ addFx(tgt.x, groundY()-16, 'burst', '#9affc0', 0.4); tgt.gone=true; tgt.respawn=1e9; }
  }
}

/* ---------- PAX RESCUE — tick ---------- */
function saveFriend(f, how){
  if(f.st==='safe'||f.st==='lost') return;
  f.st='safe'; f.how=how; f.prog=0; f.y=groundY(); score+=RESCUE_BONUS;
  if(how==='drop'){ var d=dropZone(); if(d) f.x=clamp(f.x, d.x-d.w*0.4, d.x+d.w*0.4); }
  addFx(f.x, how==='aboard'?P.y:groundY()-14, 'snatch', FRIENDLY_LOOK.col, 0.5);
  flash(how==='aboard'?'ABOARD — SAFE  +'+RESCUE_BONUS:'SAFE!  +'+RESCUE_BONUS, FRIENDLY_LOOK.col, 0.9);
}
function loseFriend(f, how){
  if(f.st==='safe'||f.st==='lost') return;
  f.st='lost'; f.how=how; f.fade=1.0; f.y=groundY();
  addFx(f.x, groundY()-10, 'smoke', '#9aa', 0.6);
  flash(how==='captured'?'THE LEGION TOOK ONE OF OURS':'LOST IN THE FALL','#ff9d3a',1.1);
}
function releaseFriend(f, why){
  if(f.st!=='rope' && f.st!=='ladder') return false;
  f.st='fall'; f.vy=0; f.fallFrom=f.y; f.cd=RESCUE_REGRAB; f.prog=0;
  if(why) flash(why,'#ffb347',0.9);
  return true;
}
function releaseAll(why){ var any=false; for(var i=0;i<friends.length;i++) if(releaseFriend(friends[i])) any=true; if(any&&why) flash(why,'#ffb347',1.0); return any; }
function giveLadder(){
  P.gear='ladder'; ladderT=LADDER_SECS;
  var r=onRope(); if(r){ r.st='ladder'; r.prog=0; }       // whoever is on the rope steps onto the bottom rung
  flash('LADDER! HOVER TO LET THEM CLIMB · '+LADDER_CAP+' MAX', '#ffd23f', 1.4);
}
function rescueTick(dt, elapsed){
  if(!friends.length) return;
  var L=LEVELS[level];
  // --- LADDER power-ups, on the level's schedule ---
  for(var i=0;i<(L.ladders||[]).length;i++){ var ld=L.ladders[i];
    if(!ladderSpawned[i] && elapsed>=ld.at){ ladderSpawned[i]=1; var b=band();
      pickups.push({ x:W*ld.x, y:b.top+(b.bot-b.top)*0.45, ttl:LADDER_PICK_TTL }); flash('A LADDER DRIFTS IN','#ffd23f',1.0); } }
  for(var i=pickups.length-1;i>=0;i--){ var pk=pickups[i]; pk.ttl-=dt;
    if(Math.hypot(pk.x-P.x, pk.y-P.y) < SAUCER_W()*0.55){ pickups.splice(i,1); giveLadder(); continue; }
    if(pk.ttl<=0) pickups.splice(i,1); }
  if(P.gear==='ladder'){ ladderT-=dt;
    if(ladderT<=0 && !onLadder()){ P.gear='rope'; ladderT=0; flash('LADDER STOWED — BACK ON THE ROPE','#bdf2cf',0.9); } }

  var FH=friendH(), gy=groundY(), ex=P.x, ey=ropeEndY(), R=Math.max(22, W*RESCUE_GRAB_R);
  var hovering = P.spd < LADDER_HOVER_V;
  for(var i=0;i<friends.length;i++){ var f=friends[i];
    if(f.cd>0) f.cd-=dt;
    if(f.st==='lost'){ if(f.fade>0) f.fade-=dt*0.6; continue; }
    if(f.st==='safe') continue;
    if(f.st==='ground'){
      if(f.cd>0 || P.stun>0) continue;
      // hands are at the top of the figure; the rope's end must pass within reach of them
      if(Math.hypot(f.x-ex, (gy-FH)-ey) < R){
        if(P.gear==='rope' && !onRope()){ f.st='rope'; flash('GOT ONE — HANG ON! FLY THEM TO SAFE','#6fd3ff',1.0); }
        else if(P.gear==='ladder' && ladderT>0 && onLadder()<LADDER_CAP){ f.st='ladder'; f.prog=0; flash('ON THE LADDER — HOVER SO THEY CAN CLIMB','#6fd3ff',1.0); }
      }
      continue;
    }
    if(f.st==='fall'){
      f.vy += RESCUE_FALL_G*dt; f.y += f.vy*dt;
      if(f.y>=gy){ f.y=gy; f.vy=0;
        var drop=gy-f.fallFrom;
        if(drop > H*RESCUE_SAFE_FALL) loseFriend(f,'fall');
        else if(inDrop(f.x)) saveFriend(f,'drop');           // a short hop down INTO the camp counts
        else { f.st='ground'; flash('SHORT DROP — THEY\'RE OK','#bdf2cf',0.8); }
      }
      continue;
    }
    // --- carried: rope (hangs, never climbs) or ladder (climbs while you hover) ---
    f.x=P.x;
    if(f.st==='ladder'){
      if(hovering) f.prog += dt/LADDER_CLIMB;
      if(f.prog>=1){ saveFriend(f,'aboard'); continue; }
      f.y = ey - f.prog*(ropeLen()-6) + FH;
    } else f.y = ey + FH;
    // delivery: set them down LOW over the SAFE drop-off
    if(f.y >= gy - H*RESCUE_DELIVER_LOW && inDrop(f.x)){ saveFriend(f,'drop'); continue; }
    // hazards — anything that hits the hanging body shakes them off
    var cx=f.x, cy=f.y-FH*0.5, hit=false;
    for(var s=shots.length-1;s>=0;s--){ var sh=shots[s]; if(sh.harmless||sh.ally) continue;
      if(Math.hypot(sh.x-cx, sh.y-cy) < FH*0.5){ shots.splice(s,1); hit=true; break; } }
    if(!hit) for(var j=0;j<jets.length;j++) if(Math.hypot(jets[j].x-cx, jets[j].y-cy) < SAUCER_W()*0.35){ hit=true; break; }
    if(!hit && f.y > gy-FH*0.5) for(var q=0;q<targets.length;q++){ var c=targets[q];
      if(!c.gone && !c.lifting && Math.abs(c.x-f.x) < W*0.016){ hit=true; break; } }
    if(hit){ addFx(cx,cy,'spark','#ffb347',0.3); releaseFriend(f,'DRAGGED THROUGH IT — THEY LET GO'); }
  }
}

/* ---------- ?selftest — the mission, proven headless ------------------------
   House convention (MERC ZEBRA selfTest, SUCK UP --selftest): verification lives
   IN the artifact, not in a throwaway rig. "It loaded with no console errors" is
   not a test — a page whose sprites 404 still boots, still paints, and still
   reports clean. So this asserts PROOF OF LIFE: the line exists, the legion
   closes on it, damage actually lands, waves keep arriving, and the phases turn.
   Runs the real update() on a fixed dt — no rendering, no timers, no RNG seeding
   needed because every assertion is about behaviour, not exact values.
   Open: PAX GNOMANIA — AIRY.html?selftest
   --------------------------------------------------------------------------- */
function selfTest(){
  var R=[], ok=function(n,c,d){ R.push({n:n,ok:!!c,d:d||''}); };
  W=1280; H=860;
  var SURV=-1, BOTH=-1, RESC=[];
  LEVELS.forEach(function(L,i){ if(L.kind==='survival'&&SURV<0) SURV=i; if(L.kind==='both'&&BOTH<0) BOTH=i; if(L.kind==='rescue') RESC.push(i); });
  ok('the fronts are a MIX of kinds', LEVELS.map(function(L){return L.kind;}).join(',')==='rescue,rescue,survival,rescue,both',
     LEVELS.map(function(L){return L.kind;}).join(' · '));

  // ================= SURVIVAL — THE GUNPOWDER HORROR, unchanged =================
  startMission(SURV);
  ok('the line is built', defenders.length===DEFENDERS.length, defenders.length+' defenders');
  ok('there are people to save', gpPeopleTotal()>0 && gpPeople()===gpPeopleTotal(),
     gpPeople()+'/'+gpPeopleTotal());
  ok('armed defenders exist (the line can fight back)',
     defenders.filter(function(d){return d.armed;}).length>=3);
  ok('the legion is on the field at kickoff', targets.filter(function(t){return !t.gone;}).length>0);

  // the legion should start at the EDGES, not milling in the middle
  var mid=0; for(var i=0;i<targets.length;i++) if(!targets[i].gone && Math.abs(targets[i].x-W*0.5)<W*0.25) mid++;
  ok('the legion marches in from the edges', mid===0, mid+' spawned mid-field');

  var hp0=0; for(i=0;i<defenders.length;i++) hp0+=Math.max(0,defenders[i].hp);
  var g0=targets.filter(function(t){return !t.gone;}).length;
  var dt=1/60, phasesSeen={};
  for(var k=0;k<60*30;k++){ update(dt); phasesSeen[gpPhase]=1; }
  var hp1=0; for(i=0;i<defenders.length;i++) hp1+=Math.max(0,defenders[i].hp);
  var g1=targets.filter(function(t){return !t.gone;}).length;

  ok('the legion reaches the line and does damage', hp1<hp0, hp0+' -> '+hp1+' line HP');
  ok('reinforcements keep arriving', g1>0, g1+' on the field after 30s');
  ok('the swarm stays BOUNDED (a set force, perf-safe)', g1<=GP_MAX_GNOMES+GP_BRADLEYS+2, g1+' vs cap '+GP_MAX_GNOMES);
  ok('THE FALLBACK turns phases', gpPhase>0, 'reached phase '+gpPhase);
  ok('the stage clock runs', stageClock<levelLen);

  ok('a survival front has no stranded and no rope', friends.length===0 && !dropZone());

  // the mission must be LOSABLE — an unbeatable or unloseable defense is not a mission.
  // Read the town at the moment THIS front ends (the next front builds its own line).
  // The hull is pinned: an idle ship gets shot down ~21s in, which ended the old run
  // with the town at 4/7 — it passed on the PLAYER dying, not the TOWN falling.
  startMission(SURV); lastResult=null;
  for(k=0;k<60*Math.ceil(levelLen+2) && state==='play' && level===SURV;k++){ hp=maxHP; update(dt); }
  var lr=lastResult||{};
  ok('an untouched town falls (the player is load-bearing)', lr.idx===SURV && lr.people<lr.peopleTotal,
     lr.people+'/'+lr.peopleTotal+' left with no player help ('+lr.reason+' @ '+lr.t+'s)');

  // ================= RESCUE — the rope, the ladder, the stranded =================
  // A QUIET rig: the real update(), but no legion/jets/waves, so each rule is isolated.
  var b, low, mid;
  function quiet(idx){ startMission(idx); targets=[]; shots=[]; jets=[]; gpWaveT=1e9; pickups=[];
    (LEVELS[idx].ladders||[]).forEach(function(_,i){ ladderSpawned[i]=1; });
    b=band(); low=b.bot; mid=(b.top+b.bot)/2; }
  function park(x,y){ P.x=P.tx=x; P.y=P.ty=y; P.vx=P.vy=0; }
  function run(sec){ for(var n=0;n<Math.round(sec*60);n++){ meter=0; update(dt); } }
  var R0=RESC[0];

  quiet(R0);
  var f0=friends[0], f1=friends[1], f2=friends[2];
  ok('stranded friendlies are on the ground', friends.length===LEVELS[R0].friends.length && friends.every(function(f){return f.st==='ground';}),
     friends.length+' stranded, need '+LEVELS[R0].need);
  park(f2.x, mid); run(0.3);
  ok('the rope does NOT reach from mid-band (you must fly low)', f2.st==='ground');
  planting=true; run(1.0); planting=false;
  ok('the beam cannot lift a friendly (impossible by construction)', f2.st==='ground' && P.lock===null);
  park(f0.x, low); run(0.2);
  ok('the rope grabs a friendly within reach', f0.st==='rope', 'rope end '+Math.round(ropeEndY())+' vs hands '+Math.round(groundY()-friendH()));
  ok('...and only one — the rope holds one', friends.filter(function(f){return f.st==='rope';}).length===1 && f1.st==='ground');
  var sc0=score; park(dropZone().x, low); run(0.2);
  ok('a delivery at the drop-off counts', f0.st==='safe' && f0.how==='drop' && rescuedN()===1 && score-sc0===RESCUE_BONUS,
     rescuedN()+' safe, +'+(score-sc0));

  quiet(R0); f0=friends[0]; f1=friends[1]; f2=friends[2];
  park(f0.x, low); run(0.2); park(f0.x+W*0.06, mid); run(0.3);
  var wasRope=f0.st==='rope'; P.invuln=0; hitPlayer();
  ok('a hit makes them let go', wasRope && f0.st==='fall');
  run(1.5);
  ok('...and a long fall is lost', f0.st==='lost', 'fell '+Math.round(groundY()-(f0.fallFrom||0))+'px vs safe '+Math.round(H*RESCUE_SAFE_FALL)+'px');
  P.invuln=0; P.stun=0; hp=maxHP;
  park(f1.x, low); run(0.2); var r1=f1.st==='rope'; P.invuln=0; hitPlayer(); run(0.5);
  ok('...but a short drop is walked off (can be picked up again)', r1 && f1.st==='ground');
  P.invuln=0; P.stun=0; hp=maxHP; f2.cd=0;
  park(f2.x, low); run(0.2);
  spawnTarget('gnome'); var foe=targets[targets.length-1]; foe.x=P.x; run(1/60);
  ok('dragging them through the legion makes them let go', f2.st==='fall');
  targets=[]; run(0.6); f2.cd=0; P.stun=0; run(0.1);
  var g2=f2.st==='rope';
  shoot(f2.x, f2.y-friendH()*0.5, 0,0,'tracer','#fff'); shots[shots.length-1].ally=true; run(1/60);
  var allyOk=f2.st==='rope';
  shoot(f2.x, f2.y-friendH()*0.5, 0,0,'potshot','#fff'); run(1/60);
  ok('an enemy shot knocks them off; the soldiers\' ally fire never does', g2 && allyOk && f2.st==='fall');

  // THE LADDER — caps at 3, climbers become safe once aboard (while you hover)
  var RL=RESC[RESC.length-1]; quiet(RL);
  var X=W*0.40; for(var i=0;i<4;i++){ friends[i].x=X; }
  park(X, mid); pickups.push({x:P.x,y:P.y,ttl:5}); run(1/60);
  ok('the LADDER pickup replaces the rope', P.gear==='ladder' && ladderT>0);
  var maxOn=0; park(X, low);
  for(var n=0;n<6;n++){ run(1/60); maxOn=Math.max(maxOn,onLadder()); }
  ok('the ladder caps at 3', onLadder()===LADDER_CAP && friends.filter(function(f){return f.x===X&&f.st==='ground';}).length===1, onLadder()+' on, 1 waiting');
  var p0=friends[0].prog; park(X, mid);
  for(var n=0;n<30;n++){ P.tx=P.x+(n%2?-60:60); update(dt); P.ty=P.y; }   // jinking about — not hovering
  var moved=friends[0].prog-p0;
  park(X, mid); var aboard0=rescuedN();
  for(var n=0;n<Math.round((LADDER_CLIMB+0.3)*60);n++){ update(dt); maxOn=Math.max(maxOn,onLadder()); }
  var aboard=friends.filter(function(f){return f.how==='aboard';}).length;
  ok('climbers only climb while you hover', moved < 30/60/LADDER_CLIMB*0.5, 'moving gained '+moved.toFixed(3)+' of a climb');
  ok('climbers become safe once aboard', aboard===LADDER_CAP && rescuedN()-aboard0===LADDER_CAP && maxOn<=LADDER_CAP, aboard+' aboard, max on ladder '+maxOn);
  park(X, low); run(0.1); var late=friends[3], lateOn=late.st==='ladder';
  P.invuln=0; hitPlayer();
  ok('a hit shakes a climber off, never the aboard', lateOn && late.st==='fall' && friends.filter(function(f){return f.how==='aboard'&&f.st==='safe';}).length===LADDER_CAP);
  P.stun=0; P.invuln=0; hp=maxHP; late.cd=99; ladderT=0.05; park(X, mid); run(0.6);
  ok('an empty, spent ladder is stowed back to the rope', P.gear==='rope');

  // a RESCUE front is WINNABLE: bring them all out and it clears on its own
  quiet(R0); lastResult=null;
  for(var i=0;i<friends.length && state==='play' && level===R0;i++){ var fr=friends[i]; park(fr.x, low); run(0.2); park(dropZone().x, low); run(0.2); }
  lr=lastResult||{};
  ok('a rescue front is winnable (all brought out = cleared)', lr.idx===R0 && lr.passed===true, (lr.rescued)+'/'+(lr.stranded)+' · '+lr.reason);

  // the player is NECESSARY: an untouched rescue front is failed by the clock
  startMission(R0); lastResult=null;
  for(k=0;k<60*Math.ceil(levelLen+3) && state==='play' && level===R0;k++){ hp=maxHP; update(dt); }
  lr=lastResult||{};
  ok('an untouched rescue front is FAILED by the clock (the player is necessary)', lr.idx===R0 && lr.passed===false && lr.rescued===0 && lr.reason==='clock',
     lr.reason+' @ '+lr.t+'s · '+lr.rescued+' safe · '+lr.lost+' lost to the legion');

  // BOTH — hold the line while evacuating
  startMission(BOTH);
  ok('the HOLD + EVACUATE front builds the line AND the stranded', defenders.length===DEFENDERS.length && friends.length===LEVELS[BOTH].friends.length && !!dropZone());

  var pass=R.every(function(r){return r.ok;});
  var html='<pre style="font:13px ui-monospace;color:#e9e0d6;background:#03020a;padding:18px;margin:0;min-height:100vh">'
    +'<b style="font-size:18px;color:'+(pass?'#9affc0':'#ff5d6c')+'">PAX GNOMANIA — THE FRONTS (rescue · survival · both) — SELF TEST: '+(pass?'PASS':'FAIL')+'</b>\n\n';
  R.forEach(function(r){ html+=(r.ok?'  <span style="color:#9affc0">OK  </span>':'  <span style="color:#ff5d6c">FAIL</span>')+'  '+r.n+(r.d?'   <span style="color:#7a6f5f">'+r.d+'</span>':'')+'\n'; });
  html+='</pre>';
  document.body.innerHTML=html;
  document.title='PAX SELFTEST '+(pass?'PASS':'FAIL');
  return pass;
}

    amp:H*(0.03+Math.random()*0.05), spd:1.3+Math.random()*1.3, phase:rnd(0,6.28), vx:(170+stg*30+Math.random()*90)*dir, bank:0, fireCd:rnd(0.6,1.4) }); }

function drawDefenders(){
  // Drawn UNDER the legion so a gnome standing on a defender reads as overrun.
  // Damage shows in the sprite itself — a hit flashes it and a wounded defender
  // sits lower and dimmer — rather than in a bar, because the line is the readout.
  for(var i=0;i<defenders.length;i++){ var d=defenders[i];
    if(!d.alive) continue;
    var im=IMG[d.s], ar=(im&&im.ok)? im.naturalWidth/im.naturalHeight : 1.0;
    var w=d.w, h=w/ar;
    var wounded = d.maxhp>0 ? (1 - d.hp/d.maxhp) : 0;
    var a = d.vanish>0 ? clamp(d.vanish/0.5,0,1) : (1 - wounded*0.35);
    if(d.hitT>0){ ctx.save(); ctx.globalCompositeOperation='lighter'; }
    drawImg(d.s, d.x, groundY()+6-h/2 + wounded*h*0.10, w, 0, a, false, !!(d.armed||d.civ));
    if(d.hitT>0) ctx.restore();
    if(d.armed && d.alive && d.hp>0){        // a small standing mark so the armed line reads
      ctx.fillStyle='rgba(154,255,192,'+(0.55*(d.hp/d.maxhp))+')';
      ctx.fillRect(d.x-7, groundY()+9, 14, 2);
    }
  }
}

  var tx=d.x-d.w*0.18, tw=fh*1.5, th=fh*1.1;
  ctx.fillStyle='#2f5f4a'; ctx.beginPath(); ctx.moveTo(tx-tw/2,gy+6); ctx.lineTo(tx,gy+6-th); ctx.lineTo(tx+tw/2,gy+6); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#10231a'; ctx.beginPath(); ctx.moveTo(tx-tw*0.12,gy+6); ctx.lineTo(tx,gy+6-th*0.55); ctx.lineTo(tx+tw*0.12,gy+6); ctx.closePath(); ctx.fill();
  var px=d.x+d.w*0.30, top=gy-fh*2.2, wv=Math.sin(t*4)*2;
  ctx.strokeStyle='#d9d2c0'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(px,gy+6); ctx.lineTo(px,top); ctx.stroke();
  ctx.fillStyle='#39d98a'; ctx.beginPath(); ctx.moveTo(px,top); ctx.lineTo(px+fh*1.4,top+fh*0.3+wv); ctx.lineTo(px,top+fh*0.6); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#032014'; ctx.font='900 '+Math.round(fh*0.34)+'px system-ui'; ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillText('SAFE', px+3, top+fh*0.3);
  ctx.restore();
}
function drawFriends(){
  if(!friends.length) return;
  var gy=groundY(), fh=friendH();
  for(var i=0;i<friends.length;i++){ var f=friends[i];
    if(f.st==='ground'){
      var pose = Math.sin(t*6+f.ph)>0 ? 'stand' : 'wave';
      drawHelpFlag(f.x, gy+6, 1);
      drawFriendFig(f.x, gy+6-fh, pose, f.cd>0?0.6:1);
    } else if(f.st==='fall'){
      drawFriendFig(f.x, f.y+6-fh, 'fall', 1, Math.sin(t*14)*0.4);
    } else if(f.st==='safe' && f.how==='drop'){
      drawFriendFig(f.x, gy+6-fh*0.8, Math.sin(t*5+f.ph)>0?'stand':'wave', 0.9, 0);
    } else if(f.st==='lost' && f.fade>0){
      drawFriendFig(f.x, gy+6-fh, 'fall', clamp(f.fade,0,1)*0.6, 1.3);
    }
  }
}
function drawPickups(){
  for(var i=0;i<pickups.length;i++){ var pk=pickups[i], y=pk.y+Math.sin(t*2.4+i)*6, bw=34, bh=26;
    var blink = pk.ttl<3 ? (Math.floor(t*8)%2?0.35:1) : 1;
    ctx.save(); ctx.globalAlpha=blink; ctx.translate(pk.x,y);
    ctx.fillStyle='#5a3c1c'; ctx.strokeStyle='#ffd23f'; ctx.lineWidth=2; roundRect(-bw/2,-bh/2,bw,bh,4); ctx.fill(); ctx.stroke();
    ctx.strokeStyle='#e6c68a'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(-7,-9); ctx.lineTo(-7,9); ctx.moveTo(7,-9); ctx.lineTo(7,9);
    for(var r=-6;r<=6;r+=6){ ctx.moveTo(-7,r); ctx.lineTo(7,r); } ctx.stroke();
    ctx.fillStyle='#ffd23f'; ctx.font='800 11px system-ui'; ctx.textAlign='center'; ctx.fillText('LADDER',0,-bh/2-5);
    ctx.restore();
  }
}
// THE ROPE's swing is RENDER-ONLY: a damped pendulum on a moving pivot, fed by how the
// drawn hull moves. The logic end never swings, so nothing here can change the game.
var ROPEVIS={ th:0, om:0, lx:null, pv:0 };
function ropeSwing(dt){
  if(ROPEVIS.lx===null){ ROPEVIS.lx=P.x; }
  var vx = dt>0 ? (P.x-ROPEVIS.lx)/dt : 0; ROPEVIS.lx=P.x;
  var ax = dt>0 ? (vx-ROPEVIS.pv)/dt : 0; ROPEVIS.pv=vx;
  var Lp=Math.max(30, ropeLen());
  var acc = -(1400/Lp)*Math.sin(ROPEVIS.th) - 3.2*ROPEVIS.om - (clamp(ax,-5000,5000)/Lp)*Math.cos(ROPEVIS.th);
  ROPEVIS.om += acc*dt; ROPEVIS.th = clamp(ROPEVIS.th + ROPEVIS.om*dt, -0.75, 0.75);
  if(Math.abs(ROPEVIS.th)>=0.75) ROPEVIS.om*=-0.3;
}
function drawRope(){
  if(!friends.length) return;
  var ax=P.x, ay=ropeAnchorY(), Lp=ropeLen(), th=ROPEVIS.th;
  ctx.save(); ctx.translate(ax,ay); ctx.rotate(-th);  // pendulum angle at the hull: end at (L·sin th, L·cos th)
  if(P.gear==='ladder'){
    var lw=8, fade = ladderT<3 && !onLadder() ? (Math.floor(t*8)%2?0.45:1) : 1;
    ctx.globalAlpha=fade; ctx.strokeStyle='#c8a46a'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(-lw,0); ctx.lineTo(-lw,Lp); ctx.moveTo(lw,0); ctx.lineTo(lw,Lp);
    for(var r=10;r<=Lp;r+=10){ ctx.moveTo(-lw,r); ctx.lineTo(lw,r); } ctx.stroke(); ctx.globalAlpha=1;
    for(var i=0;i<friends.length;i++){ var f=friends[i]; if(f.st!=='ladder') continue;
      var along = Lp - f.prog*(Lp-6);
      drawFriendFig(0, along, (Math.floor(f.prog*12)%2)?'climbA':'climbB', 1, 0); }
  } else {
    // a plain line ending in a wooden TOGGLE — a crossbar, never a loop
    ctx.strokeStyle='#c8a46a'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,Lp); ctx.stroke();
    ctx.fillStyle='#8a5a2b'; ctx.strokeStyle='#3a2410'; ctx.lineWidth=1; ctx.fillRect(-9,Lp-2.5,18,5); ctx.strokeRect(-9,Lp-2.5,18,5);
    if(onRope()) drawFriendFig(0, Lp-1, 'hang', 1, 0);
  }
  ctx.restore();
}

function drawTargets(){
  var order=[]; for(var i=0;i<targets.length;i++) if(!targets[i].gone) order.push(i);
  order.sort(function(a,b){ var ca=targets[a], cb=targets[b], la=ca.kind==='vehicle'?0:1, lb=cb.kind==='vehicle'?0:1; return la!==lb? la-lb : ca.y-cb.y; });
  var S=sz();
  for(var o=0;o<order.length;o++){ var c=targets[order[o]];
    var hT = c.kind==='vehicle'?S.vehicle : c.kind==='heavy'?S.heavy : S.gnome;
    if(c.isBoss) hT=S.heavy*1.4;
    var sp = c.sprite;
    var rot = c.lifting? Math.sin(clock*8)*0.2*c.lock : 0;
    var im=IMG[sp], ar=(im&&im.ok)? im.naturalWidth/im.naturalHeight : 1.0, h=hT, w=h*ar;
    var cy = c.lifting? c.y : (groundY()+6 - h/2);
    drawImg(sp, c.x, cy, w, rot, c.lifting?0.94:1, c.dir<0, c.kind!=='vehicle');
    if(!c.lifting && (c.isBoss || c.def.val>=500)){ ctx.fillStyle='#ffd23f'; ctx.font='800 11px system-ui'; ctx.textAlign='center'; ctx.fillText(c.isBoss?'★ GENERAL ★':'HEAVY', c.x, cy-h/2-6); }
  }
}
function drawSaucer(){
  var w=SAUCER_W(), gy=groundY()+8, belly=P.y+w*0.16;
  if(planting && P.stun<=0){
    if(ok('beam')){ var bm=IMG['beam'], bw=(gy-belly)*(bm.naturalWidth/bm.naturalHeight); ctx.save(); ctx.globalAlpha=.82; ctx.drawImage(bm,P.x-bw/2,belly,bw,gy-belly); ctx.restore(); }
    if(ok('ring')) drawImg('ring',P.x,gy,w*0.95,0,0.85);
  }
  var rot=P.bank*0.10, a = P.invuln>0 ? (Math.floor(clock*20)%2?0.4:1) : 1;
  if(warbling()){ var fi=Math.floor(clock*22)%6; if(!drawImg('w'+fi,P.x,P.y,w,rot,0.6+0.3*Math.sin(clock*40))) drawImg('p1',P.x,P.y,w,rot,0.6); }
  else if(!drawImg('p1',P.x,P.y,w,rot,a)){ ctx.fillStyle='#39ff14'; ctx.beginPath(); ctx.ellipse(P.x,P.y,w*0.5,w*0.22,0,0,6.28); ctx.fill(); }
}
function drawShots(){
  for(var s=0;s<shots.length;s++){ var sh=shots[s];
    if(sh.kind==='tracer'){ ctx.strokeStyle=sh.col; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(sh.x,sh.y); ctx.lineTo(sh.x-sh.vx*0.03,sh.y-sh.vy*0.03); ctx.stroke(); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(sh.x,sh.y,2.2,0,6.28); ctx.fill(); }
    else if(sh.kind==='missile'){ var ang=Math.atan2(sh.vy,sh.vx); ctx.save(); ctx.translate(sh.x,sh.y); ctx.rotate(ang); ctx.fillStyle='#ff5d6c'; ctx.fillRect(-8,-3,16,6); ctx.fillStyle='#ffd27a'; ctx.fillRect(-12,-2,5,4); ctx.restore(); }
    else if(sh.kind==='aa'){ ctx.globalAlpha=.45; ctx.fillStyle='#ff5d6c'; ctx.beginPath(); ctx.arc(sh.x,sh.y,7,0,6.28); ctx.fill(); ctx.globalAlpha=1; ctx.fillStyle='#ffb0b6'; ctx.beginPath(); ctx.arc(sh.x,sh.y,3,0,6.28); ctx.fill(); }
    else { ctx.fillStyle=sh.col; ctx.beginPath(); ctx.arc(sh.x,sh.y,3.4,0,6.28); ctx.fill(); }
  }
}
function drawJets(){
  for(var j=0;j<jets.length;j++){ var je=jets[j]; var w=sz().vehicle*2.4;
    if(!drawImg('jet',je.x,je.y,w,je.bank*0.4,1,je.dir<0,false)){ ctx.fillStyle='#cdd6e0'; ctx.fillRect(je.x-w/2,je.y-4,w,8); }
    ctx.globalAlpha=.7; ctx.fillStyle='#ffcf6a'; ctx.beginPath(); ctx.arc(je.x-je.dir*w*0.55,je.y,3+Math.random()*2,0,6.28); ctx.fill(); ctx.globalAlpha=1;
  }
}
function drawFx(){
  for(var f=0;f<fx.length;f++){ var e=fx[f], p=e.t/e.life, a=1-p;
    if(e.kind==='aatel'){ ctx.globalAlpha=0.4+0.6*Math.abs(Math.sin(e.t*30)); ctx.strokeStyle=e.col; ctx.lineWidth=2; ctx.setLineDash([4,4]); ctx.beginPath(); ctx.moveTo(e.x,e.y); ctx.lineTo(e.x,band().top); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha=1; continue; }
    ctx.globalAlpha=a;
    if(e.kind==='boom'){ ctx.fillStyle='#ff7a3a'; ctx.beginPath(); ctx.arc(e.x,e.y,12+p*70,0,6.28); ctx.fill(); ctx.fillStyle='#ffd27a'; ctx.beginPath(); ctx.arc(e.x,e.y,6+p*36,0,6.28); ctx.fill(); }
    else if(e.kind==='snatch'){ ctx.strokeStyle=e.col; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(e.x,e.y,8+p*40,0,6.28); ctx.stroke(); }
    else if(e.kind==='smoke'){ ctx.fillStyle='#9aa'; ctx.beginPath(); ctx.arc(e.x,e.y,3+p*8,0,6.28); ctx.fill(); }
    else { ctx.fillStyle=e.col; ctx.beginPath(); ctx.arc(e.x,e.y,3+p*16,0,6.28); ctx.fill(); }
    ctx.globalAlpha=1;
  }
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawBezel(){ ctx.strokeStyle=TH.edge; ctx.lineWidth=5; ctx.globalAlpha=0.7; roundRect(7,7,W-14,H-14,16); ctx.stroke(); ctx.globalAlpha=1;
  ctx.fillStyle=TH.edge; ctx.font='800 11px ui-monospace'; ctx.textAlign='left'; ctx.globalAlpha=0.8; ctx.fillText(TH.name, 18, H-12); ctx.globalAlpha=1; }
function drawHUD(){
  ctx.textAlign='left'; ctx.fillStyle='#e9e0d6'; ctx.font='800 22px system-ui'; ctx.fillText('SCORE  '+score, 22, 36);
  var hbw=clamp(W*0.18,170,300), hbx=W-22-hbw, hby=20;
  ctx.fillStyle='#1a0c10'; ctx.strokeStyle='#3a1c24'; ctx.lineWidth=1; roundRect(hbx,hby,hbw,16,8); ctx.fill(); ctx.stroke();
  ctx.save(); roundRect(hbx,hby,hbw,16,8); ctx.clip(); ctx.fillStyle= hp>60?'#39ff14':hp>30?'#ffe23a':'#ff5d6c'; ctx.fillRect(hbx,hby,hbw*(hp/maxHP),16); ctx.restore();
  ctx.textAlign='right'; ctx.fillStyle='#9c8a6a'; ctx.font='700 11px system-ui'; ctx.fillText('HULL INTEGRITY', W-22, hby+30);
  ctx.textAlign='center';
  var zoneName = mode==='base'?'THE SIEGE':(LEVELS[level]?LEVELS[level].zone:'');
  ctx.fillStyle='#9c8a6a'; ctx.font='800 13px system-ui'; ctx.fillText('FRONT '+(mode==='base'?'S':(level+1))+'  ·  '+zoneName+(mode==='base'?'':'  ·  '+KIND_NAME[LEVELS[level].kind]), W/2, 22);
  if(defenders.length){            // GUNPOWDER STANDING — the actual objective
    var saved=gpPeople(), total=gpPeopleTotal();
    ctx.font='800 15px system-ui';
    ctx.fillStyle = saved===total? '#9affc0' : saved>total*0.5? '#ffe23a' : '#ff5d6c';
    ctx.fillText('GUNPOWDER  '+saved+' / '+total, W/2, 78);
    if(gpPhase>0){ ctx.font='700 11px system-ui'; ctx.fillStyle='#ff9d3a';
      ctx.fillText(['','PRESSED','GIVING GROUND','ARMOR'][Math.min(gpPhase,3)], W/2, 94); }
  }
  if(friends.length){             // THE STRANDED — the rescue objective
    var rs=rescuedN(), need=LEVELS[level].need, ry=defenders.length?112:78;
    ctx.font='800 15px system-ui'; ctx.fillStyle = rs>=need? '#9affc0' : FRIENDLY_LOOK.col;
    ctx.fillText('SAFE  '+rs+' / '+need+'   ·   stranded '+(friends.length-rs-lostN())+'   ·   lost '+lostN(), W/2, ry);
    ctx.textAlign='left'; ctx.font='800 13px ui-monospace';
    if(P.gear==='ladder'){ ctx.fillStyle='#ffd23f'; ctx.fillText('LADDER '+Math.max(0,Math.ceil(ladderT))+'s  ·  '+onLadder()+'/'+LADDER_CAP+(P.spd<LADDER_HOVER_V?'  CLIMBING':'  hover to climb'), 22, 60); }
    else { ctx.fillStyle='#c8a46a'; ctx.fillText('ROPE  ·  '+(onRope()?'CARRYING — set them down on SAFE':'fly LOW to reach the stranded'), 22, 60); }
    ctx.textAlign='center';
  }
  ctx.fillStyle= stageClock<10?'#ff5d6c':'#fff'; ctx.font='800 30px system-ui'; ctx.fillText(Math.max(0,Math.ceil(stageClock))+'', W/2, 52);
  if(runActive){ ctx.fillStyle='#ff9d3a'; ctx.font='800 14px system-ui'; ctx.globalAlpha=0.6+0.4*Math.sin(clock*9); ctx.fillText('>>> THE LEGION ADVANCES <<<', W/2, 74); ctx.globalAlpha=1; }
  var stg=stageOf(), mw=clamp(W*0.34,260,520), mx=(W-mw)/2, my=H-30;
  ctx.fillStyle='#15100a'; ctx.strokeStyle='#3a2c18'; ctx.lineWidth=1; roundRect(mx,my,mw,14,7); ctx.fill(); ctx.stroke();
  var grad=ctx.createLinearGradient(mx,0,mx+mw,0); grad.addColorStop(0,'#39ff14'); grad.addColorStop(.55,'#ffe23a'); grad.addColorStop(.82,'#ff9d3a'); grad.addColorStop(1,'#ff5d6c');
  ctx.save(); roundRect(mx,my,mw,14,7); ctx.clip(); ctx.fillStyle=grad; ctx.fillRect(mx,my,mw*(meter/100),14); ctx.restore();
  ctx.textAlign='center'; ctx.fillStyle=STAGECOL[stg]; ctx.font='800 12px system-ui'; ctx.fillText('LEGION ALERT — '+STAGENAME[stg], W/2, my-7);
  ctx.textAlign='left'; ctx.fillStyle=GLIDE?'#39ff14':'#ff9d3a'; ctx.font='700 12px ui-monospace'; ctx.fillText('GLIDE '+(GLIDE?'ON':'OFF')+'  accel '+accel+' / damp '+damp, 22, H-26);
  ctx.textAlign='right'; ctx.fillStyle = fps<45?'#ff5d6c':fps<55?'#ffe23a':'#39ff14'; ctx.font='700 12px ui-monospace'; ctx.fillText('FPS '+Math.round(fps)+'  · gnomes '+targets.length+' · shots '+shots.length+(stress?'  · BLITZ':''), W-22, H-26);
  if(msgT>0){ ctx.textAlign='center'; ctx.globalAlpha=clamp(msgT,0,1); ctx.fillStyle=msgColor; ctx.font='800 26px system-ui'; ctx.fillText(msg,W/2,H*0.30); ctx.globalAlpha=1; }
}
function overlay(title,sub){
  ctx.fillStyle='rgba(4,3,10,.74)'; ctx.fillRect(0,0,W,H);
  if(title==='PAX GNOMANIA' && ok('gnomania')) drawImg('gnomania',W/2,H*0.38,Math.min(W*0.42,460),0,1);
  ctx.textAlign='center'; ctx.fillStyle=TH.title; ctx.font='900 '+clamp(W*0.055,38,84)+'px system-ui'; ctx.shadowColor=TH.edge; ctx.shadowBlur=22; ctx.fillText(title,W/2,H*0.55); ctx.shadowBlur=0;
  ctx.fillStyle=TH.edge; ctx.font='800 13px ui-monospace'; ctx.fillText(TH.name,W/2,H*0.55+30);
  ctx.fillStyle='#e9e0d6'; ctx.font='700 16px system-ui'; ctx.fillText(sub,W/2,H*0.55+62);
  if(state!=='title'){ ctx.fillStyle='#9c8a6a'; ctx.font='800 22px system-ui'; ctx.fillText('SCORE  '+score,W/2,H*0.55+98); }
}

var last=0;
function frame(ts){
  var raw=last?(ts-last)/1000:0.016; var dt=Math.min(0.033,raw); last=ts;
  fpsAcc+=raw; if(++fpsN>=15){ fps=fpsN/fpsAcc; fpsAcc=0; fpsN=0; }
  if(state==='boot'){ bootT+=dt; drawBoot(); if(bootT>3.7) state='title'; requestAnimationFrame(frame); return; }
  clock+=dt; update(dt);
  ctx.save(); if(shake>0) ctx.translate(rnd(-shake,shake),rnd(-shake,shake));
  drawBG();
  if(state==='play' && P) ropeSwing(dt);
  if(state!=='title'){ drawDropZone(); drawDefenders(); drawTargets(); drawFriends(); drawShots(); drawJets(); drawPickups(); drawRope(); drawSaucer(); drawFx(); drawHUD(); }
  ctx.restore();
  drawBezel();
  if(state==='title') overlay('PAX GNOMANIA','SPACE = the fronts ('+LEVELS.map(function(l){return KIND_NAME[l.kind];}).join(' → ')+')  ·  1–'+LEVELS.length+' = pick a front  ·  B = siege');
  else if(state==='over') overlay(overTitle||'GUNPOWDER FELL','press SPACE / R to run the fronts again  ·  1–'+LEVELS.length+' = pick a front');
  else if(state==='clear') overlay('PAX GNOMANIA','press SPACE / R to run it again');
  requestAnimationFrame(frame);
}
// ?selftest runs the mission headless and prints a report instead of booting the game.
// ?auto skips boot+title straight into the mission — the headless shot rig's entry,
// so a screenshot shows the LINE under attack rather than a title card.
if(/[?&]auto/.test(location.search)){ bootT=99; var lv=+((location.search.match(/level=(\d+)/)||[])[1]||1); startMission(clamp(lv,1,LEVELS.length)-1); }
if(/[?&]selftest/.test(location.search)){ try{ selfTest(); }catch(e){ document.body.innerHTML='<pre style="color:#ff5d6c;padding:18px">SELFTEST THREW: '+e.message+'\n'+e.stack+'</pre>'; document.title='PAX SELFTEST FAIL'; } }
else requestAnimationFrame(frame);
})();
</script>
