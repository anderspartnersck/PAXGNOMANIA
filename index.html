<title>PAX GNOMANIA</title>
<!--
  PAX GNOMANIA — the web game. Roman Britain, AD 122. You fly Hadrian's secret Ornithopter
  Corps over the Red Hat gnome legion's advance and bring the stranded out on a rope.

  ITS OWN GAME. Not SUCK UP, not THE GUNPOWDER HORROR. Every picture on this page comes from
  the HADRIAN'S ANCIENT AIR FORCE repo (web/art/, built by tools/build_web_art.py from
  assets/). Code ideas are ported from SUCK UP's AIRY pages (the render-only air-cushion
  glide, the rope/ladder rescue rules, the in-page ?selftest) — no art.

  Offline, single page, nothing off-box: no CDN, no web fonts, no analytics.

  URL switches (all documented in the README):
    (none)        the ATTRACT — the TruthJunket special, theme music, any key -> title
    ?title        the title menu            ?campaign   the march from Dover
    ?front=N      straight to front N (1-17) ?march      the campaign map
    ?selftest     proof-of-life report      ?demo       autopilot (with ?front=N)
    &go           skip the briefing card    &seed=N     fix the gameplay RNG
    &ff=S         fast-forward S seconds of play under the autopilot (&idle = hands off)
    &shot=win|fail  run the front to its results / failure screen (the screenshot rig)
    ?outro=K&t=S  THE OUTRO (after front 17) from beat K, S seconds in    ?end  the end card
-->

function synth(slot){
  var d=SFX_SLOTS[slot], ac=AU.ac; if(!d||!ac) return;
  try{ var t=ac.currentTime, g=ac.createGain(); g.gain.setValueAtTime(d[4],t); g.gain.exponentialRampToValueAtTime(0.0008,t+d[3]); g.connect(ac.destination);
    if(d[5]){ var len=Math.max(1,(ac.sampleRate*d[3])|0), buf=ac.createBuffer(1,len,ac.sampleRate), ch=buf.getChannelData(0);
      for(var i=0;i<len;i++) ch[i]=(Math.random()*2-1)*(1-i/len); var nz=ac.createBufferSource(); nz.buffer=buf;
      var bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=d[1]; nz.connect(bp); bp.connect(g); nz.start(t); }
    var o=ac.createOscillator(); o.type=d[0]; o.frequency.setValueAtTime(d[1],t); o.frequency.exponentialRampToValueAtTime(Math.max(20,d[2]),t+d[3]);
    var og=ac.createGain(); og.gain.value=d[5]?0.4:1; o.connect(og); og.connect(g); o.start(t); o.stop(t+d[3]+0.02);
  }catch(e){}
}

/* =====================================================================
   THE FLIGHT — the house air-cushion glide (ported from SUCK UP AIRY):
   input moves a TARGET in steps; the craft springs after it.
   ===================================================================== */
var GLIDE=true, ACCEL=210, DAMP=27, STEP=20, REPEAT=0.055, DELAY=0.11;
function spring(o,tx,ty,dt){
  if(!GLIDE){ o.x=tx; o.y=ty; o.vx=o.vy=0; return; }
  var ox=o.x, oy=o.y;
  o.vx += ((tx-o.x)*ACCEL - o.vx*DAMP)*dt; o.vy += ((ty-o.y)*ACCEL - o.vy*DAMP)*dt;
  o.x += o.vx*dt; o.y += o.vy*dt;
  if((tx-ox)*(tx-o.x)<0){ o.x=tx; o.vx=0; } if((ty-oy)*(ty-o.y)<0){ o.y=ty; o.vy=0; }
}

/* ---------- THE FRONT BUILDER: the authored front -> the front you fly (wide map stretch, then the gnome-side mirror) ----------
   F.ww       world width (default one screen). Legacy x's are stretched by ww/LW; F.wide overrides (world coords) land after.
   SIDE gnome  x -> ww-x (unless mirror:false), the people remapped (gnWho), legion.from flipped, the texts from F.gnome. */
function buildFront(idx, side){
  var B=FRONTS[idx], O={}, k; for(k in B) O[k]=B[k];
  var ww=B.ww||LW, S=B.world?1:ww/LW, gn=side==='gnome', mir=gn && B.mirror!==false, Wd=B.wide||{}, G=B.gnome||{};
  var M=function(x){ return mir ? ww-x : x; }, X=function(x){ return M(x*S); };
  O.ww=ww; O.side=side; O.mir=mir; O.src=B;
  O.friends=B.friends.map(function(d,i){ return { x:X(d.x), who:gn?gnWho(d.who,i):d.who, rock:d.rock }; });
  if(Wd.friends) Wd.friends.forEach(function(x,i){ if(x!=null && O.friends[i]) O.friends[i].x=M(x); });
  O.drop={ x:Wd.drop!=null?M(Wd.drop):X(B.drop.x), w:B.drop.w, label:gn?(G.dropLabel||'THE RED HAT CAMP' /* DRAFT */):B.drop.label, surf:B.drop.surf };
  O.drop0=null;
  if(B.depot||Wd.spots){ O.depot={}; for(k in (B.depot||{})) O.depot[k]=B.depot[k];
    if(Wd.spots) O.depot.spots=Wd.spots.map(M); else if(B.depot&&B.depot.spots) O.depot.spots=B.depot.spots.map(X);
    if(gn){ O.depot.name=G.depotName||(O.depot.kind==='cradle'?'THE RED HAT CRADLE':'THE RED HAT PEN') /* DRAFT */; if(!O.depot.crew||O.depot.crew==='screws'||O.depot.crew==='thopters') O.depot.crew='taken'; } }
  else if(gn) O.depot={ name:G.depotName||'THE RED HAT PEN', crew:'taken' };
  O.ladders=(B.ladders||[]).map(function(l){ return { at:l.at, x:X(l.x) }; }); if(Wd.ladders) O.ladders=Wd.ladders.map(function(l){ return {at:l.at, x:M(l.x)}; });
  if(B.roofs) O.roofs=B.roofs.map(function(r){ return { x:Wd.roofs?r.x:X(r.x), w:r.w, h:r.h }; }).map(function(r,i){ if(Wd.roofs) r.x=M(Wd.roofs[i]); return r; });
  if(B.gear) O.gear=B.gear.map(function(g,i){ return { x:Wd.gear?M(Wd.gear[i]):X(g.x), kind:g.kind }; });
  if(B.siege) O.siege=B.siege.map(function(s,i){ return { x:Wd.siege?M(Wd.siege[i]):X(s.x), at:s.at }; });
  if(B.swarm){ var a=X(B.swarm.x0), b=X(B.swarm.x1); O.swarm={ n:B.swarm.n, x0:Math.min(a,b), x1:Math.max(a,b) }; }
  O.legion={}; for(k in B.legion) O.legion[k]=B.legion[k];
  if(mir && B.legion.from!=='both') O.legion.from = B.legion.from==='left' ? 'right' : 'left';
  if(B.legion.xmax){ if(mir){ O.legion.xmin=ww-B.legion.xmax*S; delete O.legion.xmax; } else O.legion.xmax=B.legion.xmax*S; }
  O.ramFromL = mir;
  if(B.muster) O.muster={ x:M(B.muster.x), every:B.muster.every, max:B.muster.max, who:B.muster.who, start:B.muster.start };
  if(B.escort){ O.escort={}; for(k in B.escort) O.escort[k]=B.escort[k]; O.escort.emps=B.escort.emps.map(M);
    O.escort.party=B.escort.party.map(function(p,i){ return { x:M(p.x), who:gn?gnWho(p.who,i):p.who }; }); }
  // THE SUPPLY (Claude 1113b, the Antonine Wall): Rome's crewed scorpios run on bolts carried from THE ARMOURY. Rome only — the
  // gnome side of the last front is the breakthrough (its own phases), not a mirrored supply run.
  O.supply=null; if(B.supply && !gn){ O.supply={ emps:B.supply.emps.map(X), ammo:B.supply.ammo, cap:B.supply.cap, per:B.supply.per,
    armoury:{ x:X(B.supply.armoury.x), every:B.supply.armoury.every, max:B.supply.armoury.max, start:B.supply.armoury.start } }; }
  if(B.forum!=null) O.forum=X(B.forum);
  if(gn){ ['title','latin','brief','subs','place','endAll','endHorn','phases','barks','newThing','need'].forEach(function(t){ if(G[t]!=null) O[t]=G[t]; });
    if(G.war) O.war=Object.assign({}, B.war||{}, G.war);   // per-side war tuning (the mirror is not always symmetric)
    if(!G.brief) O.brief='THE SAME BATTLE, FROM THE RED HAT SIDE. Bring the wounded and the cut-off back to '+O.drop.label+'. Drop fresh red hats where the line bends. THE RAY lifts the Roman machines.' /* DRAFT */;
    if(!G.latin) O.latin=(B.latin||'')+' · FOR THE LEGION OF THE RED HAT' /* DRAFT */;
    if(!G.subs) O.subs=null; if(!G.endAll) O.endAll='EVERY RED HAT WHO COULD BE BROUGHT OUT, WAS.' /* DRAFT */; if(!G.endHorn) O.endHorn='THE WAR-HORN SOUNDED WITH ENOUGH SAFE.' /* DRAFT */; O.tips=false; }
  return O;
}

/* =====================================================================
   THE MISSIONS — Joe 11/12: "longer rounds might make more sense for pax gnomania … we dont have a ton of stages."
   Every front is a PHASED mission of 3 phases that change the situation. Between phases, a BEAT (BEAT s): the Legion
   falls back to regroup, nothing new spawns (every spawn clock runs off el = F.clock − stageClock, and the beat starts
   el at −BEAT), and a Wolfe / Davius / Hadrian cutaway says what changed. Phase 0 IS the authored front (FRONTS above);
   PHASES[key][1..] are deltas on top of it. Kinds:
     rescue  bring out `need` of THIS phase's stranded before the phase clock (the horn rule as before)
     hold    keep the line (on the Wall: the walk) for `clock` s; any stranded are optional STRAGGLERS
     push    drive the line `gain` toward the enemy before the clock
   The pen/lift loop, troop drops, ladders and the escort carry across. Each phase escalates: phase++ (phaseMul: legion
   and hazard cadence, legion size), its own machine list, surges every ×(1 − 0.12·k). The 1.5 s volley telegraph and
   every arc are untouched; so are the rope/ladder/platform rules.
   CHECKPOINT: failing in phase k>0 offers RETRY FROM PHASE k at −CKPT_PEN (not from scratch). ?short = the old
   one-phase round (the quarter-eater switch). x is WORLD x on the Rome side (the gnome side mirrors it).
   Every name / sub / line here is DRAFT copy for Joe.
   ===================================================================== */

// (default one screen). camX is SIM state (eased toward the craft each tick), so hazards that key off the view stay seeded.
var camX=0;
function WW(){ return (F&&F.ww)||LW; }
function camTarget(){ return clamp(P.x-LW/2+clamp(P.vx,-400,400)*0.35, 0, WW()-LW); }
function camTick(dt){ camX += (camTarget()-camX)*Math.min(1,dt*3.2); camX=clamp(camX,0,WW()-LW); }
function bandBot(){ return GY()-30-ANCHOR-ROPE_LEN; }
function ropeEndY(){ return P.y+ANCHOR+ROPE_LEN; }
function dropSurf(){ return GY()+(F.drop.surf||0); }
function inDrop(x){ return Math.abs(x-F.drop.x) <= F.drop.w/2 && depotOpen(); }
function pressStop(){ return F.bridge ? F.bridge.x1-24 : F.drop.x-F.drop.w/2-20; }   // THE PRESS never leaves the bridge
function surfAt(x){ if(inDrop(x)) return dropSurf(); var rf=roofAt(x); return rf ? GY()-rf.h : GY(); }
function roofAt(x){ for(var i=0;i<roofs.length;i++){ var r=roofs[i]; if(r.st!=='burn' && Math.abs(x-r.x)<=r.w/2) return r; } return null; }
function flash(m,c,s){ msg=m; msgCol=c||'#efe3c4'; msgT=s||1.2; }
function mkFriend(x,who,i,rock){ var w=WHO[who]; return { x:x, who:who, w:w, rock:rock||0, st:'ground', y:GY()-(rock||0), vy:0, cd:0, prog:0, fade:0, how:'', ph:i*1.7, sink:0 }; }
function objF(f){ return !f.muster && !f.escort && !f.ammo && (f.ph==null || f.ph===mph); }   // + THIS phase's stranded only (THE MISSIONS)       // the stranded you are scored on (not the muster's fresh troops, not the escort party)
function objN(){ var n=0; for(var i=0;i<friends.length;i++) if(objF(friends[i])) n++; return n; }
function rescuedN(){ var n=0; for(var i=0;i<friends.length;i++) if(friends[i].st==='safe' && objF(friends[i])) n++; return n; }
function lostN(){ var n=0; for(var i=0;i<friends.length;i++) if(friends[i].st==='lost' && objF(friends[i])) n++; return n; }
function riders(){ var a=[]; for(var i=0;i<friends.length;i++) if(friends[i].st==='ride') a.push(friends[i]); return a; }
function onRope(){ for(var i=0;i<friends.length;i++) if(friends[i].st==='rope') return friends[i]; return null; }
function onLadder(){ var n=0; for(var i=0;i<friends.length;i++) if(friends[i].st==='ladder') n++; return n; }
function spinning(){ return simT < P.spinU; }

function newPlayer(){ var y=(BAND_TOP+bandBot())/2, x=F.drop.x<WW()/2?F.drop.x+120:F.drop.x-120;
  return { x:x, y:y, tx:x, ty:y, vx:0, vy:0, bank:0, face:x<WW()/2?1:-1, spinU:-9, spinCd:-9, stun:0, invuln:0, gear:'rope', spd:0, lock:null, raying:false }; }

function startFront(idx, opt){
  opt=opt||{};
  if(opt.side) SIDE=opt.side;
  fi=idx; F=buildFront(idx, SIDE); seed(opt.seed!=null?opt.seed:(SEED+idx*7919));
  F.drop0={x:F.drop.x, w:F.drop.w, label:F.drop.label, surf:F.drop.surf};
  F.drop={x:F.drop0.x, w:F.drop0.w, label:F.drop0.label, surf:F.drop0.surf}; depotStart();
  if(!opt.retry) scoreAtStart=score; else score=scoreAtStart;
  hp=HULL; simT=0; stageClock=F.clock; hornSet=false;
  P=newPlayer(); camX=clamp(P.x-LW/2,0,WW()-LW); legion=[]; haz=[]; shots=[]; fx=[]; pickups=[]; F.barked_=0;
  nf={left:0,right:0,up:0,down:0}; was={left:0,right:0,up:0,down:0};   // the key-repeat clock is sim time: reset it with the sim (a held arrow across a RETRY froze that direction)
  ladderT=0; ladderSpawned={}; tipDone={}; hzLog=[];
  friends=F.friends.map(function(d,i){ return mkFriend(d.x, d.who, i, d.rock); });
  emps=[]; unloadT=0; musterN=0; musterT=F.muster?(F.muster.start!=null?F.muster.start:5):1e9;
  if(F.escort){ emps=F.escort.emps.map(function(x,i){ return { x:x, i:i, st:'empty', sight:0, crew:null, fireT:1.0, shots:0, shotAt:-9, tx:0, ty:0 }; });
    F.escort.party.forEach(function(p,i){ var f=mkFriend(p.x, p.who, friends.length, 0); f.escort=true; friends.push(f); }); }
  if(F.supply){ emps=F.supply.emps.map(function(x,i){ return { x:x, i:i, st:'manned', supply:true, ammo:F.supply.ammo, silent:false, sight:EMP_SIGHT, crew:null, fireT:1.5+i*0.9, shots:0, shotAt:-9, tx:0, ty:0 }; }); }
  armouryT=F.supply?F.supply.armoury.start:1e9; armouryN=0;
  hzT={}; var H=F.hazards||{};
  ['bolts','arrows','upbolts','thopters','gliders','stones'].forEach(function(k){ hzT[k]= H[k] ? H[k].start : 1e9; });
  legionT=F.legion.start;
  waterY = F.water ? GY()+F.water.from : 1e9;
  pressX = F.press ? F.press.from : -1e9;
  siege=(F.siege||[]).map(function(s){ return { x:s.x, at:s.at, st:'pending', t:0, sent:0, nextT:0, art:(s.x%2?'tower':'ladders') }; });
  gear=(F.gear||[]).map(function(g){ var G=GEAR[g.kind]; return { x:g.x, kind:g.kind, G:G, hp:G.hp||GEAR_HP, max:G.hp||GEAR_HP, att:0, hitT:-9, wreck:false }; });
  roofs=(F.roofs||[]).map(function(r){ return { x:r.x, w:r.w, h:r.h, st:'ok', t:0, gT:0 }; }); ramSpawned={};
  if(F.swarm) for(var n=0;n<F.swarm.n;n++) spawnGnome(F.legion.kinds[(rng()*F.legion.kinds.length)|0], rr(F.swarm.x0,F.swarm.x1), -1);
  stats={ beamed:0, dodged:0, hits:0, lost:0, spun:0, troops:0, empShots:0, blue:0, fed:0, silentS:0 }; blueT=0; blueWarn=0; barkQ=null; barkT=0; barkCd={};
  warStart(opt.seed!=null?opt.seed:(SEED+idx*7919)); btFront=null;
  lastResult=null; ROPEVIS={th:0,om:0,lx:null,pv:0};
  CK=null; if(!opt.ck) ckUses=0; missionStart(); if(opt.ck) applyCheckpoint(opt.ck);
  state = opt.go ? 'play' : 'brief'; rt=0;
  if(state==='play') beginPlay();
}
function beginPlay(){ state='play'; flash(F.title, '#e8c66a', 1.8); if(!demo){ sfx('coin'); playMusic(F.music, 0.7); } }
function barkTick(){ if(F.barks && !F.barked_ && simT>=1.9){ F.barked_=1; flash(F.barks[(SEED+fi)%F.barks.length],'#ffd29a',2.0); } }
function retryFront(){ startFront(fi,{retry:true, go:true}); }

/* =====================================================================
   INPUT — keyboard + gamepad + autopilot all write the same intents.
   ===================================================================== */
var keys={}, inp={left:0,right:0,up:0,down:0,ray:0,spin:0}, nf={left:0,right:0,up:0,down:0}, was={left:0,right:0,up:0,down:0}, spinWas=0;
var KEYDIR={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',ArrowDown:'down',s:'down'};
var pad={left:0,right:0,up:0,down:0,ray:0,spin:0,start:0,back:0}, padWas={};
function readPad(){
  if(NODE||!navigator.getGamepads) return; var gps=navigator.getGamepads(), g=null;
  for(var i=0;i<gps.length;i++) if(gps[i]&&gps[i].connected){ g=gps[i]; break; }
  pad={left:0,right:0,up:0,down:0,ray:0,spin:0,start:0,back:0}; if(!g) return;
  var ax=g.axes[0]||0, ay=g.axes[1]||0, b=function(i){ return g.buttons[i]&&g.buttons[i].pressed?1:0; };
  pad.left=(ax<-0.45||b(14))?1:0; pad.right=(ax>0.45||b(15))?1:0; pad.up=(ay<-0.45||b(12))?1:0; pad.down=(ay>0.45||b(13))?1:0;
  pad.ray=b(0)||b(7); pad.spin=b(1)||b(2)||b(6); pad.start=b(9); pad.back=b(8);
  var edges=['up','down','left','right','ray','spin','start','back'];
  for(var k=0;k<edges.length;k++){ var e=edges[k]; if(pad[e]&&!padWas[e]) onPress(padKey(e)); padWas[e]=pad[e]; }
}
function padKey(e){ return {up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight',ray:' ',spin:'f',start:'Enter',back:'Escape'}[e]; }
if(!NODE){
  addEventListener('keydown',function(e){ var k=e.key.length===1?e.key.toLowerCase():e.key; if(e.isTrusted&&!e.metaKey&&!e.ctrlKey&&wakeEat()){ keys[k]=1; if(/^(Arrow| )/.test(e.key)) e.preventDefault(); return; } if(!keys[k]){ keys[k]=1; onPress(k); }
    if(/^(Arrow| )/.test(e.key)||e.key===' ') e.preventDefault(); });
  addEventListener('keyup',function(e){ var k=e.key.length===1?e.key.toLowerCase():e.key; keys[k]=0; });
  addEventListener('blur',function(){ keys={}; });
  addEventListener('pointerdown',function(e){ if(e.isTrusted&&wakeEat()) return; if(state==='attract') onPress('Enter'); });
}
function gatherInput(){
  if(autopilot){ var a=autopilot(); inp.left=a.left|0; inp.right=a.right|0; inp.up=a.up|0; inp.down=a.down|0; inp.ray=a.ray|0; inp.spin=a.spin|0; return; }
  inp.left = keys.ArrowLeft||keys.a||pad.left?1:0; inp.right= keys.ArrowRight||keys.d||pad.right?1:0;
  inp.up   = keys.ArrowUp||keys.w||pad.up?1:0;     inp.down = keys.ArrowDown||keys.s||pad.down?1:0;
  inp.ray  = keys[' ']||keys.z||pad.ray?1:0;        inp.spin = keys.f||keys.x||keys.Shift||pad.spin?1:0;
}

/* ---------- menus ---------- */
var menuI=0, selI=0, idleT=0;
var MENU=['THE CAMPAIGN','CHOOSE A FRONT','THE TRUTHJUNKET SPECIAL','HOW TO FLY'];
var PAUSE=['RESUME','HOW TO FLY','SOUND','GLIDE','RETRY THIS FRONT','QUIT TO TITLE'].concat(qp('from')==='keep'?['QUIT TO ARCADE']:[]), pauseI=0, pauseHow=false;
function onPress(k){
  idleT=0;
  if(k==='m'){ AU.muted=!AU.muted; if(AU.cur) AU.cur.volume=AU.muted?0:(AU.cur._v||0.8); flash(AU.muted?'SOUND OFF':'SOUND ON','#efe3c4',0.8); return; }
  if(k==='g'&&state==='play'){ GLIDE=!GLIDE; flash('GLIDE '+(GLIDE?'ON':'OFF'),'#efe3c4',0.7); return; }
  var go = (k===' '||k==='Enter'), back=(k==='Escape');
  if(state==='attract'){ if(ATTRACT[atk].k==='ident') return; toTitle(); sfx('menu_select'); return; }   // CK BOOT: the CK ident plays out; any later attract card -> the title
  if(state==='title'){
    if(k==='ArrowUp'||k==='w'){ menuI=(menuI+MENU.length-1)%MENU.length; sfx('menu_move'); }
    else if(k==='ArrowDown'||k==='s'){ menuI=(menuI+1)%MENU.length; sfx('menu_move'); }
    else if(go){ sfx('menu_select');
      if(menuI===0){ campaign=true; score=0; blueRun=0; runSaved=0; startFront(0); }
      else if(menuI===1){ state='select'; selI=0; }
      else if(menuI===2){ toAttract(); }
      else { state='howto'; } }
    else if(back){ toAttract(); }
    return;
  }
  if(state==='howto'){ if(go||back){ sfx('menu_back'); state='title'; } return; }
  if(state==='select'){
    var built=MARCH.filter(function(m){return m.f!=null;});
    if(k==='ArrowUp'||k==='w'){ selI=(selI+built.length-1)%built.length; sfx('menu_move'); }
    else if(k==='ArrowDown'||k==='s'){ selI=(selI+1)%built.length; sfx('menu_move'); }
    else if(k==='ArrowLeft'||k==='ArrowRight'||k==='a'||k==='d'||k==='Tab'){ SIDE=GN()?'rome':'gnome'; sfx('menu_move'); }
    else if(/^[1-9]$/.test(k) && +k<=built.length){ selI=+k-1; campaign=false; score=0; sfx('menu_select'); startFront(built[selI].f); }
    else if(go){ campaign=false; score=0; sfx('menu_select'); startFront(built[selI].f); }
    else if(back){ sfx('menu_back'); state='title'; }
    return;
  }
  if(state==='brief'){ if(go){ sfx('menu_select'); beginPlay(); } else if(back){ sfx('menu_back'); toTitle(); } return; }
  if(state==='play'){ if(back||k==='p'||(go&&k==='Enter')){ if(demo){ if(back) toTitle(); } else { state='paused'; pauseI=0; pauseHow=false; sfx('menu_move'); } } else if(k==='r'&&!demo){ retryFront(); } return; }
  if(state==='paused'){ // UI-AUDIT 1110: the pause menu (ESC / P / START). The sim does not tick while paused.
    if(pauseHow){ if(go||back){ sfx('menu_back'); pauseHow=false; } return; }
    if(k==='ArrowUp'||k==='w'){ pauseI=(pauseI+PAUSE.length-1)%PAUSE.length; sfx('menu_move'); }
    else if(k==='ArrowDown'||k==='s'){ pauseI=(pauseI+1)%PAUSE.length; sfx('menu_move'); }
    else if(back||k==='p'){ sfx('menu_back'); state='play'; }
    else if(go){ var it=PAUSE[pauseI]; sfx('menu_select');
      if(it==='RESUME') state='play';
      else if(it==='HOW TO FLY') pauseHow=true;
      else if(it==='SOUND') onPress('m');
      else if(it==='GLIDE'){ GLIDE=!GLIDE; }
      else if(it==='RETRY THIS FRONT') retryFront();
      else if(it==='QUIT TO TITLE') toTitle();
      else if(it==='QUIT TO ARCADE') location.href="../../COLEMAN'S KEEP.html"; }
    return;
  }
  if(state==='failed'){ if(rt<0.9) return; var ckOn=lastResult&&lastResult.ck>0&&CK;   // THE MISSIONS: R / SPACE retries from the phase you fell in (−CKPT_PEN); T restarts the whole front
    if(ckOn && (go||k==='r')){ sfx('menu_select'); retryCheckpoint(); } else if(go||k==='r'||k==='t'){ sfx('menu_select'); retryFront(); } else if(back){ sfx('menu_back'); toTitle(); } return; }
  if(state==='results'){ if(rt<0.9) return;   // CK BOOT: ~0.9 s results hold
    if(k==='r'){ sfx('menu_select'); retryFront(); return; }
    if(go){ sfx('menu_select'); if(F.ending && lastResult && lastResult.passed){ startOutro(); } else if(campaign){ state='march'; rt=0; playMusic('theme',0.6); } else { state='select'; playMusic('theme',0.6); } }   // 1113b: the last front -> THE OUTRO
    else if(back){ toTitle(); } return; }
  if(state==='march'){ if(go){ sfx('menu_select'); var nx=nextBuilt(fi); if(nx<0){ startOutro(); } else startFront(nx); } else if(back){ toTitle(); } return; }
  if(state==='outro'){ if(otT<0.9) return; if(go){ sfx('menu_select'); outroNext(); } else if(back){ state='end'; rt=0; playMusic('theme',0.6); } return; }
  if(state==='end'){ if(rt<0.9) return; if(go||back){ sfx('menu_select'); toTitle(); } return; }
}
function nextBuilt(f){ for(var i=0;i<MARCH.length;i++) if(MARCH[i].f===f){ for(var j=i+1;j<MARCH.length;j++) if(MARCH[j].f!=null) return MARCH[j].f; } return -1; }
function toTitle(){ demo=false; autopilot=null; state='title'; rt=0; idleT=0; playMusic('theme',0.75); }
function toAttract(){ demo=false; autopilot=null; state='attract'; rt=0; atk=0; atT=0; playMusic('theme',0.8); restartMusic(); }

/* =====================================================================
   UPDATE — the sim (play state only). Fixed rules, rng() only.
   ===================================================================== */
function update(dt){
  simT+=dt; stageClock-=dt; if(msgT>0) msgT-=dt; if(shake>0) shake=Math.max(0,shake-dt*40);
  if(P.stun>0) P.stun-=dt; if(P.invuln>0) P.invuln-=dt;
  var el=F.clock-stageClock;
  gatherInput(); pump(dt);
  var px=P.x, py=P.y; spring(P,P.tx,P.ty,dt); P.spd=Math.hypot(P.x-px,P.y-py)/Math.max(dt,1e-6);
  if(P.spd>SWOOP_SPD && !P.swoopOn && simT>=(P.swoopCd||0) && P.stun<=0){ sfx('swoop'); P.swoopCd=simT+SWOOP_CD; } P.swoopOn=P.spd>SWOOP_SPD*0.7;   // FLYER 3/4
  P.bank += (clamp(P.vx/190,-1,1)-P.bank)*Math.min(1,7*dt);
  if(Math.abs(P.vx)>40) P.face = P.vx>0?1:-1;
  camTick(dt);
  if(inp.spin && !spinWas && simT>=P.spinCd && P.stun<=0){ P.spinU=simT+SPIN_TIME; P.spinCd=simT+SPIN_CD; sfx('spin'); stats.spun++; }
  spinWas=inp.spin;

  if(F.water && el>=F.water.start) waterY -= F.water.rate*dt;
  if(F.press && el>=F.press.start) pressX = Math.min(pressStop(), pressX + F.press.rate*dt);
  warTick(dt, el); depotTick(dt); roofTick(dt); legionTick(dt, el); siegeTick(dt, el); hazardTick(dt, el); shotTick(dt); rayTick(dt); rescueTick(dt, el); blueTick(dt); empTick(dt); tipsTick(); barkTick();
  for(var f=fx.length-1;f>=0;f--){ fx[f].t+=dt; if(fx[f].t>fx[f].life) fx.splice(f,1); }
  if(war && usR()<war.W.breakAt+0.08) bark('line');
  if(PREC && war){ PREC.low=Math.min(PREC.low,usR()); PREC.bmax=Math.max(PREC.bmax,war.breach); }
  if(beatT>0) beatT-=dt; if(cardT>0) cardT-=dt;
  if(barkT>0) barkT-=dt;
  endCheck();
}
function pump(dt){
  var dirs=['left','right','up','down'], bb=maxY();
  P.raying = !!(inp.ray && P.stun<=0 && !spinning());
  for(var i=0;i<4;i++){ var d=dirs[i], h=inp[d] && !P.raying && P.stun<=0;
    if(h && !was[d]){ nf[d]=simT; was[d]=1; nf[d+'_first']=1; }
    if(!h){ was[d]=0; continue; }
    if(simT>=nf[d]){
      if(d==='left') P.tx-=STEP; else if(d==='right') P.tx+=STEP; else if(d==='up') P.ty-=STEP; else P.ty+=STEP;
      nf[d] = nf[d+'_first'] ? simT+DELAY : nf[d]+REPEAT; nf[d+'_first']=0;
    }
  }
  P.tx=clamp(P.tx,60,WW()-60); P.ty=clamp(P.ty,(autopilot&&!autopilot.reckless)?BAND_TOP:SKY_TOP,bb);
}
// how low the craft may fly: the rope's end can reach a standing figure's hands; a rider's feet never go into the ground
function maxY(){ var r=onRope(), m=bandBot(); if(r){ m=Math.min(m, GY()+4-r.w.h-ANCHOR-ROPE_LEN); } return m; }

/* ---------- the Red Hat Legion on foot ---------- */
function spawnGnome(kindName, x, dir, y){
  var k=(GN()?LEGION_R:LEGION)[kindName]; legion.push({ kind:kindName, k:k, x:x, bornX:x, y:y==null?GY():y, dir:dir, lock:0, lifting:false, gone:false, strikeCd:rr(0.4,1.0), climb:false, hunts:!!F.legion.hunts });
}
function legionTick(dt, el){
  var Lg=F.legion;
  (F.rams||[]).forEach(function(rm,ri){ if(!ramSpawned[ri] && el>=rm.at){ ramSpawned[ri]=1; spawnGnome('ram', F.ramFromL?-80:WW()+80, F.ramFromL?1:-1); hzLog.push({type:'ram', tele:0}); flash('A RAM IS COMING FOR THE GATE — HOLD THE RAY ON IT','#ff9a7a',1.6); sfx('war_machine'); } });
  if(el>=legionT && stageClock>(Lg.stopAt||6)){ legionT=el+Lg.every*rr(0.85,1.15)*(1-0.3*warHeat())*phaseMul();
    var live=0; for(var i=0;i<legion.length;i++) if(!legion[i].gone) live++;
    for(var n=0;n<Lg.size+Math.min(1,phase) && live<Lg.max+phase;n++,live++){
      var fromL = Lg.from==='left' ? true : Lg.from==='right' ? false : rng()<0.5;
      spawnGnome(Lg.kinds[(rng()*Lg.kinds.length)|0], fromL? -30-n*46 : WW()+30+n*46, fromL?1:-1);
    }
  }
  for(var q=0;q<gear.length;q++){ gear[q].att=0; gear[q].q=0; }
  for(var i=legion.length-1;i>=0;i--){ var g=legion[i];
    if(g.gone){ legion.splice(i,1); continue; }
    if(g.lifting) continue;
    if(g.climb){ g.y-=g.climbV*dt; if(g.y<=GY()){ g.y=GY(); g.climb=false; g.dir = g.x<WW()/2?1:-1; } continue; }
    if(g.k.ram){ var gt=null, ga=1e9; for(var q=0;q<gear.length;q++){ var p=gear[q], ah=(p.x-g.x)*g.dir; if(!p.wreck && ah>-6 && ah<ga){ ga=ah; gt=p; } }
      if(gt){ if(ga>gt.G.reach+34) g.x+=g.dir*g.k.spd*dt; else { g.rank=0; hackGear(g,gt,dt); } }
      else { g.x+=g.dir*g.k.spd*0.5*dt; if(g.x<-200||g.x>WW()+200) g.gone=true; }
      continue; }
    if(depotRaid(g,dt)) continue; g.raiding=false;
    var tgt=null, td=1e9;
    if(g.hunts) for(var q=0;q<friends.length;q++){ var fr=friends[q]; if(fr.st!=='ground') continue; var d=Math.abs(fr.x-g.x); if(d<td){ td=d; tgt=fr; } }
    if(tgt){ g.dir = tgt.x>g.x?1:-1;
      var gb = gear.length ? gearBlock(g,tgt) : null;
      if(gb){ g.grab=0; g.grabbing=null; hackGear(g,gb,dt); }
      else if(td>30){ g.x += g.dir*g.k.spd*dt; g.grab=0; g.grabbing=null; }
      else { if(g.grabbing!==tgt){ g.grab=0; g.grabbing=tgt; } g.grab+=dt; if(g.grab>=CAPTURE_TIME){ g.grab=0; g.grabbing=null; loseFriend(tgt,'captured'); } } }
    else {
      g.grab=0; g.grabbing=null;
      g.x += g.dir*g.k.spd*dt;

function depotCfg(){ var D={},k, fd=F.depot||{}; for(k in DEPOT_DEF) D[k]=DEPOT_DEF[k]; for(k in fd) D[k]=fd[k];
  if(!D.spots) D.spots=[F.drop0.x]; if(!D.name) D.name = D.kind==='pen' ? 'THE PEN' : 'THE CRADLE'; return D; }
function depotStart(){ var D=depotCfg(); phase=0; depot={ D:D, i:0, n:0, st:'open', t:0, serial:1, lifts:0, drops:0, raids:0, phases:0, raidG:null }; F.drop.x=D.spots[0]; }
function depotOpen(){ return !depot || depot.st==='open'; }
function depotNow(){ return depot ? depot.D.name : F.drop.label; }
function depotIn(f){ return f.st==='safe' && f.how==='drop' && f.serial===depot.serial; }
// where the depot is drawn right now (it rides the lift up and away, or comes down under the fresh flight)
function depotPose(){ var x=F.drop.x, y=dropSurf(), a=1;
  if(!depot) return {x:x,y:y,a:a,hook:0};
  var D=depot.D, u;
  if(depot.st==='lift'){ u=clamp(depot.t/D.liftT,0,1); var up=u<0.3?0:ease((u-0.3)/0.7);
    return { x:x+up*260*(x<WW()/2?-1:1), y:y-up*820, a:1, hook:u<0.3?u/0.3:1, crewY:u<0.3? lerp(-160, y-150, ease(u/0.3)) : y-150-up*820 }; }
  if(depot.st==='drop'){ u=clamp(depot.t/D.dropT,0,1); var dn=ease(u);
    return { x:x, y:lerp(y-820,y,dn), a:1, hook:1, crewY:lerp(-670,y-150,dn) }; }
  return {x:x,y:y,a:a,hook:depot.st==='full'?0.5:0};
}
function depotTick(dt){
  if(!depot) return; var D=depot.D; depot.t+=dt;
  if(depot.st==='open' && depot.n>=D.cap){ depot.st='full'; depot.t=0; flash(D.name+' IS FULL — THE LIFT IS CALLED','#e8c66a',1.6); sfx('horn'); hzLog.push({type:'lift', tele:D.liftDelay}); }
  else if(depot.st==='full' && depot.t>=D.liftDelay){ depot.st='lift'; depot.t=0; sfx('lift_in'); }
  else if(depot.st==='lift' && depot.t>=D.liftT){
    depot.lifts++; score+=LIFT_PTS*depot.n; flash(D.name+' IS AWAY — '+depot.n+' OUT  +'+(LIFT_PTS*depot.n),'#7fe7ff',1.4);
    for(var i=0;i<friends.length;i++) if(depotIn(friends[i])) friends[i].away=true;
    depot.n=0; depot.serial++;
    if(D.after==='phase'){ phase++; depot.phases++; flash((F.phases&&F.phases[phase-1])||'THE FRONT SHIFTS — THE LEGION LEANS IN','#ff9a7a',2.0); }
    depot.i=(depot.i+1)%D.spots.length; F.drop.x=D.spots[depot.i]; depot.st='drop'; depot.t=0; depot.drops++; sfx('lift_in'); }
  else if(depot.st==='drop' && depot.t>=D.dropT){ depot.st='open'; depot.t=0; flash('A FRESH '+D.name.replace(/^THE /,'')+' IS DOWN','#e8c66a',1.0); }
}
// a red hat that reaches a pen with people in it stops and RAIDS it (one at a time); returns true while raiding
function depotRaid(g,dt){
  if(!depot || depot.st!=='full' || !depot.n || g.k.ram || g.climb) return false;
  if((F.drop.surf||0) < -60) return false;   // HIGH GROUND: the red hats can't get up to a raised pen   // only a FULL pen, waiting on its lift, can be raided
  if(Math.abs(g.x-F.drop.x) > F.drop.w/2+DEPOT_RAID_R) return false;
  if(depot.raidG && depot.raidG!==g && !depot.raidG.gone && !depot.raidG.lifting) return true;   // the rest wait at the stockade
  depot.raidG=g; g.raiding=true; g.raid=(g.raid||0)+dt;
  if(g.raid>=DEPOT_RAID_T){ g.raid=0; var v=null; for(var i=friends.length-1;i>=0;i--) if(depotIn(friends[i])){ v=friends[i]; break; }
    if(v){ v.st='pen'; loseFriend(v,'raided'); depot.n--; depot.raids++; } }
  return true;
}
function phaseMul(){ return (1-0.09*Math.min(3,phase))*(PK()==='hold'?1.4:1); }   // THE MISSIONS: each phase a little faster; a HOLD phase's sky a touch thinner (the job there is the line)

/* ---------- LONDON PROPER: the roofs. A roof that stands behind the red hats' line for ROOF_TORCH s gets a fire pot:
   it SMOKES (the telegraph, ROOF_SMOKE s), then BURNS — whoever is still up on it is lost. ---------- */
var ROOF_TORCH=2.5, ROOF_SMOKE=7.0;
function roofTick(dt){
  for(var i=0;i<roofs.length;i++){ var r=roofs[i]; r.t+=dt;
    if(r.st==='ok'){ if(war && (r.x-warX())*toEnemy() > -r.w*0.25){ r.gT+=dt; if(r.gT>=ROOF_TORCH){ r.st='smoke'; r.t=0; sfx('fire_pot'); flash('A FIRE POT ON THE ROOFS — CLEAR THAT ROOF','#ff9a5a',1.4); } } else r.gT=Math.max(0,r.gT-dt); }
    else if(r.st==='smoke' && r.t>=ROOF_SMOKE){ r.st='burn'; r.t=0; hzLog.push({type:'roof', tele:ROOF_SMOKE}); sfx('stone_impact');
      for(var q=0;q<friends.length;q++){ var f=friends[q]; if(f.st==='ground' && f.rock>0 && Math.abs(f.x-r.x)<=r.w/2+8) loseFriend(f,'burned'); } }
  }
}

/* =====================================================================
   THE DODGE — every hazard is TELEGRAPHED before it can hurt. Each logs
   how long it warned (hzLog) and the ?selftest holds it to HZ_MIN.
   ===================================================================== */
function hazardTick(dt, el){
  var H=F.hazards||{};
  function due(k){ if(H[k] && el>=hzT[k] && stageClock>3){ hzT[k]=el+H[k].every*rr(0.8,1.2)*(1-0.25*warHeat())*phaseMul(); return true; } return false; }
  if(due('bolts')) spawnShooter('bolt', false);
  if(due('upbolts')) spawnShooter('bolt', true);
  if(due('arrows')) spawnShooter('arrow', false);
  if(due('thopters')) spawnThopter();
  if(due('gliders')) spawnGlider();
  if(due('stones')) spawnStone();
  for(var i=haz.length-1;i>=0;i--){ var h=haz[i]; h.t+=dt;
    if(h.k==='shooter') tickShooter(h,dt); else if(h.k==='thopter') tickThopter(h,dt); else if(h.k==='glider') tickGlider(h,dt); else if(h.k==='stone') tickStone(h,dt);
    if(h.done) haz.splice(i,1);
  }
}
function liveShooters(){ var n=0; for(var i=0;i<haz.length;i++) if(haz[i].k==='shooter'&&haz[i].st!=='fired') n++; return n; }
function spawnShooter(type, up){
  if(liveShooters()>=2) return;
  var S=SHOOTER[type], x;
  if(type==='arrow'){ do { x=camX+rr(240,LW-120); } while(Math.abs(x-P.x)<220); }
  else if(F.boltFrom==='south' && !up) x = rr(40,230);   // LONDON: every crew is on the south bank
  else { x = camX + (rng()<0.5 ? rr(60,300) : rr(LW-300,LW-60)); if(up) x=camX+rr(120,LW-120); }
  var gy = up ? LH-24 : GY();
  haz.push({ k:'shooter', type:type, S:S, up:!!up, st:'setup', t:0, x:x, gy:gy, y:gy-S.crewH*0.6, ax:P.x, ay:P.y, aimT:0 });
}
function tickShooter(h,dt){
  var S=h.S;
  if(h.st==='setup'){ if(h.t>=S.setup){ h.st='aim'; h.t=0; sfx('bolt_aim'); } return; }
  if(h.st==='aim'){
    h.aimT=h.t;
    if(h.t<S.track){ h.ax=P.x; h.ay=P.y; }
    else if(!h.locked){ h.locked=true; sfx('bolt_lock'); }
    if(h.t>=S.track+S.lock){
      var dx=h.ax-h.x, dy=h.ay-h.y, L=Math.hypot(dx,dy)||1;
      shots.push({ kind:S.shot, x:h.x, y:h.y, vx:dx/L*S.speed, vy:dy/L*S.speed, t:0, life:2.4, tele:h.aimT, type:h.up?'upbolt':h.type });
      hzLog.push({ type:h.up?'upbolt':h.type, tele:h.aimT });
      h.st='fired'; h.t=0; sfx(S.shot==='arrow'?'arrow_loose':'bolt_fire'); fxAdd(h.x,h.y,'spark','#ffd27a',0.25);
    }
    return;
  }
  if(h.st==='fired' && h.t>=0.8) h.done=true;
}
function spawnThopter(){ var dir=rng()<0.5?1:-1;
  haz.push({ k:'thopter', st:'warn', t:0, dir:dir, x:dir>0?camX-200:camX+LW+200, y:clamp(P.y,BAND_TOP,bandBot()), art:GN()?'thopter':(rng()<0.5?'taken_thopter':'taken_thopter_b') }); sfx('thopter_warn'); }
function tickThopter(h,dt){
  if(h.st==='warn'){ if(h.t>=THOPTER_TELE){ h.st='cross'; h.warned=h.t; h.t=0; hzLog.push({type:'thopter', tele:h.warned}); sfx('thopter_pass'); } return; }
  if(h.st==='cross'){ h.x += h.dir*THOPTER_SPEED*dt;
    if(!h.hit && Math.abs(h.x-P.x)<THOPTER_HW && Math.abs(h.y-P.y)<THOPTER_HH){
      if(spinning()){ h.hit=true; retreat(h,'SENT PACKING'); score+=250; sfx('clank'); }
      else if(P.invuln<=0){ h.hit=true; hitPlayer('thopter'); retreat(h); } }
    var r=onRope(); if(r && !h.hit && Math.abs(h.x-r.x)<THOPTER_HW*0.8 && Math.abs(h.y-(r.y-r.w.h*0.5))<THOPTER_HH+10) releaseFriend(r,'CLIPPED BY A TAKEN THOPTER — THEY LET GO');
    if((h.dir>0&&h.x>camX+LW+260)||(h.dir<0&&h.x<camX-260)){ if(!h.hit) stats.dodged++; h.done=true; }
    return; }
  if(h.st==='retreat'){ h.x += h.dir*THOPTER_SPEED*0.45*dt; h.y -= 140*dt; h.sc=Math.max(0.15,(h.sc||1)-dt*0.55); if(h.t>2.2) h.done=true; }
}
function retreat(h,label){ h.st='retreat'; h.t=0; h.sc=1; if(label) flash(label,'#9fe08a',0.9); }   // planes RETREAT into the distance — never crash
function spawnGlider(){ var dir=rng()<0.5?1:-1, y=clamp(P.y+rr(-50,50),BAND_TOP,bandBot());
  haz.push({ k:'glider', st:'warn', t:0, dir:dir, x:dir>0?camX-90:camX+LW+90, y:y, base:y, amp:rr(26,46), ph:rr(0,6), art:rng()<0.5?'glider':'glider_b' }); sfx('glider_warn'); }
function tickGlider(h,dt){
  if(h.st==='warn'){ if(h.t>=GLIDER_TELE){ h.st='fly'; h.warned=h.t; h.t=0; sfx('glider_pass'); hzLog.push({type:'glider', tele:h.warned}); } return; }
  if(h.st==='fly'){ h.x+=h.dir*GLIDER_SPEED*dt; h.y=h.base+Math.sin(h.t*2.2+h.ph)*h.amp;
    if(!h.hit && Math.hypot(h.x-P.x,h.y-P.y)<GLIDER_R){
      if(spinning()){ h.hit=true; retreat(h,'SENT PACKING'); score+=200; sfx('clank'); }
      else if(P.invuln<=0){ h.hit=true; hitPlayer('glider'); retreat(h); } }
    var r=onRope(); if(r && !h.hit && Math.hypot(h.x-r.x,h.y-(r.y-r.w.h*0.5))<GLIDER_R*0.8) releaseFriend(r,'A GLIDER CLIPPED THE ROPE — THEY LET GO');
    if((h.dir>0&&h.x>camX+LW+120)||(h.dir<0&&h.x<camX-120)){ if(!h.hit) stats.dodged++; h.done=true; }
    return; }
  if(h.st==='retreat'){ h.x+=h.dir*GLIDER_SPEED*0.5*dt; h.y-=120*dt; h.sc=Math.max(0.15,(h.sc||1)-dt*0.6); if(h.t>2.0) h.done=true; }
}
function spawnStone(){ var fromL=P.x>camX+LW/2, cx=camX+(fromL?70:LW-70);
  haz.push({ k:'stone', st:'aim', t:0, cx:cx, cy:GY()-40, tx:P.x, ty:P.y, fromL:fromL }); sfx('stone_launch'); }
function stonePos(h,u){ var mx=(h.cx+h.tx)/2, my=Math.min(h.cy,h.ty)-320; var a=(1-u)*(1-u), b=2*(1-u)*u, c=u*u; return { x:a*h.cx+b*mx+c*h.tx, y:a*h.cy+b*my+c*h.ty }; }
function tickStone(h,dt){
  if(h.st==='aim'){ if(h.t>=STONE_TELE){ h.st='fly'; h.t=0; } return; }
  if(h.st==='fly'){ if(h.t>=STONE_FLY){
      h.st='done'; h.done=true; hzLog.push({type:'stone', tele:STONE_TELE}); sfx('stone_impact');
      fxAdd(h.tx,h.ty,'dust',null,0.6);
      if(Math.hypot(P.x-h.tx,P.y-h.ty)<STONE_R){
        if(spinning()){ flash('CLANK — THE SCREW TURNS IT','#9fe08a',0.8); sfx('clank'); score+=100; }
        else if(P.invuln<=0) hitPlayer('stone'); }
      else stats.dodged++;
      var r=onRope(); if(r && Math.hypot(r.x-h.tx,(r.y-r.w.h*0.5)-h.ty)<STONE_R) releaseFriend(r,'THE STONE SHOOK THEM LOOSE');
    } }
}
function shotTick(dt){
  for(var s=shots.length-1;s>=0;s--){ var sh=shots[s]; sh.t+=dt; sh.x+=sh.vx*dt; sh.y+=sh.vy*dt;
    if(!sh.harmless && Math.hypot(sh.x-P.x,sh.y-P.y) < (spinning()?58:40)){
      if(spinning() && D8_SPIN_DEFLECTS){ var dx=sh.x-P.x, dy=sh.y-P.y, L=Math.hypot(dx,dy)||1, sp=Math.hypot(sh.vx,sh.vy);
        sh.vx=dx/L*sp*0.9; sh.vy=dy/L*sp*0.9-80; sh.harmless=true; fxAdd(sh.x,sh.y,'ring','#9fe08a',0.35); sfx('clank'); score+=50; if(war){ warThem(-1); war.turned++; } }
      else if(P.invuln>0){ shots.splice(s,1); continue; }
      else { hitPlayer(sh.type); shots.splice(s,1); continue; }
    }
    if(!sh.harmless){ var r=onRope(); if(r && Math.hypot(sh.x-r.x, sh.y-(r.y-r.w.h*0.5))<28){ shots.splice(s,1); releaseFriend(r,'HIT ON THE ROPE — THEY LET GO'); continue; }
      for(var q=0;q<friends.length;q++){ var f=friends[q]; if(f.st==='ladder' && Math.hypot(sh.x-f.x, sh.y-(f.y-f.w.h*0.5))<26){ shots.splice(s,1); releaseFriend(f,'HIT ON THE LADDER — THEY LET GO'); break; } } }
    if(sh.t>sh.life || sh.x<camX-80||sh.x>camX+LW+80||sh.y<-80||sh.y>LH+80){ if(sh.t>0.2 && !sh.harmless) stats.dodged++; shots.splice(s,1); }
  }
}
function hitPlayer(src){
  if(spinning()||P.invuln>0) return;
  hp-=HIT_DMG; P.stun=HIT_STUN; P.invuln=HIT_INVULN; shake=16; stats.hits++; sfx('hit'); fxAdd(P.x,P.y,'boom',null,0.6);
  releaseAll('HIT! THEY LET GO');
  if(hp<=0){ hp=0; }
}

/* ---------- THE RAY: hold to plant; the god-ray lifts a red hat out of the fight ---------- */
function rayTick(dt){
  var keep=P.keep; P.lock=null;
  if(P.raying){
    // STICKY: the ray stays on what it already holds while that is still under you (no thrash between targets — 0928 finding)
    if(keep && keep.M && keep.st!=='lifted' && war && war.mach.indexOf(keep)>=0 && Math.abs(keep.x-P.x)<RAY_REACH+24){ warRay(dt, keep); P.keep=P.lock; return; }
    if(keep && keep===(war&&war.wiz) && keep.st!=='lifted' && Math.abs(keep.x-P.x)<RAY_REACH+24){ warRay(dt, keep); P.keep=P.lock; return; }
    var best=RAY_REACH, bi=-1;
    if(keep && keep.k && !keep.gone && legion.indexOf(keep)>=0 && Math.abs(keep.x-P.x)<RAY_REACH+10) bi=legion.indexOf(keep);
    else
    for(var i=0;i<legion.length;i++){ var g=legion[i]; if(g.gone) continue; var d=Math.abs(g.x-P.x); if(d<best && g.y>P.y){ best=d; bi=i; } }
    if(war && war.mach.some(function(m){ return m.st!=='lifted' && Math.abs(m.x-P.x)<RAY_REACH+24; })){ warRay(dt); P.keep=P.lock; return; }   // a war machine outranks a passing red hat
    if(bi>=0){ var g=legion[bi]; if(!g.lifting) sfx('ray_on'); P.lock=g; g.lifting=true; g.lock=clamp(g.lock+dt/g.k.lock,0,1);
      if(g.lock>=1){ g.gone=true; score+=g.k.val; stats.beamed++; fxAdd(P.x,P.y+30,'ring','#ffe9a8',0.5); sfx('ray_take'); } }
    else warRay(dt);
  } else if(war) war.lift=Math.max(0,war.lift-dt*2);
  P.keep=P.lock;
  for(var i=0;i<legion.length;i++){ var g=legion[i]; if(g!==P.lock && g.lock>0){ g.lock=Math.max(0,g.lock-dt*1.6); if(g.lock<=0) g.lifting=false; } }
}

/* =====================================================================
   THE RESCUE — rope (hangs, one at a time), ladder (climb while you hover),
   the stranded, the drop-off. FRIENDLIES CANNOT BE RAYED: the ray only
   ever searches `legion`; the stranded live in `friends`.
   ===================================================================== */
function saveFriend(f,how){ if(f.st==='safe'||f.st==='lost') return;
  f.st='safe'; f.how=how; f.prog=0; score+=RESCUE_PTS; sfx('deliver'); warMorale(WAR_RESCUE_MORALE); if(f.w.troop && how!=='line') warFiles(WAR_LEG_FILES);
  if(how==='drop'){ f.x=clamp(f.x,F.drop.x-F.drop.w*0.4,F.drop.x+F.drop.w*0.4); f.y=dropSurf();
    if(depot){ depot.n++; f.serial=depot.serial; var dw=F.drop.w*0.62, cp=Math.max(2,depot.D.cap); f.dx=-dw/2+((depot.n-1)%cp)*dw/(cp-1); } }
  fxAdd(f.x, how==='aboard'?P.y:f.y-20, 'ring', '#7fe7ff', 0.5);
  flash((how==='aboard'?'ABOARD — SAFE':'SAFE')+'  +'+RESCUE_PTS,'#7fe7ff',0.9); if(how!=='line') bark('rescue');
  hornCheck();
}
function hornCheck(){
  if(PK()==='rescue' && rescuedN()>=F.need && !hornSet && escDone()){ hornSet=true; if(rescuedN()<objN()){ stageClock=Math.min(stageClock,HORN_AFTER_NEED); flash('ENOUGH ARE SAFE — THE HORN IN '+HORN_AFTER_NEED+'. BRING THE REST?','#e8c66a',2.2); sfx('horn'); } }
}
function loseFriend(f,how){ if(f.st==='safe'||f.st==='lost') return;
  f.st='lost'; f.how=how; f.fade=1; sfx('lost');
  if(how==='blue'){ stats.blue++; blueRun++; warMorale(-2*WAR_LOST_MORALE); flash('LOST TO THE BLUE  −'+BLUE_PEN,'#9fd0ff',1.6); bark(f.w.vip?'blueVip':'blue'); return; }
  if(f.ammo){ flash('THE BOLTS ARE LOST — THE ARMOURY WILL SEND MORE','#ff8a5a',1.0); return; }   // 1113b: a sack is not a soul (no morale, not on the card)
  stats.lost++; warMorale(-WAR_LOST_MORALE);
  flash(how==='raided'?'THE RED HATS RAIDED '+depotNow()+' — ONE TAKEN': how==='burned'?'THE ROOF WENT UP — ONE LOST': how==='captured'?'THE LEGION TOOK ONE OF OURS': how==='drowned'?'THE WASH TOOK ONE': how==='swept'?(F.press&&F.press.fire?'THE FIRE PUT ONE IN THE RIVER':'THE PRESS PUT ONE IN THE RIVER'):'LOST IN THE FALL','#ff8a5a',1.2); }

/* ---------- THE SUPPLY (Claude 1113b — Joe 13/11: "from the roman side, you must fight the tide and provide ammo to the bolt throwers") ----------

   each one holds `ammo` bolts and spends one a shot (every SUPPLY_EVERY s). At 0 it falls SILENT: it stops shooting, and every silent
   scorpio pushes the breach up SILENT_BREACH a second. THE ARMOURY keeps sending armourers with a sack of bolts (WHO.bolts): carry one
   (the rope, or riders on a ladder) and set them down LOW at a scorpio — it takes `per` bolts (to `cap`). A hold with `feed:N` must see N
   sacks delivered before its clock, or THE SCORPIOS FALL SILENT (the phase fails). Fed scorpios shoot the red hats on the walk and the

/* =====================================================================
   THE AUTOPILOT — a competent scripted pilot (the ?selftest's "can it be
   won" policy, the ?demo, and the attract's live reconstruction). It
   reads the telegraphs exactly as a player would: never the RNG.
   ===================================================================== */
function makePilot(opts){
  opts=opts||{};
  var mem={evadeT:0, ey:0, ex:null, hoverT:0};
  var fn=function(){
    var o={left:0,right:0,up:0,down:0,ray:0,spin:0};
    if(opts.idle || !P) return o;
    var tx=P.x, ty=P.y, bb=maxY(), threat=false, r=onRope();
    // --- 0. the war's volleys: never be under one when it comes down (spin if it is too late)
    if(war) for(var vi=0;vi<war.volleys.length;vi++){ var v=war.volleys[vi], half=v.w/2+50;
      if(Math.abs(P.x-v.x)<half){ threat=true; tx = v.x + (P.x>=v.x?1:-1)*(half+60); if(v.st==='fall'||v.t>WAR_VOLLEY_TELE-0.25){ if(simT>=P.spinCd && !opts.noSpin) o.spin=1; } } }
    // --- 1. threats (telegraphs) ---
    for(var i=0;i<haz.length;i++){ var h=haz[i];
      if(h.k==='shooter' && h.st==='aim'){ var dx=h.ax-h.x, dy=h.ay-h.y, L=Math.hypot(dx,dy)||1, nx=-dy/L, ny=dx/L, d=(P.x-h.x)*nx+(P.y-h.y)*ny;
        if(Math.abs(d)<70 && h.t>h.S.track*0.5){ threat=true; ty = P.y + (P.y>(BAND_TOP+bb)/2 ? -150 : 150); tx = P.x + (d>=0?1:-1)*nx*120; } }
      if(h.k==='thopter' && (h.st==='warn'||h.st==='cross') && Math.abs(h.y-P.y)<THOPTER_HH+60){ threat=true; ty = h.y + (h.y>(BAND_TOP+bb)/2 ? -150 : 150); }
      if(h.k==='glider' && (h.st==='warn' || (h.st==='fly' && (h.x-P.x)*h.dir<0 && Math.abs(h.x-P.x)<420)) && Math.abs(h.y-P.y)<110){ threat=true; ty = h.y + (h.y>(BAND_TOP+bb)/2 ? -170 : 170); }
      if(h.k==='stone' && Math.hypot(P.x-h.tx,P.y-h.ty)<STONE_R+70){ threat=true; tx = h.tx + (P.x>=h.tx?1:-1)*200; }
    }
    for(var s=0;s<shots.length;s++){ var sh=shots[s]; if(sh.harmless) continue; var ddx=P.x-sh.x, ddy=P.y-sh.y, dd=Math.hypot(ddx,ddy);
      if(dd<170 && (ddx*sh.vx+ddy*sh.vy)>0 && simT>=P.spinCd && !opts.noSpin) o.spin=1; }
    for(var i=0;i<haz.length;i++){ var h=haz[i]; if((h.k==='thopter'&&h.st==='cross'&&Math.abs(h.x-P.x)<240&&Math.abs(h.y-P.y)<THOPTER_HH+20)||(h.k==='stone'&&h.st==='fly'&&h.t>STONE_FLY-0.3&&Math.hypot(P.x-h.tx,P.y-h.ty)<STONE_R)) { if(simT>=P.spinCd) o.spin=1; } }

    else if(mem.evadeT>0){ mem.evadeT-=1/60; ty=mem.ey; tx=mem.ex; threat=true; }
    // --- 2. the job ---
    if(!threat && war && !opts.noRay && !opts.noWar && !(P.gear==='ladder'&&onLadder()>0&&onLadder()<LADDER_CAP) && !(F.supply && !GN() && (carryingAmmo() || supplyUrgent() && war.breach<0.6))){   // --- 1b. the war: stop what is breaking the line

      if(!wt && !r && danger && (!F.wall||GN()||push) && !(push && F.muster && musterWaiting()) && !(push && F.wall && legion.some(function(g){ return !g.gone && !g.climb; }))) wt={x:warX()};   // a red hat on the walk comes first

    }

          else if(f){ tx=f.x; ty = Math.abs(P.x-f.x)>160 ? Math.min(bb-60, grabY(f)-40) : grabY(f); } else { tx=dropX; ty=(BAND_TOP+bb)/2; } }

    if(ty<P.ty-tol) o.up=1; else if(ty>P.ty+tol) o.down=1;

  };

  // RECKLESS (sweep only): zips up hard whenever it is moving with people on — the LOST TO THE BLUE stress
  var rk=function(){ var o=fn(); if(P && loaded() && (o.left||o.right)){ o.up=1; o.down=0; } return o; }; rk.reckless=true; return rk;
}

function curEmp(){ for(var i=0;i<emps.length;i++) if(emps[i].st!=='manned') return emps[i]; return null; }

function pilotJob(opts,bb,r){

  var R=riders();
